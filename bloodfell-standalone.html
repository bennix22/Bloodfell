/* Called every animation frame while a fight is running. */
UI.tickCombat = function (force) {
  const pEl = document.getElementById("f-player");
  const eEl = document.getElementById("f-enemy");
  const cEl = document.getElementById("chronicle");
  if (!pEl || !eEl || !cEl) return;

  const st = Combat.stats || computeStats();
  const php = Combat.active ? Combat.player.hp : st.maxHp;
  const pmp = Combat.active ? Combat.player.mana : st.maxMana;

  let buffs = "";
  if (Combat.active) {
    for (const b of Combat.player.buffs) {
      buffs += `<span class="buff">${b.name} ${b.remaining.toFixed(0)}s</span>`;
    }
    if (Combat.player.shield) {
      buffs += `<span class="buff shield">${Combat.player.shield.name} ${fmt(Combat.player.shield.amount)}</span>`;
    }
    for (const h of Combat.player.hots) {
      buffs += `<span class="buff">${h.name} x${h.ticksLeft}</span>`;
    }
  }

  pEl.innerHTML = `
    <div class="who"><b>${S.name === "Nameless" ? "You" : S.name}</b><span class="lv">level ${S.level}</span></div>
    <div class="roleline">${st.weapon.scalesWith === "int" ? "Caster" : st.weapon.scalesWith === "agi" ? "Duelist" : "Fighter"}</div>
    <div class="bar hp"><i style="width:${clamp(php / st.maxHp * 100, 0, 100)}%"></i></div>
    <div class="hpnum">${fmt(php)} / ${fmt(st.maxHp)}</div>
    <div class="bar mana" style="margin-top:6px"><i style="width:${clamp(pmp / st.maxMana * 100, 0, 100)}%"></i></div>
    <div class="hpnum">${fmt(pmp)} mana</div>
    <div class="buffrow">${buffs}</div>`;

  const e = Combat.enemy;
  if (e) {
    let dots = "";
    const depthLabel = e.depth
      ? ` <span class="depth-tag">depth ${e.depth} \u00B7 +${Math.round(e.depth * DEPTH_POWER_PER_KILL * 100)}%</span>` : "";
    for (const d of e.dots) dots += `<span class="buff dot">${d.name} x${d.ticksLeft}</span>`;
    const esc = e.isBoss && e.kills
      ? ` <span class="elite-tag">+${Math.round((e.escalation - 1) * 100)}% hp, +${Math.round((e.escalationDmg - 1) * 100)}% dmg from ${e.kills} kills</span>` : "";
    const elite = e.elite ? ` <span class="elite-tag">Elite +${Math.round(e.eliteBonus * 100)}%</span>` : "";
    eEl.innerHTML = `
      <div class="who"><b>${e.name}</b><span class="lv">level ${e.level}</span></div>
      <div class="roleline">${e.roleLabel}${elite}${esc}${depthLabel}</div>
      <div class="bar hp"><i style="width:${clamp(e.hp / e.maxHp * 100, 0, 100)}%"></i></div>
      <div class="hpnum">${fmt(e.hp)} / ${fmt(e.maxHp)}</div>
      <div class="buffrow">${dots}</div>`;
  } else {
    eEl.innerHTML = `<div class="who"><b style="color:var(--dim)">No target</b></div>
      <div class="roleline">waiting</div>`;
  }

  // spell bar: what is ready, what is on cooldown, what you cannot afford
  const sb = document.getElementById("spellbar");
  if (sb) {
    const spells = unlockedSpells();
    if (!spells.length) {
      sb.innerHTML = `<div class="spellbar-empty">No spells yet \u2014 spend 5 points in a talent tree.</div>`;
    } else {
      sb.innerHTML = spells.map(sp => {
        const cd = Combat.active ? (Combat.player.cds[sp.id] || 0) : 0;
        const affordable = !Combat.active || Combat.player.mana >= Combat.spellCost(sp);
        const onCd = cd > 0;
        const full = sp.cd * (1 - (st.cdr || 0) / 100);
        const pct = onCd ? clamp((1 - cd / full) * 100, 0, 100) : 100;
        const cls = onCd ? "cooling" : (affordable ? "ready" : "poor");
        return `<div class="spellchip ${cls}" data-tip="spell:${sp.id}">
          <i style="width:${pct}%"></i>
          <span class="sc-name">${sp.name}</span>
          <span class="sc-cd">${onCd ? cd.toFixed(1) + "s" : (affordable ? "ready" : "mana")}</span>
        </div>`;
      }).join("");
    }
  }

  // chronicle — only rewrite when there is something new
  if (force || cEl.dataset.seq !== String(Combat.logSeq)) {
    cEl.dataset.seq = String(Combat.logSeq);
    cEl.innerHTML = Combat.log.map(l => `<div class="line ${l.c}">${l.t}</div>`).join("");
    cEl.scrollTop = cEl.scrollHeight;
  }

  const status = document.getElementById("fightstatus");
  if (status) {
    status.textContent = Combat.active
      ? `${Combat.fightTime.toFixed(1)}s`
      : (S.settings.autoGrind && UI.grind ? "next fight incoming\u2026" : "idle");
  }
};

/* ---------------------------------------------------------------- realms */
function renderRealms() {
  const cards = REALMS.map(realm => {
    const open = realmUnlocked(realm);
    const kills = S.kills[realm.id] || 0;
    const active = UI.grind && UI.grind.mode === "realm" && UI.grind.id === realm.id;
    const running = S.run.realmId === realm.id && S.run.depth > 0;
    const t = TIER_MATS[realm.tier];
    const mats = [MATERIALS[t.metal].name, MATERIALS[t.herb].name].join(", ");

    return `<div class="card ${open ? "" : "locked"} ${active ? "active" : ""}">
      <div class="meta">Realm ${REALMS.indexOf(realm) + 1} \u00B7 level ${realm.lvl} \u00B7 ${realm.enemies.length} foes</div>
      <h4>${realm.name}</h4>
      <div class="desc">${realm.desc}</div>
      <div class="meta" style="color:var(--dim)">drops ${mats}</div>
      ${running ? `<div class="meta" style="color:var(--brass)">
        run in progress \u2014 depth ${S.run.depth}, +${Math.round(S.run.depth * DEPTH_POWER_PER_KILL * 100)}% enemy power,
        +${S.run.depth * DEPTH_FIND_PER_KILL}% magic find</div>` : ""}
      <div class="foot">
        ${open
          ? `<button class="btn ${active ? "" : "primary"}" onclick="startRealm('${realm.id}')">
               ${active && Combat.active ? "Fighting" : (running ? "Continue" : "Enter")}</button>
             ${kills ? `<span class="tag">${fmt(kills)} slain</span>` : ""}`
          : `<span class="tag red">${realmLockReason(realm)}</span>`}
      </div>
    </div>`;
  }).join("");

  return `<div class="phead">
      <h2>Realms</h2>
      <p>Every realm drops materials of its own tier and the experience to keep climbing.
         Later realms open only when the raid boss holding the way is dead.</p>
      <p>Health and mana <b>carry between fights</b>, and every kill drives you one step deeper: enemies gain
         ${Math.round(DEPTH_POWER_PER_KILL * 100)}% health and damage, and drop
         ${DEPTH_FIND_PER_KILL}% better, per step. Dying ends the run and costs you the depth.
         Retreating ends it too, but you choose the moment.</p>
    </div>
    ${combatControls()}
    ${(Combat.active || UI.grind) ? arenaHtml() : ""}
    <div class="grid g3">${cards}</div>`;
}

function startRealm(id) {
  const realm = realmById(id);
  if (!realm || !realmUnlocked(realm)) return;
  UI.grind = { mode: "realm", id };
  Combat.log = [];
  Combat.start("realm", realm);
  UI.render();
}

function stopFighting() {
  Combat.stop();
  UI.grind = null;
  S.settings.autoGrind = false;
  saveGame();
  UI.render();
}

/* Walking out restores you but abandons the depth you had built. */
function doRetreat() {
  const depth = retreatFromRun();
  Combat.stop();
  UI.grind = null;
  S.settings.autoGrind = false;
  Sound.play("potion", 0);
  UI.toast(depth ? `Withdrew from depth ${depth}, rested and whole.` : "Rested.", "good");
  UI.render();
}

/* ----------------------------------------------------------------- raids */
function renderRaids() {
  const blocks = RAIDS.map(raid => {
    const open = raidUnlocked(raid);
    const bosses = raid.bosses.map((boss, i) => {
      const avail = bossUnlocked(raid, i);
      const kills = S.bossKills[boss.id] || 0;
      const escHp = Math.round(kills * ESCALATION_HP_PER_KILL * 100);
      const escDmg = Math.round(kills * ESCALATION_DMG_PER_KILL * 100);
      const active = UI.grind && UI.grind.mode === "boss" && UI.grind.id === boss.id;

      const unlocks = [];
      if (boss.unlocks.realms) for (const r of boss.unlocks.realms) { const x = realmById(r); if (x) unlocks.push(x.name); }
      if (boss.unlocks.raids) for (const r of boss.unlocks.raids) { const x = raidById(r); if (x) unlocks.push(x.name); }

      const drops = boss.drops.map(d =>
        `<div style="font-size:11.5px;padding:1px 0">
           <span class="r-${d.rarity}">${d.name}</span>
           <span style="color:var(--dim);font-family:var(--mono);font-size:10px"> ${(d.chance * 100).toFixed(1)}%</span>
         </div>`).join("");

      return `<div class="card ${avail ? "" : "locked"} ${active ? "active" : ""}">
        <div class="meta">Boss ${i + 1} \u00B7 level ${boss.lvl}${kills ? ` \u00B7 slain ${kills}\u00D7` : ""}</div>
        <h4>${boss.name}${boss.title ? `<span style="color:var(--ash);font-size:13px">, ${boss.title}</span>` : ""}</h4>
        <div class="desc">${boss.blurb}</div>
        ${kills ? `<div class="meta" style="color:var(--brass)">+${escHp}% health, +${escDmg}% damage from ${kills} repeat kills</div>` : ""}
        ${unlocks.length ? `<div class="meta">opens ${unlocks.join(", ")}</div>` : ""}
        <div style="border-top:1px solid var(--edge);padding-top:7px;margin-top:2px">
          <div class="meta" style="margin-bottom:3px">Unique drops</div>${drops}
        </div>
        <div class="foot">
          ${avail
            ? `<button class="btn ${active ? "" : "primary"}" onclick="startBoss('${boss.id}')">
                 ${active && Combat.active ? "Fighting" : "Challenge"}</button>`
            : `<span class="tag red">${bossLockReason(raid, i)}</span>`}
        </div>
      </div>`;
    }).join("");

    return `<div class="panel">
      <h3>${raid.name}${open ? "" : " \u2014 locked"}</h3>
      <p style="color:var(--ash);font-size:12.5px;margin:-4px 0 14px">${raid.desc}</p>
      ${open ? `<div class="grid g3">${bosses}</div>`
             : `<div class="empty">${raidLockReason(raid)}</div>`}
    </div>`;
  }).join("");

  return `<div class="phead">
      <h2>Raids</h2>
      <p>Bosses hold the keys to the deeper realms. Each one you kill gets permanently stronger &mdash;
         ${(ESCALATION_HP_PER_KILL * 100).toFixed(1)}% health and ${(ESCALATION_DMG_PER_KILL * 100).toFixed(1)}% damage
         per victory &mdash; so farming a unique drop eventually pushes you elsewhere for better gear.</p>
    </div>
    ${combatControls()}
    ${(Combat.active || UI.grind) ? arenaHtml() : ""}
    ${blocks}`;
}

/* ------------------------------------------------------------- merchant -- */
function renderMerchant() {
  tickMerchant();

  const ms = merchantMsLeft();
  const mins = Math.floor(ms / 60000), secs = Math.floor((ms % 60000) / 1000);
  const cost = merchantForceCost();

  const rows = (S.merchant.stock || []).map(item => {
    const delta = upgradeDelta(item);
    const up = delta > 0 ? `<span class="upgrade">\u25B2 +${delta}</span>` : "";
    const afford = S.gold >= item.price;
    return `<div class="itemrow b-${item.rarity}" data-tip="shop:${item.uid}">
      <div class="main">
        <div class="nm r-${item.rarity}">${item.name} ${up}</div>
        <div class="sub">${slotLabel(item.slot)} \u00B7 item level ${item.ilvl} \u00B7 ${RARITIES[item.rarity].name}</div>
        ${itemStatGrid(item)}
      </div>
      <div class="acts">
        <button class="btn sm ${afford ? "primary" : ""}" ${afford ? "" : "disabled"}
                onclick="doBuy('${item.uid}')">${fmt(item.price)}g</button>
      </div>
    </div>`;
  }).join("");

  return `<div class="phead">
      <h2>The Wandering Merchant</h2>
      <p>Somewhere to put the gold. Most of what is laid out here is worse than what you could
         farm yourself &mdash; but not always, and the stock changes. Buying is a gamble, and so is
         paying to see the next lot early.</p>
    </div>

    <div class="panel">
      <div class="ctrlbar">
        <span style="font-size:15px">Purse:
          <b style="color:var(--brass-hi);font-family:var(--mono)">${fmt(S.gold)}</b> gold</span>
        <span style="flex:1"></span>
        <span style="color:var(--ash);font-family:var(--mono);font-size:11.5px">
          new stock in ${mins}m ${String(secs).padStart(2, "0")}s</span>
        <button class="btn ${S.gold >= cost ? "" : ""}" ${S.gold >= cost ? "" : "disabled"}
                onclick="doForceRefresh()">Restock now &mdash; ${fmt(cost)}g</button>
      </div>
      ${S.merchant.forcedCount ? `<div class="meta" style="color:var(--dim)">
        the price doubles each time you force it, and resets when the free restock arrives</div>` : ""}
    </div>

    <div class="panel">
      <h3>On the table</h3>
      <div class="itemlist">${rows || `<div class="empty">Nothing left. Wait, or pay for a restock.</div>`}</div>
    </div>`;
}

function doBuy(uid) {
  const res = buyFromMerchant(uid);
  if (res.ok) { Sound.play("coin", 0); UI.toast(`Bought <span class="r-${res.item.rarity}">${res.item.name}</span>`, "good"); UI.render(); }
  else UI.say(res);
}
function doForceRefresh() {
  const res = forceMerchantRefresh();
  if (res.ok) Sound.play("coin", 0);
  UI.say(res);
}

function startBoss(id) {
  const boss = bossById(id);
  if (!boss) return;
  UI.grind = { mode: "boss", id };
  Combat.log = [];
  Combat.start("boss", boss);
  UI.render();
}

/* --------------------------------------------------------------- descent -- */
function renderDescent() {
  if (!descentUnlocked()) {
    return `<div class="phead"><h2>The Descent</h2></div>
      <div class="empty">Opus still stands. The way down opens once the great work is finished.</div>`;
  }

  const d = S.descent;
  const active = d.active;

  // a pending boon choice takes over the panel — it is the decision of the run
  if (active && d.pendingChoices) {
    const cards = d.pendingChoices.map(id => {
      const b = boonById(id);
      const have = d.boons[id] || 0;
      return `<div class="booncard" onclick="chooseBoon('${id}')">
        <h4>${b.name}${have ? ` <span class="boonstack">already ${have}\u00D7</span>` : ""}</h4>
        <div class="boontext">${b.text}</div>
        <div class="boonpick">take this</div>
      </div>`;
    }).join("");
    return `<div class="phead">
        <h2>Floor ${d.floor}</h2>
        <p>Something down here is willing to make you stronger. Choose one.</p>
      </div>
      <div class="boongrid">${cards}</div>
      ${descentStatusPanel()}`;
  }

  const boonList = Object.keys(d.boons || {}).length
    ? Object.keys(d.boons).map(id => {
        const b = boonById(id);
        const n = d.boons[id];
        return `<div class="effectrow"><b>${b.name}${n > 1 ? ` \u00D7${n}` : ""}</b><span>${b.text}</span></div>`;
      }).join("")
    : `<div class="empty" style="padding:16px">No boons yet.</div>`;

  return `<div class="phead">
      <h2>The Descent</h2>
      <p>There is no bottom. Everything down here grows ${Math.round((DESCENT_POWER_RATE - 1) * 100)}% stronger with every floor &mdash;
         compounding, so it doubles roughly every twelve &mdash;
         and every ${DESCENT_BOON_EVERY} floors something offers to make you stronger too &mdash; you choose which,
         and the choices stack for the rest of the run.</p>
      <p>Every ${DESCENT_WARDEN_EVERY}th floor a Warden blocks the way: a raid boss, scaled to the depth,
         carrying its full drop table. Health and mana carry the whole way down. Dying ends the run
         and costs nothing but the floors.</p>
    </div>

    ${active ? descentStatusPanel() : `
      ${S.lastDescent ? descentRecap() : ""}
      <div class="panel">
      <div class="ctrlbar">
        <span style="font-size:15px">Deepest floor reached:
          <b style="color:var(--brass-hi);font-family:var(--mono)">${d.best || 0}</b></span>
        <span style="flex:1"></span>
        <button class="btn primary" onclick="startDescent()">Begin a Descent</button>
      </div>
    </div>`}

    ${combatControls()}
    ${(Combat.active || UI.grind) ? arenaHtml() : ""}

    <div class="panel">
      <h3>Boons taken this run</h3>
      ${active ? boonList : `<div class="empty" style="padding:16px">Not currently descending.</div>`}
    </div>`;
}

/* Shown when you come back to the Descent after a run ends: how the last one
   went, so a death has something to show for it. */
function descentRecap() {
  const r = S.lastDescent;
  const boons = Object.keys(r.boons || {});
  const boonList = boons.length
    ? boons.map(id => { const b = boonById(id); const n = r.boons[id];
        return `<span class="recapboon">${b ? b.name : id}${n > 1 ? ` \u00D7${n}` : ""}</span>`; }).join("")
    : `<span style="color:var(--dim)">none taken</span>`;
  return `<div class="panel recap">
    <div class="recaphead">Last descent \u2014 ${r.reason === "abandoned" ? "withdrawn" : "fell"} at floor ${r.floor}</div>
    <div class="recapstats">
      <div><span>Floor reached</span><b>${r.floor}</b></div>
      <div><span>Wardens felled</span><b>${r.wardens}</b></div>
      <div><span>Boons taken</span><b>${r.boonCount}</b></div>
    </div>
    <div class="recapboons"><span class="recaplabel">Boons</span> ${boonList}</div>
  </div>`;
}

function descentStatusPanel() {
  const d = S.descent;
  const nextBoon = DESCENT_BOON_EVERY - ((d.floor - 1) % DESCENT_BOON_EVERY);
  const nextWarden = DESCENT_WARDEN_EVERY - ((d.floor - 1) % DESCENT_WARDEN_EVERY);
  const power = Math.round((Math.pow(DESCENT_POWER_RATE, d.floor - 1) - 1) * 100);
  return `<div class="panel">
    <div class="ctrlbar">
      <span style="font-size:17px;font-family:var(--serif)">Floor <b style="color:var(--brass-hi)">${d.floor}</b></span>
      <span class="tag">enemies +${power}%</span>
      <span class="tag">magic find +${(d.floor - 1) * DESCENT_FIND_PER_FLOOR}%</span>
      <span class="tag">boon in ${nextBoon}</span>
      <span class="tag ${nextWarden <= 2 ? "red" : ""}">warden in ${nextWarden}</span>
      <span style="flex:1"></span>
      <span style="color:var(--dim);font-family:var(--mono);font-size:11px">best ${d.best || 0}</span>
      <button class="btn danger sm" onclick="abandonDescent()">Abandon run</button>
    </div>
  </div>`;
}

function startDescent() {
  beginDescent();
  UI.grind = { mode: "descent", id: "descent" };
  Combat.log = [];
  Combat.start("descent", null);
  Sound.play("levelup", 0);
  UI.render();
}

function chooseBoon(id) {
  const res = takeBoon(id);
  Sound.play("rare", 0);
  UI.toast(res.msg, "good");
  // resume the dive straight away
  if (S.settings.autoGrind && UI.grind) {
    Combat.start("descent", null);
  }
  UI.render();
}

function abandonDescent() {
  const r = endDescent("abandoned");
  Combat.stop();
  UI.grind = null;
  S.settings.autoGrind = false;
  UI.toast(`Descent abandoned at floor ${r.floor}. Best: ${r.best}.`, "good");
  UI.render();
}


/* ======== js/ui/panels-character.js ======== */
/* ===========================================================================
   CHARACTER PANELS — the paperdoll, the stat sheet, and the inventory.
   =========================================================================== */

/* ------------------------------------------------------------- character */
function renderCharacter() {
  const st = computeStats();

  const row = (label, value, hi, help) =>
    `<div class="statrow ${hi ? "hi" : ""}"${help ? ` data-tip="stat:${help}"` : ""}>
       <span class="${help ? statClass(help) : ""}">${label}</span>
       <b class="${help ? statClass(help) : ""}">${value}</b></div>`;

  const offence = [
    row("Strength", fmt(st.str), false, "str"),
    row("Agility", fmt(st.agi), false, "agi"),
    row("Intellect", fmt(st.int), false, "int"),
    row("Spirit", fmt(st.spi), false, "spi"),
    row("Stamina", fmt(st.sta), false, "sta"),
    row("Weapon damage", `${fmt(st.swingMin)} \u2013 ${fmt(st.swingMax)}`, false, "swing"),
    row("Swing time", `${st.swingTime.toFixed(2)}s`, false, "swingTime"),
    row("Damage per second", fmt(st.dps), true, "dps"),
    row("Critical strike", `${st.crit.toFixed(1)}%`, false, "crit"),
    row("Critical damage", `${Math.round(st.critMult * 100)}%`, false, "critMult"),
    row("Haste", `${st.haste.toFixed(1)}%`, false, "haste"),
  ].join("");

  const defence = [
    row("Health", fmt(st.maxHp), true, "maxHp"),
    row("Mana", fmt(st.maxMana), false, "maxMana"),
    row("Mana regeneration", `${st.manaRegen.toFixed(1)}/s`, false, "manaRegen"),
    row("Armor", fmt(st.armor), false, "armor"),
    row("Physical mitigation", `${(armorReduction(st.armor, S.level) * 100).toFixed(1)}%`, false, "armorMit"),
    row("Damage reduction", `${st.dr.toFixed(1)}%`, false, "dr"),
    row("Dodge", `${st.dodge.toFixed(1)}%`, false, "dodge"),
    row("Block", `${st.block.toFixed(1)}%`, false, "block"),
    row("Lifesteal", `${st.lifesteal.toFixed(1)}%`, false, "lifesteal"),
    row("Thorns", `${st.thorns.toFixed(1)}%`, false, "thorns"),
  ].join("");

  const bonus = [];
  if (st.physDmg) bonus.push(row("Physical damage", `+${st.physDmg.toFixed(1)}%`, false, "physDmg"));
  if (st.magicDmg) bonus.push(row("Magic damage", `+${st.magicDmg.toFixed(1)}%`, false, "magicDmg"));
  if (st.allDmg) bonus.push(row("All damage", `+${st.allDmg.toFixed(1)}%`, false, "allDmg"));
  if (st.healPct) bonus.push(row("Healing done", `+${st.healPct.toFixed(1)}%`, false, "healPct"));
  if (st.execDmg) bonus.push(row("Execute damage", `+${st.execDmg.toFixed(1)}%`, false, "execDmg"));
  if (st.cdr) bonus.push(row("Cooldown reduction", `${st.cdr.toFixed(1)}%`, false, "cdr"));
  if (st.goldFind) bonus.push(row("Gold found", `+${st.goldFind.toFixed(1)}%`, false, "goldFind"));
  if (st.magicFind) bonus.push(row("Magic find", `+${st.magicFind.toFixed(1)}%`, false, "magicFind"));
  if (st.mods.lowHpDmg) bonus.push(row("Damage while cornered", `+${st.mods.lowHpDmg.toFixed(1)}%`));
  if (st.mods.highHpDmg) bonus.push(row("Damage while healthy", `+${st.mods.highHpDmg.toFixed(1)}%`));
  if (st.mods.rampDmg) bonus.push(row("Damage per swing", `+${st.mods.rampDmg.toFixed(1)}%`));

  const t = S.tally;
  const record = [
    row("Enemies slain", fmt(t.kills)),
    row("Bosses slain", fmt(t.bossKills)),
    row("Items found", fmt(t.items)),
    row("Gold earned", fmt(t.goldEarned)),
    row("Defeats", fmt(t.deaths)),
  ].join("");

  return `<div class="phead">
      <h2>Character</h2>
      <p>Fifteen slots, no class restrictions. Wear whatever the numbers favour.</p>
    </div>

    <div class="panel">
      <h3>Equipped</h3>
      ${paperdollHtml()}
    </div>

    <div class="grid g2">
      <div class="panel"><h3>Offence</h3><div class="statsheet">${offence}</div></div>
      <div class="panel"><h3>Defence</h3><div class="statsheet">${defence}</div></div>
    </div>

    ${bonus.length ? `<div class="panel"><h3>Bonuses</h3><div class="statsheet">${bonus.join("")}</div></div>` : ""}

    ${st.sets.length ? `<div class="panel"><h3>Set bonuses</h3>
      ${st.sets.map(s => `<div class="setblock">
        <div class="setname">${s.set.name} <span>${s.worn} of 5</span></div>
        ${s.tiers.map(t => `<div class="setbonus ${t.on ? "on" : ""}">
          <b>(${t.need})</b><span>${t.text}</span></div>`).join("")}
      </div>`).join("")}
    </div>` : ""}

    ${st.effects.length ? `<div class="panel"><h3>Special effects</h3>
      ${effectGroupsHtml(st.effects)}
    </div>` : ""}

    <div class="panel"><h3>Record</h3><div class="statsheet">${record}</div></div>`;
}

/* Effects listed under the moment they fire, so the panel reads as a sequence
   rather than an unsorted pile. */
const TRIGGER_LABEL = {
  open: "At the start of a fight",
  hit: "On a landed hit",
  crit: "On a critical strike",
  hurt: "When you are struck",
  kill: "On a kill",
};

function effectGroupsHtml(effects) {
  const groups = {};
  for (const e of effects) {
    const def = EFFECTS[e.id];
    const t = def ? def.trigger : "hit";
    (groups[t] = groups[t] || []).push(e);
  }
  let html = "";
  for (const t of ["open", "hit", "crit", "hurt", "kill"]) {
    if (!groups[t]) continue;
    html += `<div class="effectgroup">${TRIGGER_LABEL[t]}</div>`;
    html += groups[t].map(e => `<div class="effectrow">
      <b>${effectName(e)}</b>
      <span>${describeEffect(e)}${e.sources > 1
        ? ` <span class="srccount">${e.sources} sources combined</span>` : ""}</span>
    </div>`).join("");
  }
  return html;
}

function doUnequip(slotKey) { UI.say(unequipItem(slotKey)); }

/* ------------------------------------------------------------- inventory */
UI.invFilter = { slot: "", rarity: "", primary: "", special: "", sort: "score" };

function renderInventory() {
  const f = UI.invFilter;

  let items = S.inventory.slice();
  if (f.slot) items = items.filter(i => i.slot === f.slot);
  if (f.rarity) items = items.filter(i => i.rarity === f.rarity);
  if (f.primary) items = items.filter(i => i.primary === f.primary);
  if (f.special === "any") items = items.filter(i => i.proc || i.aspect || i.passive);
  else if (f.special === "aspect") items = items.filter(i => i.aspect);
  else if (f.special === "native") items = items.filter(i => i.proc && !i.aspect);

  items.sort((a, b) => {
    if (f.sort === "score") return itemScore(b) - itemScore(a);
    if (f.sort === "ilvl") return b.ilvl - a.ilvl;
    if (f.sort === "value") return b.value - a.value;
    if (f.sort === "upgrade") return upgradeDelta(b) - upgradeDelta(a);
    return RARITY_ORDER.indexOf(b.rarity) - RARITY_ORDER.indexOf(a.rarity);
  });

  const slotOpts = SLOT_TYPES.map(s =>
    `<option value="${s}" ${f.slot === s ? "selected" : ""}>${slotLabel(s)}</option>`).join("");
  const rarOpts = RARITY_ORDER.map(r =>
    `<option value="${r}" ${f.rarity === r ? "selected" : ""}>${RARITIES[r].name}</option>`).join("");

  const rows = items.map(item => {
    const targets = slotsForItem(item);
    const equipBtns = targets.length > 1
      ? targets.map((t, i) => `<button class="btn sm" onclick="doEquip('${item.uid}','${t}')">Wear ${i + 1}</button>`).join("")
      : `<button class="btn sm" onclick="doEquip('${item.uid}')">Wear</button>`;
    return itemRow(item, `${equipBtns}
      <button class="btn sm" onclick="doSell('${item.uid}')">Sell ${fmt(item.value)}g</button>
      <button class="btn sm" onclick="doSalvage('${item.uid}')">Salvage</button>`);
  }).join("");

  // potion stock
  const potionRows = POTIONS.filter(p => (S.potions[p.id] || 0) > 0).map(p => {
    const n = S.potions[p.id];
    const what = p.kind === "heal" ? `restores ${p.pct}% health`
      : p.kind === "mana" ? `restores ${p.pct}% mana`
      : Object.keys(p.mods).map(k => statLine(k, p.mods[k])).join(", ") + ` for ${p.duration}s`;
    return `<div class="itemrow" style="border-left-color:var(--verdant)">
      <div class="main">
        <div class="nm">${p.name} <span style="color:var(--brass-hi);font-family:var(--mono)">\u00D7${n}</span></div>
        <div class="potdesc">${what}</div>
      </div>
      <div class="acts">
        <button class="btn sm" onclick="doSalvagePotion('${p.id}',1)">Break 1</button>
        <button class="btn sm" onclick="doSalvagePotion('${p.id}',${n})">Break all</button>
      </div>
    </div>`;
  }).join("");

  return `<div class="phead">
      <h2>Inventory</h2>
      <p>No weight limit, no bag slots. ${fmt(S.inventory.length)} items held.
         Salvaging returns crafting materials and the Arcane Dust that enchanting runs on.</p>
    </div>

    <div class="panel">
      <h3>Automatic clean-up</h3>
      <div class="ctrlbar">
        <span style="color:var(--ash);font-size:12.5px">After every won fight,</span>
        <select onchange="setAutoSalvageMode(this.value)">
          <option value="salvage" ${S.settings.autoSalvageMode === "salvage" ? "selected" : ""}>salvage</option>
          <option value="sell" ${S.settings.autoSalvageMode === "sell" ? "selected" : ""}>sell</option>
        </select>
        <select onchange="setAutoSalvage(this.value)">
          <option value="off" ${S.settings.autoSalvage === "off" ? "selected" : ""}>nothing</option>
          <option value="common" ${S.settings.autoSalvage === "common" ? "selected" : ""}>commons</option>
          <option value="uncommon" ${S.settings.autoSalvage === "uncommon" ? "selected" : ""}>commons and uncommons</option>
        </select>
        <span style="color:var(--dim);font-family:var(--mono);font-size:11px">
          uniques and anything rarer are never touched</span>
      </div>
    </div>

    <div class="panel">
      <div class="invhead">
        <select onchange="setInvFilter('slot', this.value)">
          <option value="">Every slot</option>${slotOpts}
        </select>
        <select onchange="setInvFilter('rarity', this.value)">
          <option value="">Every rarity</option>${rarOpts}
        </select>
        <select onchange="setInvFilter('primary', this.value)">
          <option value="">Every stat</option>
          ${["str", "agi", "int"].map(k =>
            `<option value="${k}" ${f.primary === k ? "selected" : ""}>${PRIMARY_LABEL[k]}</option>`).join("")}
        </select>
        <select onchange="setInvFilter('special', this.value)">
          <option value="">Any property</option>
          <option value="any" ${f.special === "any" ? "selected" : ""}>Has a special property</option>
          <option value="native" ${f.special === "native" ? "selected" : ""}>Own property only</option>
          <option value="aspect" ${f.special === "aspect" ? "selected" : ""}>Carries an aspect</option>
        </select>
        <select onchange="setInvFilter('sort', this.value)">
          <option value="score" ${f.sort === "score" ? "selected" : ""}>Best first</option>
          <option value="upgrade" ${f.sort === "upgrade" ? "selected" : ""}>Biggest upgrade</option>
          <option value="ilvl" ${f.sort === "ilvl" ? "selected" : ""}>Item level</option>
          <option value="rarity" ${f.sort === "rarity" ? "selected" : ""}>Rarity</option>
          <option value="value" ${f.sort === "value" ? "selected" : ""}>Gold value</option>
        </select>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="bulkSell(['common'])">Sell commons</button>
        <button class="btn sm" onclick="bulkSell(['common','uncommon'])">Sell commons + uncommons</button>
        <button class="btn sm" onclick="bulkSalvage(['common','uncommon'])">Salvage commons + uncommons</button>
      </div>
      <div class="itemlist">
        ${rows || `<div class="empty">Nothing here. Go and take something from someone.</div>`}
      </div>
    </div>

    ${potionRows ? `<div class="panel"><h3>Potions held</h3>
      <div class="itemlist">${potionRows}</div></div>` : ""}`;
}

function setInvFilter(k, v) { UI.invFilter[k] = v; UI.render(); }
function setAutoSalvage(v) { S.settings.autoSalvage = v; saveGame(); UI.render(); }
function setAutoSalvageMode(v) { S.settings.autoSalvageMode = v; saveGame(); UI.render(); }
function doEquip(uid, slot) { UI.say(equipItem(uid, slot)); }
function doSell(uid) { Sound.play("coin", 0); UI.say(sellItem(uid)); }
function doSalvage(uid) { Sound.play("salvage", 0); UI.say(salvageItem(uid)); }
function doSalvagePotion(id, n) { UI.say(salvagePotion(id, n)); }
function bulkSell(rar) { UI.say(sellAllOfRarity(rar)); }
function bulkSalvage(rar) { UI.say(salvageAllOfRarity(rar)); }


/* ======== js/ui/panels-talents.js ======== */
/* ===========================================================================
   TALENTS AND SKILLS
   ---------------------------------------------------------------------------
   Left click a talent to add a point, right click to take one back.
   Spells are not chosen: they unlock at 5 / 10 / 15 / 20 / 25 points spent in
   their tree. The Skills panel only lets you reorder the cast priority.
   =========================================================================== */

function renderTalents() {
  if (S.level < TALENT_START_LEVEL) {
    return `<div class="phead"><h2>Talents</h2></div>
      <div class="empty">Talents open at level ${TALENT_START_LEVEL}. You are level ${S.level}.</div>`;
  }

  const treeId = UI.tab.talents || TALENT_TREES[0].id;
  const tree = TALENT_TREES.find(t => t.id === treeId);
  const avail = pointsAvailable();

  const treeBar = TALENT_TREES.map(t => {
    const pts = pointsInTree(t.id);
    return `<button class="treebtn ${t.id === treeId ? "on" : ""}" onclick="UI.tab.talents='${t.id}';UI.render()">
      ${t.name} <b>${pts}</b>
    </button>`;
  }).join("");

  let tiers = "";
  for (let tier = 1; tier <= 5; tier++) {
    const need = (tier - 1) * 5;
    const open = pointsInTree(tree.id) >= need;
    const talents = tree.talents.filter(t => t.tier === tier).map(t => {
      const rank = S.talents[t.id] || 0;
      const maxed = rank >= t.max;
      const can = canSpendTalent(t.id).ok;
      const cls = maxed ? "maxed" : (rank > 0 ? "invested" : (can ? "" : "blocked"));
      const mods = Object.keys(t.mods).map(k => statLine(k, t.mods[k] * Math.max(1, rank))).join(", ");
      const isProc = !!t.effect;
      const current = rank && t.effect
        ? `<div class="tcur">at ${rank} rank${rank > 1 ? "s" : ""}: ${describeEffect({ id: t.effect.id, chance: t.effect.chance * rank, potency: t.effect.potency || 1 })}</div>`
        : (rank && mods ? `<div class="tcur">at ${rank} rank${rank > 1 ? "s" : ""}: ${mods}</div>` : "");
      return `<div class="talent ${cls} ${isProc ? "proc" : ""}"
           onclick="clickTalent('${t.id}')"
           oncontextmenu="event.preventDefault();unclickTalent('${t.id}')">
        <div class="th">
          <span class="tn">${t.name}${isProc ? ` <span class="procmark">proc</span>` : ""}</span>
          <span class="rank">${rank}/${t.max}</span>
        </div>
        <div class="td">${t.desc}</div>
        ${current}
      </div>`;
    }).join("");

    tiers += `<div class="tier ${open ? "open" : ""}">
      <div class="tierhead">Tier ${tier} ${need ? `\u2014 needs ${need} points in ${tree.name}` : ""}</div>
      <div class="talentgrid">${talents}</div>
    </div>`;
  }

  // what spells this tree's current investment has bought
  const pts = pointsInTree(tree.id);
  const spellNote = SPELLS.filter(s => s.tree === tree.id).map(s =>
    `<span class="tag ${pts >= s.req ? "done" : ""}" data-tip="spell:${s.id}">${s.req}: ${s.name}</span>`).join(" ");

  return `<div class="phead">
      <h2>Talents</h2>
      <p>One point per level from ${TALENT_START_LEVEL} onward, ${totalTalentPoints(MAX_LEVEL)} at level ${MAX_LEVEL}.
         Left click to spend, right click to refund. Resetting is always free.</p>
    </div>

    <div class="panel">
      <div class="ctrlbar">
        <span style="font-size:15px">Points available:
          <b style="color:${avail > 0 ? "var(--brass-hi)" : "var(--dim)"};font-family:var(--mono)">${avail}</b>
        </span>
        <span style="color:var(--dim);font-family:var(--mono);font-size:11px">
          ${pointsSpent()} spent of ${totalTalentPoints(S.level)}</span>
        <span style="flex:1"></span>
        <button class="btn danger sm" onclick="doResetTalents()">Reset all points</button>
      </div>
    </div>

    <div class="treebar">${treeBar}</div>

    <div class="panel">
      <h3>${tree.name} \u2014 ${pointsInTree(tree.id)} points</h3>
      <p style="color:var(--ash);font-size:12.5px;margin:-4px 0 12px">${tree.blurb}</p>
      <div style="margin-bottom:14px">${spellNote}</div>
      <div class="tiers">${tiers}</div>
    </div>`;
}

function clickTalent(id) {
  const res = spendTalent(id);
  if (!res.ok) { UI.toast(res.msg, "bad"); return; }
  UI.render();
}
function unclickTalent(id) {
  const res = refundTalent(id);
  if (!res.ok) { UI.toast(res.msg, "bad"); return; }
  UI.render();
}
function doResetTalents() { UI.say(resetTalents()); }

/* ---------------------------------------------------------------- skills */
function renderSkills() {
  const unlocked = unlockedSpells();
  const unlockedIds = unlocked.map(s => s.id);

  const rows = unlocked.map((sp, i) => {
    const tree = TALENT_TREES.find(t => t.id === sp.tree);
    const c = S.spellConditions[sp.id] || { type: "always", value: 30 };
    const needsValue = SPELL_CONDITIONS[c.type] && SPELL_CONDITIONS[c.type].value;

    return `<div class="spellrow">
      <div class="order">
        <button onclick="moveSpell('${sp.id}',-1)" ${i === 0 ? "disabled" : ""}>\u25B2</button>
        <button onclick="moveSpell('${sp.id}',1)" ${i === unlocked.length - 1 ? "disabled" : ""}>\u25BC</button>
      </div>
      <div style="flex:1">
        <div class="sn" data-tip="spell:${sp.id}">${sp.name}
          <span style="color:var(--dim);font-family:var(--mono);font-size:10px"> ${tree.name}</span>
        </div>
        <div class="sd">${sp.desc}</div>
        <div class="spellcond">
          <span class="cw">cast</span>
          <select onchange="setSpellCondition('${sp.id}', this.value)">
            ${Object.keys(SPELL_CONDITIONS).map(k =>
              `<option value="${k}" ${c.type === k ? "selected" : ""}>${SPELL_CONDITIONS[k].label}</option>`).join("")}
          </select>
          ${needsValue ? `<input type="number" min="0" max="100" step="5" value="${c.value}"
             onchange="setSpellConditionValue('${sp.id}', this.value)">
             <span class="cw">${SPELL_CONDITIONS[c.type].unit}</span>` : ""}
        </div>
      </div>
      <div class="sm">${sp.cd}s cooldown<br>${sp.manaPct}% mana</div>
    </div>`;
  }).join("");

  const lockedRows = SPELLS.filter(s => !unlockedIds.includes(s.id)).map(sp => {
    const tree = TALENT_TREES.find(t => t.id === sp.tree);
    const have = pointsInTree(sp.tree);
    return `<div class="spellrow locked" data-tip="spell:${sp.id}">
      <div style="flex:1">
        <div class="sn">${sp.name}
          <span style="color:var(--dim);font-family:var(--mono);font-size:10px"> ${tree.name}</span>
        </div>
        <div class="sd">${sp.desc}</div>
      </div>
      <div class="sm">${have}/${sp.req} points<br>in ${tree.name}</div>
    </div>`;
  }).join("");

  return `<div class="phead">
      <h2>Skills</h2>
      <p>Spells unlock at 5, 10, 15, 20 and 25 points spent in a tree and cast themselves.
         The order below is the priority: the first spell that is ready, affordable and whose condition
         is met goes off.</p>
      <p>By default heals and shields hold until you are below 90% health. Setting a condition on a
         spell replaces that default entirely, so what you configure is exactly what happens.</p>
    </div>

    <div class="panel">
      <h3>Cast priority</h3>
      ${rows || `<div class="empty">No spells yet. Spend 5 points in any talent tree.</div>`}
    </div>

    ${lockedRows ? `<div class="panel"><h3>Not yet unlocked</h3>${lockedRows}</div>` : ""}`;
}

/* The conditions a spell can be given. `value` marks the ones that need a
   number alongside them. */
const SPELL_CONDITIONS = {
  always:      { label: "whenever it is ready", value: false },
  enemyBelow:  { label: "when the enemy is below", value: true, unit: "% health" },
  enemyAbove:  { label: "when the enemy is above", value: true, unit: "% health" },
  selfBelow:   { label: "when I am below", value: true, unit: "% health" },
  selfAbove:   { label: "when I am above", value: true, unit: "% health" },
  manaAbove:   { label: "when I have more than", value: true, unit: "% mana" },
  opener:      { label: "only in the first", value: true, unit: "seconds" },
  afterSecs:   { label: "only after", value: true, unit: "seconds" },
  eliteOrBoss: { label: "only against elites and bosses", value: false },
  bossOnly:    { label: "only against bosses", value: false },
};

function setSpellCondition(id, type) {
  if (type === "always") delete S.spellConditions[id];
  else {
    const cur = S.spellConditions[id] || {};
    S.spellConditions[id] = { type, value: cur.value === undefined ? 30 : cur.value };
  }
  saveGame();
  UI.render();
}

function setSpellConditionValue(id, v) {
  const c = S.spellConditions[id];
  if (!c) return;
  c.value = clamp(parseFloat(v) || 0, 0, 100);
  saveGame();
}

function moveSpell(id, dir) {
  const list = unlockedSpells().map(s => s.id);
  const i = list.indexOf(id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  S.spellOrder = list;
  saveGame();
  UI.render();
}

   CRAFTING PANELS — blacksmith, alchemy, enchanting, materials.

/* ------------------------------------------------------------ blacksmith */
function renderBlacksmith() {
  const tier = UI.tab.bsTier || 1;
  const slotFilter = UI.tab.bsSlot || "";
  const ct = CRAFT_TIERS[tier];

  const tierTabs = [1, 2, 3, 4, 5].map(t => {
    const locked = S.level < CRAFT_TIERS[t].req;
    return `<button class="tab ${t === tier ? "on" : ""}" onclick="UI.tab.bsTier=${t};UI.render()">
      ${CRAFT_TIERS[t].label}${locked ? " \u2014 lvl " + CRAFT_TIERS[t].req : ""}
    </button>`;
  }).join("");

  const slotTabs = `<button class="tab ${!slotFilter ? "on" : ""}" onclick="UI.tab.bsSlot='';UI.render()">All slots</button>` +
    SLOT_TYPES.map(s =>
      `<button class="tab ${slotFilter === s ? "on" : ""}" onclick="UI.tab.bsSlot='${s}';UI.render()">${slotLabel(s)}</button>`
    ).join("");

  let recipes = BS_RECIPES.filter(r => r.tier === tier);
  if (slotFilter) recipes = recipes.filter(r => r.slot === slotFilter);

  const rows = recipes.map(r => {
    const chk = canCraft(r);
    return `<div class="reciperow">
      <div class="rn">
        <span class="r-rare">${PRIMARY_LABEL[r.primary]} ${slotLabel(r.slot)}</span>
        <div class="cost" style="margin-top:2px">item level ${r.ilvl} \u00B7 Rare \u00B7 ${costText(r.mats, r.gold)}</div>
      </div>
      <button class="btn sm ${chk.ok ? "primary" : ""}" ${chk.ok ? "" : "disabled"}
              onclick="doCraft('${r.id}')">${chk.ok ? "Forge" : chk.msg}</button>
    </div>`;
  }).join("");

  return `<div class="phead">
      <h2>Blacksmith</h2>
      <p>Turns ore, hide and wood into gear. Every piece comes out Rare with rolled stats, so forging
         the same recipe twice can give you a better one. Materials come from the realms and from salvaging.</p>
    </div>

    <div class="panel">
      <div class="tabs">${tierTabs}</div>
      <div class="tabs">${slotTabs}</div>
      ${S.level < ct.req
        ? `<div class="empty">${ct.label} recipes need level ${ct.req}. You are level ${S.level}.</div>`
        : rows}
    </div>

    ${materialsPanel("metal hide wood essence")}`;
}

function doCraft(id) {
  const res = craftBlacksmith(id);
  if (res.ok && res.item) {
    Sound.play(res.item.rarity === "epic" ? "rare" : "craft", 0);
    UI.toast(`Forged <span class="r-${res.item.rarity}">${res.item.name}</span>`, "good");
    UI.render();
  } else UI.say(res);
}

/* --------------------------------------------------------------- alchemy */
function renderAlchemy() {
  const groups = [
    { label: "Health", kind: "heal" },
    { label: "Mana", kind: "mana" },
    { label: "Combat draughts", kind: "buff" },
  ];

  const blocks = groups.map(g => {
    const rows = POTIONS.filter(p => p.kind === g.kind).map(p => {
      const have = S.potions[p.id] || 0;
      const okLevel = S.level >= p.req;
      const what = p.kind === "buff"
        ? Object.keys(p.mods).map(k => statLine(k, p.mods[k])).join(", ") + ` for ${p.duration}s`
        : `restores ${p.pct}% ${p.kind === "heal" ? "health" : "mana"}`;
      const canOne = okLevel && S.gold >= p.gold && hasMaterials(p.mats);
      const canFive = okLevel && S.gold >= p.gold * 5 &&
        Object.keys(p.mats).every(id => (S.materials[id] || 0) >= p.mats[id] * 5);

      return `<div class="reciperow">
        <div class="rn">
          ${p.name} <span style="color:var(--brass-hi);font-family:var(--mono);font-size:11px">\u00D7${have}</span>
          <div class="cost" style="margin-top:2px">${what} \u00B7 ${costText(p.mats, p.gold)}</div>
        </div>
        ${okLevel
          ? `<button class="btn sm ${canOne ? "primary" : ""}" ${canOne ? "" : "disabled"} onclick="doBrew('${p.id}',1)">Brew</button>
             <button class="btn sm" ${canFive ? "" : "disabled"} onclick="doBrew('${p.id}',5)">\u00D75</button>`
          : `<span class="tag red">level ${p.req}</span>`}
      </div>`;
    }).join("");
    return `<div class="panel"><h3>${g.label}</h3>${rows}</div>`;
  }).join("");

  return `<div class="phead">
      <h2>Alchemy</h2>
      <p>Herbs into potions. Health potions drink themselves when you drop below the threshold set in
         Combat settings; draughts fire at the opening of every fight. Both are configured on the Realms panel.</p>
    </div>
    ${blocks}
    ${materialsPanel("herb essence")}`;
}

function doBrew(id, n) { UI.say(brewPotion(id, n)); }

/* ------------------------------------------------------------ enchanting */
function renderEnchanting() {
  const slots = SLOTS;
  const selected = UI.tab.aspectSlot || "helm";
  const slotType = SLOTS.find(s => s.key === selected) ? (SLOTS.find(s => s.key === selected).type || selected) : selected;

  // aspects filed under the selected slot type
  const pool = S.aspects[slotType] || [];

  // items you could stamp onto, in the selected slot
  const targets = itemsForSlot(slotType);

  const slotButtons = SLOT_TYPES.map(t => {
    const count = (S.aspects[t] || []).length;
    const on = slotType === t;
    return `<button class="btn sm ${on ? "primary" : ""}" onclick="UI.tab.aspectSlot='${t}';UI.render()">
      ${slotTypeLabel(t)}${count ? ` <span class="aspcount">${count}</span>` : ""}</button>`;
  }).join("");

  const aspectCards = pool.length ? pool.map((a, i) => `
    <div class="aspectcard">
      <div class="aspname">${a.name}</div>
      <div class="asptext">${aspectLabel(a)}</div>
      <div class="aspslot">fits any ${slotTypeLabel(slotType).toLowerCase()}</div>
    </div>`).join("") : `<div class="empty" style="padding:20px">
      No ${slotTypeLabel(slotType).toLowerCase()} aspects yet. Salvage a ${slotTypeLabel(slotType).toLowerCase()}
      that carries a special property to draw one out.</div>`;

  const targetRows = targets.length ? targets.map(({ item, worn }) => {
    const has = item.aspect;
    return `<div class="itemrow b-${item.rarity}" data-tip="${worn ? "eq:" + slotKeyOf(item) : "inv:" + item.uid}">
      <div class="main">
        <div class="nm r-${item.rarity}">${item.name}${worn ? ` <span class="worntag">worn</span>` : ""}</div>
        <div class="sub">item level ${item.ilvl} · ${has ? "carries the " + item.aspect.name + " aspect"
          : item.proc ? "has its own property" : "no special property"}</div>
      </div>
      <div class="acts">
        ${pool.length ? `<button class="btn sm primary" onclick="doApplyAspect('${item.uid}', ${0})">Etch ${pool[0].name}</button>` : ""}
        ${has ? `<button class="btn sm" onclick="doRemoveAspect('${item.uid}')">Remove</button>` : ""}
      </div>
    </div>`;
  }).join("") : `<div class="empty" style="padding:16px">Nothing in this slot to etch.</div>`;

  return `<div class="phead">
      <h2>Aspects</h2>
      <p>Salvaging an item that carries a special property draws that property out as an <b>aspect</b>. An
         aspect can then be etched onto another item &mdash; but only one of the <b>same slot</b>, so a helm aspect
         only ever goes on a helm. This keeps a single strong effect from being stamped across every piece.</p>
      <p style="color:var(--dim);font-size:calc(12.5px * var(--fs))">
        Etching an aspect <b>replaces</b> whatever property the item already had. It is a way to shape a build,
        not to pile effects on top of one another. Special properties, and the aspects drawn from them, appear
        on gear from item level ${typeof ASPECT_MIN_ILVL !== "undefined" ? 40 : 40}.</p>
    </div>

    <div class="panel">
      <h3>Slot</h3>
      <div class="ctrlbar" style="flex-wrap:wrap;gap:6px">${slotButtons}</div>
    </div>

    <div class="grid g2">
      <div class="panel">
        <h3>${slotTypeLabel(slotType)} aspects &mdash; ${pool.length} held</h3>
        ${aspectCards}
      </div>
      <div class="panel">
        <h3>Etch onto a ${slotTypeLabel(slotType).toLowerCase()}</h3>
        <div class="itemlist">${targetRows}</div>
      </div>
    </div>`;
}

function slotKeyOf(item) {
  for (const s of SLOTS) if (S.equipment[s.key] === item) return s.key;
  return item.slot;
}

function doApplyAspect(uid, idx) {
  const res = applyAspect(uid, idx);
  if (res.ok) Sound.play("craft", 0);
  UI.say(res);
}
function doRemoveAspect(uid) {
  const res = removeAspect(uid);
  if (res.ok) Sound.play("salvage", 0);
  UI.say(res);
}

function doEnchant(slot, id) { UI.say(applyEnchant(slot, id)); }
function doRemoveEnchant(slot) { UI.say(removeEnchant(slot)); }

/* ------------------------------------------------------------- materials */
function materialsPanel(classes) {
  const want = classes ? classes.split(" ") : null;
  const ids = Object.keys(MATERIALS).filter(id => !want || want.includes(MATERIALS[id].cls));
  const rows = ids.map(id => {
    const m = MATERIALS[id];
    const n = S.materials[id] || 0;
    return `<div class="mat ${n ? "" : "zero"}">
      <span>${m.name}</span><b>${fmt(n)}</b>
    </div>`;
  }).join("");
  return `<div class="panel"><h3>Materials on hand</h3><div class="matgrid">${rows}</div></div>`;
}

function renderMaterials() {
  const byTier = [1, 2, 3, 4, 5].map(t => {
    const ids = Object.keys(MATERIALS).filter(id => MATERIALS[id].tier === t);
    const rows = ids.map(id => {
      const m = MATERIALS[id];
      const n = S.materials[id] || 0;
      return `<div class="mat ${n ? "" : "zero"}"><span>${m.name}</span><b>${fmt(n)}</b></div>`;
    }).join("");

    const realms = REALMS.filter(r => r.tier === t).map(r => r.name).join(", ");
    return `<div class="panel">
      <h3>${MAT_TIER_NAMES[t]}</h3>
      <p style="color:var(--dim);font-size:11.5px;margin:-6px 0 10px;font-family:var(--mono)">
        drops in ${realms}</p>
      <div class="matgrid">${rows}</div>
    </div>`;
  }).join("");

  const dust = S.materials.m_dust || 0;

  return `<div class="phead">
      <h2>Materials</h2>
      <p>Every realm drops the materials of its own tier. Higher realms, better gear.</p>
    </div>
    <div class="panel">
      <h3>Universal</h3>
      <div class="matgrid">
        <div class="mat ${dust ? "" : "zero"}"><span>Arcane Dust</span><b>${fmt(dust)}</b></div>
      </div>
      <p style="color:var(--dim);font-size:11.5px;margin:10px 0 0;font-family:var(--mono)">
        only from salvaging gear \u00B7 spent on enchanting</p>
    </div>
    ${byTier}`;
}

/* -------------------------------------------------------------- settings -- */
function renderSettings() {
  const v = Math.round((S.settings.volume || 0) * 100);
  return `<div class="phead">
      <h2>Settings</h2>
      <p>Sound is synthesised in the browser rather than loaded from files, which is what keeps
         the whole game a single folder with nothing to download.</p>
    </div>

    <div class="panel">
      <h3>Sound</h3>
      <div class="ctrlbar">
        <label class="switch">
          <input type="checkbox" ${S.settings.sound ? "checked" : ""} onchange="Sound.setEnabled(this.checked); UI.render()">
          Sound effects
        </label>
        <input type="range" min="0" max="100" step="5" value="${v}"
               style="width:180px" oninput="Sound.setVolume(this.value/100)">
        <span style="font-family:var(--mono);color:var(--ash);font-size:12px">${v}%</span>
        <button class="btn sm" onclick="Sound.play('levelup', 0)">Test</button>
      </div>
      <div class="matgrid" style="margin-top:12px">
        ${["click", "hit", "crit", "spell", "proc", "potion", "loot", "rare", "victory", "defeat", "craft", "coin"]
          .map(n => `<div class="mat" style="cursor:pointer" onclick="Sound.play('${n}',0)">
            <span>${n}</span><b>\u25B6</b></div>`).join("")}
      </div>
    </div>

    <div class="panel">
      <h3>Text size</h3>
      <div class="ctrlbar">
        ${[["0.85", "Small"], ["1", "Normal"], ["1.15", "Large"], ["1.3", "Larger"], ["1.5", "Largest"]].map(([v, label]) => {
          const on = Math.abs((S.settings.textScale || 1) - parseFloat(v)) < 0.02;
          return `<button class="btn sm ${on ? "primary" : ""}" onclick="Theme.setTextScale(${v}); UI.render()">${label}</button>`;
        }).join("")}
        <span style="flex:1"></span>
        <input type="range" min="0.8" max="1.6" step="0.05" value="${S.settings.textScale || 1}"
               style="width:200px" oninput="Theme.setTextScale(this.value); document.getElementById('fsnum').textContent=Math.round(this.value*100)+'%'">
        <span id="fsnum" style="font-family:var(--mono);color:var(--ash);font-size:12px">${Math.round((S.settings.textScale || 1) * 100)}%</span>
      </div>
      <p style="color:var(--dim);font-size:12px;margin:10px 0 0">
        Only text scales. Spacing and panel sizes stay where they are, so nothing reflows.</p>
    </div>

    <div class="panel">
      <h3>Appearance</h3>
      <div class="themegrid">
        ${Object.keys(THEMES).map(id => {
          const t = THEMES[id];
          const on = (S.settings.theme || "grimoire") === id;
          return `<div class="themecard ${on ? "on" : ""}" onclick="Theme.set('${id}'); UI.render()">
            <h4>${t.name}</h4>
            <div class="tb">${t.blurb}</div>
            <div class="swatches">
              ${["--void", "--pitch", "--edge", "--brass", "--bone"].map(k =>
                `<i style="background:${t.vars[k]}"></i>`).join("")}
            </div>
          </div>`;
        }).join("")}
        <div class="themecard ${S.settings.theme === "custom" ? "on" : ""}" onclick="Theme.set('custom'); UI.render()">
          <h4>Custom</h4>
          <div class="tb">Pick four colours below and the rest is worked out from them.</div>
          <div class="swatches">
            ${["bg", "panel", "accent", "text"].map(k =>
              `<i style="background:${(S.settings.customTheme || DEFAULT_CUSTOM)[k]}"></i>`).join("")}
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Custom palette</h3>
      <p style="color:var(--ash);font-size:12.5px;margin:-4px 0 10px">
        Four anchors are enough. Panels, borders and muted text are derived from them, which is
        what keeps a hand-picked palette readable instead of a mess of unrelated colours.</p>
      ${[["bg", "Background"], ["panel", "Panels"], ["accent", "Accent and headings"], ["text", "Text"],
         ["blood", "Damage taken"], ["witch", "Spells"], ["verdant", "Healing"]].map(([k, label]) =>
        `<div class="colorrow">
          <label>${label}</label>
          <input type="color" value="${(S.settings.customTheme || DEFAULT_CUSTOM)[k]}"
                 oninput="Theme.setCustom('${k}', this.value)">
        </div>`).join("")}
      <div class="ctrlbar" style="margin-top:10px">
        <button class="btn sm" onclick="Theme.set('custom'); UI.render()">Use custom palette</button>
        <button class="btn sm" onclick="S.settings.customTheme=Object.assign({},DEFAULT_CUSTOM);saveGame();Theme.apply('custom');UI.render()">Reset</button>
      </div>
    </div>

    <div class="panel">
      <h3>Save file</h3>
      <div class="ctrlbar">
        <button class="btn" onclick="UI.openSave()">Export or import a save</button>
        <button class="btn danger" onclick="UI.confirmWipe()">Start a new character</button>
      </div>
      <p style="color:var(--dim);font-size:12px;margin:10px 0 0">
        ${STORAGE_OK
          ? "Progress saves automatically after every fight and every twenty seconds."
          : "This browser is blocking local storage, so export a save if you want to keep this character."}
      </p>
    </div>`;
}

/* --------------------------------------------------------------- uniques -- */
/* A reference page. It lists what exists and where it comes from, because a
   passive that changes a combat rule is only interesting if you know it is
   there to chase. Nothing here is a spoiler you could not read off a tooltip. */
function renderUniques() {
  const owned = new Set();
  for (const slot of SLOTS) {
    const it = S.equipment[slot.key];
    if (it && it.uniqueId) owned.add(it.uniqueId);
  }
  for (const it of S.inventory) if (it.uniqueId) owned.add(it.uniqueId);

  const cards = UNIQUES.map(u => {
    const has = owned.has(u.id);
    const boss = bossById(u.boss);
    const dead = boss ? (S.bossKills[boss.id] || 0) : 0;
    return `<div class="uniquecard ${has ? "owned" : ""}">
      <h4 class="r-unique">${u.name}</h4>
      <div class="src">${slotLabel(u.slot)} \u00B7 item level ${u.ilvl} \u00B7
        ${boss ? `${boss.name} \u00B7 ${(u.chance * 100).toFixed(1)}%` : "unknown source"}</div>
      <div class="pname">${u.passive.name}</div>
      <div class="ptext">${u.passive.text}</div>
      <div class="flav">${u.flavour}</div>
      <div style="margin-top:9px">
        ${has ? `<span class="have">in your possession</span>`
              : `<span class="tag">${dead ? `${boss.name} slain ${dead}\u00D7` : "boss not yet defeated"}</span>`}
      </div>
    </div>`;
  }).join("");

  return `<div class="phead">
      <h2>Uniques</h2>
      <p>Above Legendary, and not measured in numbers. Each of these carries a passive that changes
         how a fight works rather than how large it is, and several of them cost you something in
         return. ${owned.size} of ${UNIQUES.length} found.</p>
    </div>
    <div class="panel">
      <p style="color:var(--ash);font-size:12.5px;margin:0 0 4px">
        Each is guarded by one raid boss. Bosses grow stronger every time you kill them, so a low
        drop rate and a hardening boss are the same problem &mdash; you get a few dozen attempts before
        you need better gear. The merchant also lays one out now and then.</p>
    </div>
    <div class="grid g2">${cards}</div>`;
}


/* ======== js/main.js ======== */
/* ===========================================================================
   MAIN — boot, the game loop, and auto-grind chaining.
   =========================================================================== */

/* Pause between auto-grind fights, long enough to read what happened. It shrinks
   as the speed setting rises, otherwise a fixed gap would dominate at 8x and the
   game would stop feeling any faster. */
const NEXT_FIGHT_DELAY = 0.9;
function nextFightDelay() {
  return NEXT_FIGHT_DELAY / Math.sqrt(S.settings.speed || 1);
}
let pendingNext = 0;
let lastFrame = 0;
let sinceSave = 0;

/* Fired by the combat engine whenever a fight resolves. */
Combat.onUpdate = function (kind, result) {
  // level ups and unlocks change what the whole interface should show
  if (!result) return;
  const unlocked = result.unlocked || [];
  if (result.leveled || unlocked.length) {
    if (result.leveled) UI.toast(`Level ${S.level}. One talent point earned.`, "good");
    for (const u of unlocked) UI.toast(`Unlocked: ${u}`, "good");
    UI.renderCharCard();
  }

  // notable drops deserve a toast, ordinary ones stay in the chronicle
  if (result.items) {
    for (const it of result.items) {
      if (it.rarity === "epic" || it.rarity === "legendary") {
        UI.toast(`<span class="r-${it.rarity}">${it.name}</span>`, "good");
      }
    }
  }

  // report what the automatic clean-up swept up, so it never happens silently
  if (result.autoCleared) {
    const a = result.autoCleared;
    if (a.sell) UI.toast(`Sold ${a.n} item${a.n > 1 ? "s" : ""} for ${fmt(a.gold)} gold.`);
    else UI.toast(`Salvaged ${a.n} item${a.n > 1 ? "s" : ""}.`);
  }

  /* Auto-grind would happily walk a run into the ground, so this is the way to
     bank depth while unattended: pull out when health gets low, take the free
     restore, and start a fresh run. */
  if (result.won && S.settings.autoRetreat > 0 && S.run.realmId) {
    const v = currentVitals();
    if (v.hp / v.maxHp * 100 < S.settings.autoRetreat) {
      const depth = retreatFromRun();
      UI.toast(`Withdrew at depth ${depth} to recover.`, "good");
      Sound.play("potion", 0);
    }
  }

  // a boon offer stops the dive until it is answered
  if (result.boonReady) {
    Sound.play("rare", 0);
    UI.toast("Something offers you power. Choose.", "good");
    if (UI.route === "descent") UI.render();
    return;
  }
  if (result.descentEnd) {
    UI.toast(`The Descent ends at floor ${result.descentEnd.floor}. Best: ${result.descentEnd.best}.`, "bad");
    UI.grind = null;
    if (UI.route === "descent") UI.render();
    return;
  }

  if (S.settings.autoGrind && UI.grind) {
    pendingNext = nextFightDelay();
  } else {
    UI.grind = S.settings.autoGrind ? UI.grind : null;
    // refresh so the panel shows the fight is over and the loot has landed
    if (UI.route === "realms" || UI.route === "raids") UI.renderCharCard();
  }
};

function startNextFight() {
  if (!UI.grind) return;
  if (UI.grind.mode === "descent") {
    if (!S.descent.active) { UI.grind = null; return; }
    if (S.descent.pendingChoices) return;   // waiting on a choice
    Combat.start("descent", null);
    return;
  }
  if (UI.grind.mode === "realm") {
    const realm = realmById(UI.grind.id);
    if (realm && realmUnlocked(realm)) Combat.start("realm", realm);
  } else {
    const boss = bossById(UI.grind.id);
    if (boss) Combat.start("boss", boss);
  }
}

function frame(now) {
  const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.25) : 0;
  lastFrame = now;

  if (Combat.active) {
    Combat.advance(dt);
    UI.tickCombat(false);
    UI.renderCharCard();
  } else if (pendingNext > 0) {
    pendingNext -= dt;
    if (pendingNext <= 0) {
      pendingNext = 0;
      startNextFight();
      UI.tickCombat(true);
    }
  }

  // autosave on a timer as well as after each fight
  sinceSave += dt;
  if (sinceSave > 20) {
    sinceSave = 0;
    saveGame();
    // rotate the merchant's stock when its timer comes round
    if (tickMerchant() && UI.route === "merchant") UI.render();
  }

  requestAnimationFrame(frame);
}

function boot() {
  const had = loadGame();
  Sound.init();
  Theme.apply(S.settings.theme || "grimoire");
  Theme.applyTextScale(S.settings.textScale);
  tickMerchant();
  UI.mount();
  if (!STORAGE_OK) {
    UI.toast("Local storage is blocked here. Use Save file to keep a copy.", "bad");
  } else if (had) {
    UI.toast(`Welcome back. Level ${S.level}.`, "good");
  } else {
    giveStarterKit();
    saveGame();
    UI.toast("A new character, armed and pointed at Ashen Hollow.", "good");
  }
  requestAnimationFrame(frame);
}

/* Keep the current fight when the tab is hidden, but do not simulate hours of
   combat in one frame when it comes back — dt is already clamped in frame(). */
document.addEventListener("visibilitychange", () => { lastFrame = 0; });

window.addEventListener("beforeunload", () => { saveGame(); });

document.addEventListener("DOMContentLoaded", boot);

</script>
