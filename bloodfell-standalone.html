   Gold piles up with nothing to spend it on once enchanting is done, so this is
   somewhere to gamble it. Stock rotates on a real-world timer. Most of what
   appears is worse than what you can farm; occasionally it is not.

   You may force a rotation early for gold, at a price that doubles each time
   you do it and resets when the free rotation arrives. That is the gamble.
   =========================================================================== */

const MERCHANT_REFRESH_MS = 30 * 60 * 1000;   // half an hour of real time
const MERCHANT_STOCK_SIZE = 6;
const MERCHANT_FORCE_BASE = 2500;             // cost of the first paid rotation
const MERCHANT_PRICE_MULT = 7.5;              // markup over an item's sale value

/* Deliberately generous at the top end compared with a mob drop — that is the
   whole reason to look. Legendaries stay rare enough to feel like an event. */
const MERCHANT_RARITY = { uncommon: 34, rare: 42, epic: 20, legendary: 4 };

function merchantForceCost() {
  return Math.round(MERCHANT_FORCE_BASE * Math.pow(2, S.merchant.forcedCount || 0));
}

function merchantMsLeft() {
  return Math.max(0, (S.merchant.nextRefresh || 0) - Date.now());
}

function merchantPrice(item) {
  return Math.round(item.value * MERCHANT_PRICE_MULT);
}

/* Stock is built around your current level so it stays relevant, with a spread
   so there is usually something slightly ahead of you. */
function rollMerchantStock() {
  const stock = [];
  for (let i = 0; i < MERCHANT_STOCK_SIZE; i++) {
    // The rare thrill: a Unique on the table. Only ones you could actually use
    // at your level, so a level 12 character is not taunted with a level 46 item.
    const eligible = UNIQUES.filter(u => u.ilvl <= S.level + 6);
    if (eligible.length && Math.random() < MERCHANT_UNIQUE_CHANCE) {
      const item = makeUnique2(pick(eligible));
      item.price = Math.round(merchantPrice(item) * 2.5);
      stock.push(item);
      continue;
    }
    const ilvl = clamp(Math.round(S.level + rand(-3, 5)), 1, 52);
    const item = generateItem({
      ilvl,
      rarity: weightedPick(MERCHANT_RARITY),
      primary: pick(["str", "agi", "int"]),
    });
    item.price = merchantPrice(item);
    stock.push(item);
  }
  return stock;
}

/* Called on load and after every fight. Rotates the stock when the timer is up
   and seeds it the very first time the merchant is opened. */
function tickMerchant() {
  if (!S.merchant.nextRefresh || Date.now() >= S.merchant.nextRefresh) {
    S.merchant.stock = rollMerchantStock();
    S.merchant.nextRefresh = Date.now() + MERCHANT_REFRESH_MS;
    S.merchant.forcedCount = 0;   // the free rotation clears the escalating price
    return true;
  }
  return false;
}

function forceMerchantRefresh() {
  const cost = merchantForceCost();
  if (S.gold < cost) return { ok: false, msg: `That costs ${fmt(cost)} gold.` };
  S.gold -= cost;
  S.merchant.stock = rollMerchantStock();
  S.merchant.forcedCount = (S.merchant.forcedCount || 0) + 1;
  saveGame();
  return { ok: true, msg: `New stock laid out for ${fmt(cost)} gold.` };
}

function buyFromMerchant(uidStr) {
  const idx = S.merchant.stock.findIndex(i => i.uid === uidStr);
  if (idx < 0) return { ok: false, msg: "That one is already gone." };
  const item = S.merchant.stock[idx];
  if (S.gold < item.price) return { ok: false, msg: "Not enough gold." };
  S.gold -= item.price;
  S.merchant.stock.splice(idx, 1);
  delete item.price;
  S.inventory.push(item);
  S.tally.items++;
  saveGame();
  return { ok: true, msg: `Bought ${item.name}.`, item };
}


/* ======== js/core/descent.js ======== */
/* ===========================================================================
   THE DESCENT — the endgame run.
   ---------------------------------------------------------------------------
   An endless dive unlocked by killing Opus. Enemies gain health and damage far
   faster than in an ordinary realm, and every few floors you choose one of three
   BOONS which last for that run.

   The design rule, and the reason this is not a treadmill: the enemy side scales
   automatically and the player side scales BY CHOICE. Watching a percentage tick
   up in the background feels like nothing. Picking Ruin, then Ruin again, then
   Cruelty, and watching your damage go somewhere absurd feels like a run. Two
   descents with the same character end in different places.

   Every Boon is additive power that suits any build. Nothing here takes an
   ability away, forbids a damage type, or asks a warrior to become a mage — a
   restriction that invalidates a build is a wall, not a challenge.

   Enemy scaling is steep on purpose (see DESCENT_POWER_RATE). It has to
   outrun a good Boon run eventually, otherwise there is no end to find.
   =========================================================================== */

/* Enemy power is EXPONENTIAL, not linear. Boons stack additively — twenty Ruins
   is +280% damage, not 280x — so linear enemy growth never catches up and a run
   simply never ends. Tested at several rates: 4% reaches floor ~90, 8% about 40.
   6% lands a good run around fifty to sixty floors, which is five or six Wardens
   and roughly eighteen boons. */
const DESCENT_POWER_RATE = 1.06;
const DESCENT_BOON_EVERY = 5;           // a choice of three Boons this often
const DESCENT_WARDEN_EVERY = 10;        // a raid boss guards this floor
const DESCENT_XP_PER_FLOOR = 0.06;
const DESCENT_GOLD_PER_FLOOR = 0.09;
const DESCENT_FIND_PER_FLOOR = 6;       // percentage points of magic find
const WARDEN_HP_MULT = 4.0;
const WARDEN_DMG_MULT = 1.25;

/* ---------------------------------------------------------------------------
   BOONS
   Each is written to be worth taking regardless of how you fight. `stacks` is
   how many times it may be offered; several are deliberately repeatable so a
   run can commit hard to one line.
   --------------------------------------------------------------------------- */
const BOONS = [
  // --- raw damage, taken by everyone
  { id: "ruin", name: "Ruin", max: 99, mods: { allDmg: 22 },
    text: "+22% damage of every school." },
  { id: "cruelty", name: "Cruelty", max: 99, mods: { crit: 9, critDmg: 35 },
    text: "+9% critical strike and +35% critical damage." },
  { id: "quickening", name: "Quickening", max: 99, mods: { haste: 16 },
    text: "+16% Haste. Faster swings and shorter gaps between spells." },

  // --- staying alive, which matters more the deeper you are
  { id: "vitality", name: "Vitality", max: 99, mods: { hpPct: 25 },
    text: "+25% maximum Health." },
  { id: "bulwark_boon", name: "Bulwark", max: 6, mods: { dr: 7, armorPct: 30 },
    text: "7% damage reduction and +30% Armor." },
  { id: "hunger", name: "Hunger", max: 8, mods: { lifesteal: 6 },
    text: "Heal for 6% of all damage you deal." },

  // --- resources, so a long run does not simply run out
  { id: "wellspring", name: "Wellspring", max: 6, mods: { manaPct: 30, manaRegen: 50 },
    text: "+30% maximum Mana and +50% mana regeneration." },
  { id: "focus", name: "Focus", max: 5, mods: { cdr: 15 },
    text: "15% shorter spell cooldowns." },
  { id: "alchemy", name: "Alchemist's Gift", max: 4, mods: { healPct: 45 },
    text: "+45% to all healing you receive, potions included." },

  // --- the interesting ones: procs that change the texture of a fight
  { id: "b_windfury", name: "Storm's Favour", max: 3, effect: { id: "windfury", chance: 12, potency: 1 },
    text: "12% chance on hit to strike again immediately." },
  { id: "b_rend", name: "Open Wound", max: 3, effect: { id: "rend", chance: 15, potency: 1.2 },
    text: "15% chance on hit to open a deep bleed." },
  { id: "b_momentum", name: "Bloodhunt", max: 2, effect: { id: "momentum", chance: 100, potency: 1.3 },
    text: "Every kill grants haste and damage for twelve seconds." },
  { id: "b_shatter", name: "Killing Edge", max: 3, effect: { id: "shatter", chance: 25, potency: 1.3 },
    text: "Critical strikes have a 25% chance to shatter for heavy extra damage." },
  { id: "b_vengeance", name: "Spite", max: 3, effect: { id: "vengeance", chance: 20, potency: 1.3 },
    text: "20% chance when struck to gain a lasting damage bonus." },
  { id: "b_ambush", name: "First Blood", max: 1, effect: { id: "ambush", chance: 100, potency: 1.4 },
    text: "Open every fight with a large burst of critical strike and damage." },
  { id: "b_lastbreath", name: "Refusal", max: 1, effect: { id: "lastbreath", chance: 40, potency: 1.4 },
    text: "Below 30% Health, a 40% chance when struck to be pulled back from it." },

  // --- run economy
  { id: "greed", name: "Greed", max: 4, mods: { goldFind: 60, magicFind: 35 },
    text: "+60% gold and +35% magic find for the rest of the run." },
  { id: "insight", name: "Insight", max: 4, mods: { xpBonus: 50 },
    text: "+50% experience for the rest of the run." },
];

function boonById(id) { return BOONS.find(b => b.id === id) || null; }

/* Three to choose from, never one you have already maxed, never a duplicate
   within the same offer. */
function rollBoonChoices() {
  const taken = S.descent.boons || {};
  const pool = BOONS.filter(b => (taken[b.id] || 0) < b.max);
  const out = [];
  const copy = pool.slice();
  for (let i = 0; i < 3 && copy.length; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    out.push(copy[idx].id);
    copy.splice(idx, 1);
  }
  return out;
}

function takeBoon(id) {
  const b = boonById(id);
  if (!b) return { ok: false, msg: "Unknown boon." };
  S.descent.boons[id] = (S.descent.boons[id] || 0) + 1;
  S.descent.pendingChoices = null;
  saveGame();
  return { ok: true, msg: `${b.name} taken.` };
}

/* Everything the chosen Boons currently contribute. Read by computeStats. */
function descentBoonMods() {
  const mods = {};
  if (!S.descent || !S.descent.active) return mods;
  for (const id in S.descent.boons) {
    const b = boonById(id);
    if (b && b.mods) addMods(mods, b.mods, S.descent.boons[id]);
  }
  return mods;
}

function descentBoonEffects() {
  const out = [];
  if (!S.descent || !S.descent.active) return out;
  for (const id in S.descent.boons) {
    const b = boonById(id);
    if (b && b.effect) {
      out.push({ id: b.effect.id, chance: b.effect.chance * S.descent.boons[id], potency: b.effect.potency || 1 });
    }
  }
  return out;
}

/* ---------------------------------------------------------------------------
   Run lifecycle
   --------------------------------------------------------------------------- */
function descentUnlocked() { return (S.bossKills.r3b5 || 0) > 0; }

function beginDescent() {
  S.descent = {
    active: true,
    floor: 1,
    boons: {},
    pendingChoices: null,
    best: S.descent ? (S.descent.best || 0) : 0,
    startedAt: Date.now(),
  };
  S.vitals.hp = null;
  S.vitals.mana = null;
  S.run.realmId = null;
  S.run.depth = 0;
  saveGame();
}

function endDescent(reason) {
  const floor = S.descent.floor;
  const best = Math.max(S.descent.best || 0, floor - 1);
  // a snapshot of the run just ended, for the recap shown next time you open the page
  S.lastDescent = {
    floor: floor - 1,
    boons: { ...(S.descent.boons || {}) },
    boonCount: Object.values(S.descent.boons || {}).reduce((a, b) => a + b, 0),
    wardens: Math.floor((floor - 1) / DESCENT_WARDEN_EVERY),
    reason,
    at: Date.now(),
  };
  S.descent = { active: false, floor: 0, boons: {}, pendingChoices: null, best };
  S.vitals.hp = null;
  S.vitals.mana = null;
  saveGame();
  return { floor: floor - 1, best, reason };
}

/* Which enemy the current floor throws at you. Every tenth floor is a Warden —
   one of the fifteen raid bosses, scaled to the floor rather than its own level. */
function makeDescentEnemy() {
  const floor = S.descent.floor;
  const power = Math.pow(DESCENT_POWER_RATE, floor - 1);
  const isWarden = floor % DESCENT_WARDEN_EVERY === 0;

  let e;
  if (isWarden) {
    const all = [];
    for (const raid of RAIDS) for (const b of raid.bosses) all.push(b);
    const boss = all[Math.floor((floor / DESCENT_WARDEN_EVERY - 1) % all.length)];
    e = makeBossEnemy(boss);
    e.name = `${boss.name}, Warden of the Descent`;
    e.isWarden = true;
    // a Warden is scaled to the floor, not to the level it normally sits at
    /* A Warden is a spike, not a wall. Its health multiplier is modest because
       the floor scaling is already doing the work, and its damage is held back
       further so a Warden kills you slowly enough to be fought rather than
       deleting you on arrival. */
    const ref = enemyBaseHp(50) * WARDEN_HP_MULT * power;
    const refDmg = enemyBaseDmg(50) * WARDEN_DMG_MULT * power;
    e.maxHp = Math.round(ref); e.hp = e.maxHp;
    e.dmgMin = refDmg * 0.9; e.dmgMax = refDmg * 1.1;
    e.xp = Math.round(enemyXp(50) * 14);
    e.gold = Math.round(enemyGold(50) * 18);
  } else {
    // anything from anywhere in the world, scaled to the floor
    const realm = pick(REALMS);
    e = makeRealmEnemy(realm, 0);
    e.descentILvl = descentDropLevel(floor);
    e.level = 50;
    e.maxHp = Math.round(enemyBaseHp(50) * (ROLES[e.role] || ROLES.grunt).hp * power);
    e.hp = e.maxHp;
    const d = enemyBaseDmg(50) * (ROLES[e.role] || ROLES.grunt).dmg * (ROLES[e.role] || ROLES.grunt).speed * power;
    e.dmgMin = d * 0.88; e.dmgMax = d * 1.12;
    e.armor = enemyBaseArmor(50) * (ROLES[e.role] || ROLES.grunt).armor;
    e.xp = Math.round(enemyXp(50) * (1 + (floor - 1) * DESCENT_XP_PER_FLOOR));
    e.gold = Math.round(enemyGold(50) * (1 + (floor - 1) * DESCENT_GOLD_PER_FLOOR));
  }
  e.descentFloor = floor;
  e.descentILvl = descentDropLevel(floor);
  return e;
}

/* Called after a Descent victory. Returns true when a Boon choice is waiting. */
function advanceDescent() {
  S.descent.floor++;
  if ((S.descent.floor - 1) % DESCENT_BOON_EVERY === 0) {
    S.descent.pendingChoices = rollBoonChoices();
    return true;
  }
  return false;
}

/* The item level of gear a Descent enemy drops. Starts at the cap of 52 and
   climbs from there, so the deeper you are the stronger the loot — the reward
   for pushing, and the only place in the game that drops above item level 52. */
const DESCENT_ILVL_BASE = 52;
const DESCENT_ILVL_PER_WARDEN = 2;
function descentDropLevel(floor) {
  return DESCENT_ILVL_BASE + Math.floor(floor / DESCENT_WARDEN_EVERY) * DESCENT_ILVL_PER_WARDEN;
}

function descentMagicFind() {
  if (!S.descent || !S.descent.active) return 0;
  return (S.descent.floor - 1) * DESCENT_FIND_PER_FLOOR;
}


/* ======== js/ui/theme.js ======== */
/* ===========================================================================
   THEMES — swappable colour palettes.
   ---------------------------------------------------------------------------
   Every colour in the stylesheet comes from a CSS custom property on :root, so
   changing the look is a matter of rewriting a handful of variables rather than
   touching any markup. A theme is just a map of variable name to colour.

   A custom theme supplies only four anchors — background, panel, accent and
   text. Everything else is derived, because asking someone to pick twenty
   related colours by hand produces something unreadable nine times in ten.
   =========================================================================== */

/* Mixes two hex colours. Used to derive the in-between shades of a palette. */
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
  const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

/* Rough perceived brightness, 0 to 1. Decides whether a palette needs dark text. */
function luminance(hex) {
  const p = parseInt(hex.slice(1), 16);
  return (((p >> 16) & 255) * 0.299 + ((p >> 8) & 255) * 0.587 + (p & 255) * 0.114) / 255;
}

/* Builds a complete palette from four anchors. */
function derivePalette(bg, panel, accent, text) {
  const light = luminance(bg) > 0.5;
  const toward = light ? "#000000" : "#ffffff";
  const away = light ? "#ffffff" : "#000000";

  return {
    "--void": bg,
    "--pitch": panel,
    "--slate": mixHex(panel, toward, 0.05),
    "--raise": mixHex(panel, toward, 0.11),
    "--edge": mixHex(panel, toward, 0.16),
    "--edge-hi": mixHex(panel, toward, 0.28),

    "--bone": text,
    "--ash": mixHex(text, away, 0.32),
    "--dim": mixHex(text, away, 0.55),

    "--brass": accent,
    "--brass-hi": mixHex(accent, toward, 0.25),
  };
}

};

/* The rarity colours travel with the theme so a light palette stays readable. */
const THEME_RARITY = {
  bone: {
    "--r-common": "#6f6a5e", "--r-uncommon": "#3f7a3b", "--r-rare": "#2f5f96",
    "--r-epic": "#6b3f92", "--r-legendary": "#9a6416", "--r-unique": "#b02a4a",
  },
};

const Theme = {
  apply(id) {
    const root = document.documentElement;
    let vars;

    if (id === "custom") {
      const c = S.settings.customTheme || DEFAULT_CUSTOM;
      vars = Object.assign(
        {},
        THEMES.grimoire.vars,                       // accents fall back to sane values
        derivePalette(c.bg, c.panel, c.accent, c.text),
        { "--blood": c.blood || "#ac3c3c", "--witch": c.witch || "#7d6cb8", "--verdant": c.verdant || "#6d9c60" }
      );
    } else {
      const t = THEMES[id] || THEMES.grimoire;
      vars = t.vars;
    }

    for (const k in vars) root.style.setProperty(k, vars[k]);

    // rarity colours: theme-specific if provided, otherwise the defaults
    const rar = THEME_RARITY[id] || {
      "--r-common": "#8e8778", "--r-uncommon": "#5f9b5b", "--r-rare": "#4a7fb5",
      "--r-epic": "#8a5fb0", "--r-legendary": "#c8873a", "--r-unique": "#d2536b",
    };
    for (const k in rar) root.style.setProperty(k, rar[k]);

  },

  /* Text size is independent of palette, but it lives here because both are
     just custom properties on :root. Only font sizes scale — padding and gaps
     stay put, so the layout does not reflow when someone wants larger text. */
  applyTextScale(v) {
    const scale = clamp(v || 1, 0.8, 1.6);
    document.documentElement.style.setProperty("--fs", scale);
  },

  setTextScale(v) {
    S.settings.textScale = clamp(parseFloat(v) || 1, 0.8, 1.6);
    saveGame();
    this.applyTextScale(S.settings.textScale);
  },

  set(id) {
    S.settings.theme = id;
    saveGame();
    this.apply(id);
  },

  setCustom(part, value) {
    if (!S.settings.customTheme) S.settings.customTheme = Object.assign({}, DEFAULT_CUSTOM);
    S.settings.customTheme[part] = value;
    S.settings.theme = "custom";
    saveGame();
    this.apply("custom");
  },
};

const DEFAULT_CUSTOM = {
  bg: "#0e0a12", panel: "#171120", accent: "#bd8c45", text: "#cec4b6",
  blood: "#ac3c3c", witch: "#7d6cb8", verdant: "#6d9c60",
};


/* ======== js/ui/ui.js ======== */
/* ===========================================================================
   UI CORE — the shell, the router, and the bits every panel needs.
   ---------------------------------------------------------------------------
   Rendering is deliberately dumb: change state, call UI.render(), the whole
   active panel is rebuilt. At this scale that is instant, and it means no
   panel can ever show stale numbers.

   The one exception is the fight view, which updates its bars and log on every
   frame through UI.tickCombat() rather than a full rebuild.
   =========================================================================== */

const UI = {
  route: "realms",
  tab: {},          // per-panel sub-tab memory
  el: {},           // cached DOM references
  modal: null,

  /* -------------------------------------------------------------- boot -- */
  mount() {
    document.body.innerHTML = `
      <div class="app">
        <aside class="rail">
          <div class="brand">
            <h1>Bloodfell</h1>
            <div class="sub">the ground drinks deep</div>
          </div>
          <div class="charcard" id="charcard"></div>
          <nav class="nav" id="nav"></nav>
          <div class="railfoot">
            <button class="btn sm" onclick="UI.openChangelog()" id="changelogbtn">What's new</button>
            <button class="btn sm" onclick="UI.openSave()">Save file</button>
            <button class="btn sm danger" onclick="UI.confirmWipe()">New game</button>
          </div>

    Tooltip.init();

      if (e.target.closest && e.target.closest("button")) Sound.play("click", 40);
    });
    this.renderNav();
    this.render();
    this.refreshChangelogMark();
  },

  /* ------------------------------------------------------------- chrome -- */
  NAV: [
    { group: "Fight" },
    { id: "realms", label: "Realms", glyph: "\u2694" },
    { id: "raids", label: "Raids", glyph: "\u2620" },
    { id: "descent", label: "The Descent", glyph: "\u2193" },
    { group: "Character" },
    { id: "character", label: "Character", glyph: "\u25C8" },
    { id: "inventory", label: "Inventory", glyph: "\u2263" },
    { id: "talents", label: "Talents", glyph: "\u2733" },
    { id: "skills", label: "Skills", glyph: "\u25C9" },
    { group: "Craft" },
    { id: "blacksmith", label: "Blacksmith", glyph: "\u2692" },
    { id: "alchemy", label: "Alchemy", glyph: "\u2697" },
    { id: "enchanting", label: "Enchanting", glyph: "\u2721" },
    { id: "materials", label: "Materials", glyph: "\u26CF" },
    { id: "uniques", label: "Uniques", glyph: "❖" },
    { group: "Town" },
    { id: "merchant", label: "Merchant", glyph: "\u2696" },
    { id: "settings", label: "Settings", glyph: "\u2699" },
  ],

  refreshChangelogMark() {
    const btn = document.getElementById("changelogbtn");
    if (btn) btn.classList.toggle("unread", changelogUnread());
  },

  renderNav() {
    let html = "";
    for (const n of this.NAV) {
      if (n.group) { html += `<div class="navgroup">${n.group}</div>`; continue; }
      html += `<button class="navbtn" data-nav="${n.id}" onclick="UI.go('${n.id}')">
        <span class="glyph">${n.glyph}</span><span>${n.label}</span>
        <span class="pip" data-pip="${n.id}" style="display:none"></span>
      </button>`;
    }
    this.el.nav.innerHTML = html;
  },

  go(route) {
    this.route = route;
    this.render();
    // a short one-time explainer the first time a major section is opened
    if (typeof maybeShowGuide === "function") maybeShowGuide(route);
  },

  toggleGuides(off) {
    if (!S.settings.seenGuides) S.settings.seenGuides = {};
    if (off) for (const k in GUIDES) S.settings.seenGuides[k] = true;
    else S.settings.seenGuides = {};
    saveGame();
  },

  renderCharCard() {
    if (!this.el.charcard) return;   // called before mount, or from a headless test
    const st = computeStats();
    const v = currentVitals();
    const hpNow = Combat.active ? Combat.player.hp : v.hp;
    const mpNow = Combat.active ? Combat.player.mana : v.mana;
    const need = xpToNext(S.level);
    const maxed = S.level >= MAX_LEVEL;

    this.el.charcard.innerHTML = `
      <div class="lvl"><b>Level ${S.level}</b><span>${maxed ? "MAX" : ""}</span></div>
      <div class="barlabel"><span>Health</span><span>${fmt(hpNow)} / ${fmt(st.maxHp)}</span></div>
      <div class="bar hp"><i style="width:${clamp(hpNow / st.maxHp * 100, 0, 100)}%"></i></div>
      <div class="barlabel"><span>Mana</span><span>${fmt(mpNow)} / ${fmt(st.maxMana)}</span></div>
      <div class="bar mana"><i style="width:${clamp(mpNow / st.maxMana * 100, 0, 100)}%"></i></div>
      <div class="barlabel"><span>Experience</span><span>${maxed ? "\u2014" : fmt(S.xp) + " / " + fmt(need)}</span></div>
      <div class="bar xp"><i style="width:${maxed ? 100 : clamp(S.xp / need * 100, 0, 100)}%"></i></div>
      <div class="purse">${fmt(S.gold)} gold</div>
      ${S.run.realmId ? `<div class="runline">
        <span>${realmById(S.run.realmId) ? realmById(S.run.realmId).name : ""}</span>
        <b>depth ${S.run.depth}</b></div>` : ""}`;

    // talent points waiting to be spent
    const pip = document.querySelector('[data-pip="talents"]');
    if (pip) {
      const avail = pointsAvailable();
      pip.style.display = avail > 0 ? "" : "none";
      pip.textContent = avail;
    }
  },

  /* -------------------------------------------------------------- render -- */
  render() {
    // the element being described may be about to vanish
    if (typeof Tooltip !== "undefined") Tooltip.hide();
    document.querySelectorAll("[data-nav]").forEach(b => {
      b.classList.toggle("on", b.dataset.nav === this.route);
    });
    this.renderCharCard();

    const map = {
      realms: renderRealms,
      raids: renderRaids,
      descent: renderDescent,
      character: renderCharacter,
      inventory: renderInventory,
      talents: renderTalents,
      skills: renderSkills,
      blacksmith: renderBlacksmith,
      alchemy: renderAlchemy,
      enchanting: renderEnchanting,
      materials: renderMaterials,
      uniques: renderUniques,
      merchant: renderMerchant,
      settings: renderSettings,
    };
    const fn = map[this.route] || renderRealms;
    this.el.main.innerHTML = (STORAGE_OK ? "" : this.storageNotice()) + fn();

    if (this.route === "realms" || this.route === "raids") this.tickCombat(true);
  },

  storageNotice() {
    return `<div class="notice">
      This browser is blocking local storage, so progress will not survive a refresh.
      Open the game by double-clicking <b>index.html</b> from your own machine, or use
      <b>Save file &rarr; Export</b> to keep a copy of your character.
    </div>`;
  },

  /* ------------------------------------------------------------- helpers -- */
  toast(msg, kind) {
    if (!this.el.toasts) return;   // called before mount
    const d = document.createElement("div");
    d.className = "toast" + (kind ? " " + kind : "");
    d.innerHTML = msg;
    this.el.toasts.appendChild(d);
    setTimeout(() => d.remove(), 3400);
  },

  say(res) {
    if (!res) return;
    if (!res.ok) Sound.play("error", 0);
    this.toast(res.msg || "", res.ok ? "good" : "bad");
    if (res.ok) this.render();
  },

  openModal(html) {
    this.el.modalhost.innerHTML = `<div class="scrim" onclick="if(event.target===this)UI.closeModal()">
      <div class="modal">${html}</div></div>`;
  },
  closeModal() { this.el.modalhost.innerHTML = ""; },

  openChangelog() {
    markChangelogRead();
    this.refreshChangelogMark();
    const entries = CHANGELOG.map((e, i) => `
      <div class="clentry">
        <div class="clhead">
          <span class="clver">v${e.v}</span>
          <span class="cltitle">${e.title}</span>
          ${e.date === "current" ? `<span class="clcurrent">you are here</span>` : ""}
        </div>
        <ul class="cllines">
          ${e.lines.map(l => `<li>${l}</li>`).join("")}
        </ul>
      </div>`).join("");
    this.openModal(`
      <div class="modalhead">
        <h2>Update log</h2>
        <div class="modalsub">Currently playing version ${VERSION}</div>
      </div>
      <div class="changelog">${entries}</div>
      <div class="modalfoot"><button class="btn" onclick="UI.closeModal()">Close</button></div>
    `);
  },

  openSave() {
    this.openModal(`
      <h3>Save file</h3>
      <p style="color:var(--ash);font-size:12.5px">
        Copy this text somewhere safe to back up your character, or paste one in and load it.
        The game also saves automatically after every fight.</p>
      <textarea id="savebox" spellcheck="false">${exportSave()}</textarea>
      <div class="modalfoot">
        <button class="btn" onclick="UI.doImport()">Load pasted save</button>
        <button class="btn primary" onclick="UI.closeModal()">Done</button>
      </div>`);
    setTimeout(() => { const b = document.getElementById("savebox"); if (b) b.select(); }, 40);
  },

  doImport() {
    const box = document.getElementById("savebox");
    try {
      importSave(box.value);
      this.closeModal();
      Combat.stop();
      S.settings.autoGrind = false;
      this.render();
      this.toast("Save loaded.", "good");
    } catch (e) {
      this.toast("That does not look like a valid save.", "bad");
    }
  },

  confirmWipe() {
    this.openModal(`
      <h3>Start over?</h3>
      <p style="color:var(--ash)">This erases your character, gear, materials and every unlock.
      There is no undo. Export your save first if you want to keep it.</p>
      <div class="modalfoot">
        <button class="btn" onclick="UI.closeModal()">Keep playing</button>
        <button class="btn danger" onclick="UI.doWipe()">Erase everything</button>
      </div>`);
  },

  doWipe() {
    Combat.stop();
    wipeSave();
    giveStarterKit();
    saveGame();
    this.closeModal();
    this.route = "realms";
    this.render();
    this.toast("A new character stirs.", "good");
  },
};

/* ===========================================================================
   Shared rendering helpers used by more than one panel.
   =========================================================================== */

const STAT_LABEL = {
  str: "Strength", agi: "Agility", int: "Intellect", spi: "Spirit", sta: "Stamina",
  armor: "Armor", crit: "Crit", haste: "Haste", dodge: "Dodge", block: "Block",
  critDmg: "Crit Damage", lifesteal: "Lifesteal", thorns: "Thorns",
  physDmg: "Physical Damage", magicDmg: "Magic Damage", allDmg: "Damage",
  hpPct: "Max Health", dr: "Damage Reduction", healPct: "Healing",
  manaPct: "Max Mana", manaRegen: "Mana Regen", goldFind: "Gold Found",
  magicFind: "Magic Find", cdr: "Cooldown Reduction", execDmg: "Execute Damage",
  strPct: "Strength", agiPct: "Agility", intPct: "Intellect", spiPct: "Spirit", staPct: "Stamina",
  armorPct: "Armor", xpBonus: "Experience",
};
const PERCENT_STATS = ["crit", "haste", "dodge", "block", "critDmg", "lifesteal", "thorns",
  "physDmg", "magicDmg", "allDmg", "hpPct", "dr", "healPct", "manaPct", "manaRegen",
  "goldFind", "magicFind", "cdr", "execDmg", "strPct", "agiPct", "intPct", "spiPct",
  "staPct", "armorPct", "xpBonus"];

/* Primary stats first, then stamina, then the secondaries — the order people
   expect to read them in. */
const STAT_ORDER = ["str", "agi", "int", "spi", "sta", "armor", "crit", "haste",
  "critDmg", "dodge", "block", "lifesteal", "thorns"];
function statSortRank(k) {
  const i = STAT_ORDER.indexOf(k);
  return i < 0 ? 99 : i;
}

/* Stat names are deliberately uncoloured. Colouring every primary turned the
   character sheet and every item into a rainbow that was harder to read, not
   easier — rarity colour on the item name already carries the useful signal.
   statClass is kept as a no-op so nothing has to be rewired if you want to try
   a different scheme later. */
function statClass() { return ""; }

function statLine(key, value) {
  const label = STAT_LABEL[key] || key;
  const pct = PERCENT_STATS.includes(key);
  const v = Math.round(value * 10) / 10;
  return `+${v}${pct ? "%" : ""} ${label}`;
}

/* Stats as a grid, one per line — far easier to scan than a run-on line. */
function itemStatGrid(item) {
  const cells = [];

  if (item.weapon) {
    const dps = ((item.weapon.min + item.weapon.max) / 2) / item.weapon.speed;
    cells.push(`<div class="s wpn"><span class="v">${fmt(item.weapon.min)}\u2013${fmt(item.weapon.max)}</span><span class="k">damage</span></div>`);
    cells.push(`<div class="s wpn"><span class="v">${item.weapon.speed.toFixed(2)}s</span><span class="k">speed (${dps.toFixed(1)} dps)</span></div>`);
  }

  const keys = Object.keys(item.stats).filter(k => item.stats[k]);
  keys.sort((a, b) => statSortRank(a) - statSortRank(b));
  for (const k of keys) {
    const pct = PERCENT_STATS.includes(k);
    const v = Math.round(item.stats[k] * 10) / 10;
    cells.push(`<div class="s"><span class="v ${statClass(k)}">+${v}${pct ? "%" : ""}</span><span class="k ${statClass(k)}">${STAT_LABEL[k] || k}</span></div>`);
  }

  if (item.enchant) {
    const e = ENCHANTS.find(x => x.id === item.enchant);
    if (e) cells.push(`<div class="s ench"><span class="v">\u2727</span><span class="k">${e.name}</span></div>`);
  }

  return `<div class="statgrid">${cells.join("")}</div>`;
}

/* Human label for a slot TYPE (helm, ring, weapon, ...), used by the aspect
   workbench where slots are grouped by type rather than by specific slot. */
function slotTypeLabel(t) {
  const map = { helm: "Helm", shoulders: "Shoulders", cape: "Cape", chest: "Chest",
    wrist: "Wrist", gloves: "Gloves", waist: "Waist", legs: "Legs", boots: "Boots",
    ring: "Ring", trinket: "Trinket", mainhand: "Weapon", offhand: "Off-hand" };
  return map[t] || (t.charAt(0).toUpperCase() + t.slice(1));
}

function slotLabel(slotType) {
  const s = SLOTS.find(x => (x.type || x.key) === slotType);
  return s ? s.name : slotType;
}

/* Compares an inventory item against whatever is currently worn. */
function upgradeDelta(item) {
  const targets = slotsForItem(item);
  let best = Infinity;
  for (const t of targets) best = Math.min(best, itemScore(S.equipment[t]));
  return itemScore(item) - best;
}

function itemRow(item, actions) {
  const delta = upgradeDelta(item);
  const up = delta > 0 ? `<span class="upgrade">\u25B2 +${delta}</span>` : "";
  return `<div class="itemrow b-${item.rarity}" data-tip="inv:${item.uid}">
    <div class="main">
      <div class="nm r-${item.rarity}">${item.name} ${up}</div>
      <div class="sub">${slotLabel(item.slot)} \u00B7 item level ${item.ilvl} \u00B7 ${RARITIES[item.rarity].name}</div>
      ${itemStatGrid(item)}
    </div>
    <div class="acts">${actions}</div>
  </div>`;
}

function costText(mats, gold) {
  const parts = [];
  if (gold) {
    const lack = S.gold < gold ? " class='lack'" : "";
    parts.push(`<span${lack}>${fmt(gold)}g</span>`);
  }
  for (const id in mats) {
    const have = S.materials[id] || 0;
    const need = mats[id];
    const lack = have < need ? " class='lack'" : "";
    parts.push(`<span${lack}>${need} ${MATERIALS[id].name}</span>`);
  }
  return parts.join(" \u00B7 ");
}

/* ======== js/ui/tooltip.js ======== */
/* ===========================================================================
   TOOLTIPS — hover an item to read it, hold Shift to compare.
   ---------------------------------------------------------------------------
   Everything is wired through event delegation on a single listener, so panels
   can re-render as often as they like without rebinding anything. An element
   opts in by carrying a data-tip attribute:

       data-tip="inv:<uid>"     an item sitting in the inventory
       data-tip="eq:<slotKey>"  an item currently worn
       data-tip="shop:<uid>"    an item on the merchant's table
       data-tip="stat:<key>"    a line on the character sheet
       data-tip="spell:<id>"    a spell, wherever it is listed

   Holding Shift while hovering an inventory item puts the equipped piece side
   by side and marks every stat with how much it would change.

   Touch devices have no hover, so a tap opens the tooltip and a tap anywhere
   else closes it.
   =========================================================================== */

const Tooltip = {
  el: null,
  shiftHeld: false,
  current: null,     // { item, compare }
  lastXY: { x: 0, y: 0 },

  init() {
    this.el = document.createElement("div");
    this.el.className = "tip";
    this.el.style.display = "none";
    document.body.appendChild(this.el);

    // delegation: one listener for the whole document, forever
    document.addEventListener("mouseover", e => {
      const host = e.target.closest && e.target.closest("[data-tip]");
      if (!host) return;
      this.openFrom(host, e.clientX, e.clientY);
    });
    document.addEventListener("mouseout", e => {
      const host = e.target.closest && e.target.closest("[data-tip]");
      if (!host) return;
      const to = e.relatedTarget;
      if (to && to.closest && to.closest("[data-tip]") === host) return;
      this.hide();
    });
    document.addEventListener("mousemove", e => {
      this.lastXY = { x: e.clientX, y: e.clientY };
      if (this.current) this.place(e.clientX, e.clientY);
    });

    // Shift redraws the open tooltip in comparison mode
    window.addEventListener("keydown", e => {
      if (e.key === "Shift" && !this.shiftHeld) { this.shiftHeld = true; this.redraw(); }
    });
    window.addEventListener("keyup", e => {
      if (e.key === "Shift") { this.shiftHeld = false; this.redraw(); }
    });
    // releasing shift outside the window would otherwise leave it stuck on
    window.addEventListener("blur", () => { this.shiftHeld = false; this.redraw(); });

    // touch: tap to open, tap elsewhere to dismiss
    document.addEventListener("touchstart", e => {
      const host = e.target.closest && e.target.closest("[data-tip]");
      if (!host) { this.hide(); return; }
      const t = e.touches[0];
      this.openFrom(host, t.clientX, t.clientY);
    }, { passive: true });

    document.addEventListener("scroll", () => this.hide(), true);
  },

  openFrom(host, x, y) {
    const spec = host.dataset.tip || "";
    const [kind, key] = spec.split(":");
    let item = null, compare = null;

    if (kind === "inv") {
      item = S.inventory.find(i => i.uid === key);
      if (item) compare = bestWornFor(item);
    } else if (kind === "eq") {
      item = S.equipment[key];
    } else if (kind === "shop") {
      item = (S.merchant.stock || []).find(i => i.uid === key);
      if (item) compare = bestWornFor(item);
    } else if (kind === "stat") {
      this.current = { plain: statExplainCard(key) };
      this.redraw(); this.place(x, y); return;
    } else if (kind === "spell") {
      this.current = { plain: spellCard(key) };
      this.redraw(); this.place(x, y); return;
    }
    if (!item) { this.hide(); return; }

    this.current = { item, compare };
    this.redraw();
    this.place(x, y);
  },

  redraw() {
    if (!this.current || !this.el) return;
    if (this.current.plain) {
      this.el.innerHTML = this.current.plain;
      this.el.style.display = "block";
      this.place(this.lastXY.x, this.lastXY.y);
      return;
    }
    const { item, compare } = this.current;
    const comparing = this.shiftHeld && compare;

    let html = tipCard(item, comparing ? compare : null);
    if (comparing) {
      html += `<div class="tip-vs">currently worn</div>` + tipCard(compare, null, true);
    } else if (compare) {
      html += `<div class="tip-hint">hold <b>Shift</b> to compare with what you are wearing</div>`;
    }
    this.el.innerHTML = html;
    this.el.style.display = "block";
    this.place(this.lastXY.x, this.lastXY.y);
  },

  place(x, y) {
    if (!this.el || this.el.style.display === "none") return;
    const pad = 14;
    const w = this.el.offsetWidth, h = this.el.offsetHeight;
    let left = x + pad, top = y + pad;
    if (left + w > window.innerWidth - 8) left = x - w - pad;
    if (left < 8) left = 8;
    if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
    if (top < 8) top = 8;
    this.el.style.left = left + "px";
    this.el.style.top = top + "px";
  },

  hide() {
    this.current = null;
    if (this.el) this.el.style.display = "none";
  },
};

/* Which worn item an inventory piece would actually replace — for rings and
   trinkets that is whichever of the two is worse. */
function bestWornFor(item) {
  const targets = slotsForItem(item);
  let worst = null, worstScore = Infinity;
  for (const t of targets) {
    const cur = S.equipment[t];
    const sc = itemScore(cur);
    if (sc < worstScore) { worstScore = sc; worst = cur; }
  }
  return worst;
}

/* ---------------------------------------------------------------------------
   Card rendering. `against` turns on the green/red deltas.
   --------------------------------------------------------------------------- */
function tipCard(item, against, muted) {
  const R = RARITIES[item.rarity];
  const rows = [];

  // weapon block
  if (item.weapon) {
    const dps = ((item.weapon.min + item.weapon.max) / 2) / item.weapon.speed;
    let dpsDelta = "";
    if (against && against.weapon) {
      const other = ((against.weapon.min + against.weapon.max) / 2) / against.weapon.speed;
      dpsDelta = deltaSpan(dps - other, 1);
    }
    rows.push(`<div class="tip-weapon">
      <span>${fmt(item.weapon.min)} \u2013 ${fmt(item.weapon.max)} damage</span>
      <span class="tip-dim">speed ${item.weapon.speed.toFixed(2)}</span>
    </div>
    <div class="tip-weapon"><span class="tip-dim">${dps.toFixed(1)} damage per second</span>${dpsDelta}</div>`);
  }

  // every stat on the item, one per line
  const keys = Object.keys(item.stats).filter(k => item.stats[k]);
  keys.sort((a, b) => statSortRank(a) - statSortRank(b));
  const statRows = keys.map(k => {
    const v = item.stats[k];
    const pct = PERCENT_STATS.includes(k);
    let delta = "";
    if (against) {
      const other = (against.stats && against.stats[k]) || 0;
      delta = deltaSpan(v - other, pct ? 1 : 0, pct);
    }
    return `<div class="tip-stat">
      <span class="tip-val ${statClass(k)}">+${Math.round(v * 10) / 10}${pct ? "%" : ""}</span>
      <span class="tip-key ${statClass(k)}">${STAT_LABEL[k] || k}</span>
      ${delta}
    </div>`;
  }).join("");

  // stats the worn item has that this one does not
  let missing = "";
  if (against && against.stats) {
    const lost = Object.keys(against.stats).filter(k => against.stats[k] && !item.stats[k]);
    missing = lost.map(k => {
      const pct = PERCENT_STATS.includes(k);
      return `<div class="tip-stat">
        <span class="tip-val tip-none">\u2014</span>
        <span class="tip-key ${statClass(k)}">${STAT_LABEL[k] || k}</span>
        ${deltaSpan(-against.stats[k], pct ? 1 : 0, pct)}
      </div>`;
    }).join("");
  }

  const ench = item.enchant ? ENCHANTS.find(x => x.id === item.enchant) : null;
  // an applied aspect reads differently from an item's own property, and says so
  const procLine = item.aspect
    ? `<div class="tip-aspect">
         <span class="tip-aspecttag">Aspect</span>
         <b>${item.aspect.name}</b> \u2014 ${describeEffect({ id: item.aspect.id, chance: item.aspect.chance, potency: item.aspect.potency })}
         <div class="tip-aspectnote">etched on \u2014 replaces this item's own property</div>
       </div>`
    : item.proc
    ? `<div class="tip-proc"><b>${effectName(item.proc)}</b> \u2014 ${describeEffect(item.proc)}</div>` : "";
  const passiveLine = item.passive
    ? `<div class="tip-passive"><b>${item.passive.name}</b><span>${item.passive.text}</span></div>` : "";
  const flavourLine = item.flavour
    ? `<div class="tip-flavour">${item.flavour}</div>` : "";
  const setLine = item.setId ? setTooltipBlock(item.setId) : "";
  const handsLine = item.hands === 2
    ? `<div class="tip-hands">Two-handed \u2014 occupies the off-hand slot</div>` : "";

  return `<div class="tip-card ${muted ? "muted" : ""}">
    <div class="tip-name r-${item.rarity}">${item.name}</div>
    <div class="tip-meta">${slotLabel(item.slot)} \u00B7 item level ${item.ilvl} \u00B7
      <span style="color:${R.color}">${R.name}</span></div>
    ${rows.join("")}
    ${handsLine}
    ${statRows ? `<div class="tip-block">${statRows}${missing}</div>` : ""}
    ${procLine}
    ${passiveLine}
    ${ench ? `<div class="tip-ench">\u2727 ${ench.name}</div>` : ""}
    ${setLine}
    ${flavourLine}
    <div class="tip-foot">sells for ${fmt(item.value)} gold</div>
  </div>`;
}

function deltaSpan(diff, decimals, pct) {
  if (Math.abs(diff) < 0.05) return `<span class="tip-delta same">\u00B7</span>`;
  const v = decimals ? Math.abs(diff).toFixed(1) : Math.round(Math.abs(diff));
  const sign = diff > 0 ? "+" : "\u2212";
  return `<span class="tip-delta ${diff > 0 ? "up" : "down"}">${sign}${v}${pct ? "%" : ""}</span>`;
}

/* ---------------------------------------------------------------------------
   Explanations for the character sheet. Every stat says what it actually does,
   because "Spirit 240" means nothing on its own.
   --------------------------------------------------------------------------- */
const STAT_HELP = {
  str: ["Strength", "Raises the damage of Strength weapons and any spell that scales with it. The main stat for Warrior and Paladin builds."],
  agi: ["Agility", "Raises the damage of Agility weapons and adds a little critical strike and dodge. The main stat for Rogue builds."],
  int: ["Intellect", "Raises the damage of Intellect weapons and spells, and deepens your mana pool. The main stat for Mage builds."],
  spi: ["Spirit", "Raises healing done and mana regeneration, and powers most Priest and Paladin spells."],
  sta: ["Stamina", "The only source of Health worth speaking of. Every point is roughly eleven more Health."],
  maxHp: ["Health", "How much damage you can take before the fight ends. There is no death penalty, but losing wastes the attempt."],
  maxMana: ["Mana", "Spells cost mana. Run dry and you fall back to swinging your weapon until it recovers."],
  manaRegen: ["Mana regeneration", "Mana recovered per second of combat. Driven mostly by Spirit."],
  armor: ["Armor", "Reduces incoming physical damage only. Magic ignores it entirely, which is why caster enemies hurt so much."],
  dr: ["Damage reduction", "A flat percentage off everything, physical and magical alike. Rarer and stronger than Armor."],
  dodge: ["Dodge", "Chance to avoid an attack completely. Scales slightly with Agility."],
  block: ["Block", "Chance to take 45% less from a blow. Needs a shield or Strength off-hand to be worth stacking."],
  crit: ["Critical strike", "Chance for an attack or spell to land for extra damage."],
  critMult: ["Critical damage", "What a critical strike is multiplied by. 175% is the baseline."],
  haste: ["Haste", "Swing faster and shorten the global cooldown between spells. Does not reduce individual spell cooldowns."],
  lifesteal: ["Lifesteal", "Heals you for a share of all damage you deal. The most reliable sustain in the game."],
  thorns: ["Thorns", "Reflects a share of every hit you take back at the attacker."],
  physDmg: ["Physical damage", "Multiplies weapon attacks and physical spells."],
  magicDmg: ["Magic damage", "Multiplies magical spells. Does nothing for weapon swings."],
  allDmg: ["All damage", "Multiplies everything you deal, of any school."],
  healPct: ["Healing done", "Multiplies your heals, shields and healing over time."],
  execDmg: ["Execute damage", "Bonus damage against anything below 30% Health."],
  cdr: ["Cooldown reduction", "Shortens individual spell cooldowns, so they come round more often."],
  goldFind: ["Gold found", "More gold per kill."],
  magicFind: ["Magic find", "Better odds of a drop, and better odds it is a good one."],
  dps: ["Damage per second", "Your weapon swings alone, ignoring spells and procs. A rough yardstick, not the whole picture."],
  swing: ["Weapon damage", "The range a single swing lands in, including the contribution from your main stat."],
  swingTime: ["Swing time", "Seconds between weapon swings, after Haste. Slow weapons hit harder per swing for the same damage per second."],
  armorMit: ["Physical mitigation", "What your Armor actually removes from a physical hit at your level. Diminishing: each point is worth slightly less than the last."],
};

function statExplainCard(key) {
  const h = STAT_HELP[key];
  if (!h) return "";
  return `<div class="tip-card">
    <div class="tip-name" style="color:var(--bone)">${h[0]}</div>
    <div class="tip-help">${h[1]}</div>
  </div>`;
}

/* Spell cards, used on the Skills panel and the talent trees. */
function spellCard(id) {
  const sp = SPELLS.find(x => x.id === id);
  if (!sp) return "";
  const tree = TALENT_TREES.find(t => t.id === sp.tree);
  const have = pointsInTree(sp.tree);
  const unlocked = have >= sp.req;

  const kind = {
    damage: "Instant damage", dot: "Damage over time", heal: "Heal",
    hot: "Healing over time", shield: "Absorb shield", buff: "Self buff",
  }[sp.type] || sp.type;

  const scale = sp.scale === "weapon" ? "weapon damage"
    : sp.scale ? (STAT_LABEL[sp.scale] || sp.scale) : "";

  return `<div class="tip-card">
    <div class="tip-name" style="color:var(--witch)">${sp.name}</div>
    <div class="tip-meta">${tree.name} \u00B7 ${kind}${sp.school ? " \u00B7 " + (sp.school === "magic" ? "magical" : "physical") : ""}</div>
    <div class="tip-block">
      <div class="tip-stat"><span class="tip-val">${sp.cd}s</span><span class="tip-key">cooldown</span></div>
      <div class="tip-stat"><span class="tip-val">${sp.manaPct}%</span><span class="tip-key">of your mana</span></div>
      ${scale ? `<div class="tip-stat"><span class="tip-val">${Math.round((sp.coef || 0) * 100)}%</span><span class="tip-key">of ${scale}</span></div>` : ""}
      ${sp.duration ? `<div class="tip-stat"><span class="tip-val">${sp.duration}s</span><span class="tip-key">duration</span></div>` : ""}
    </div>
    <div class="tip-help">${sp.desc}</div>
    <div class="tip-foot">${unlocked
      ? `unlocked \u2014 ${have} points in ${tree.name}`
      : `needs ${sp.req} points in ${tree.name}, you have ${have}`}</div>
  </div>`;
}

/* The set block on an item tooltip. Lists every piece, marks the ones you are
   wearing, and lights the bonus tiers you have reached — the same shape an MMO
   uses, because it answers "what am I still missing" at a glance. */
function setTooltipBlock(setId) {
  const set = setById(setId);
  if (!set) return "";
  const worn = {};
  let count = 0;
  for (const slot of SLOTS) {
    const it = S.equipment[slot.key];
    if (it && it.setId === setId) { worn[it.setIndex] = true; count++; }
  }
  const owned = {};
  for (const it of S.inventory) if (it.setId === setId) owned[it.setIndex] = true;

  const pieces = SET_PIECE_NAMES[setId].map((n, i) =>
    `<div class="tip-setpiece ${worn[i] ? "on" : (owned[i] ? "held" : "")}">${n}</div>`).join("");

  const tiers = Object.keys(set.bonuses).map(Number).sort((a, b) => a - b).map(n =>
    `<div class="tip-setbonus ${count >= n ? "on" : ""}">(${n}) ${set.bonuses[n].text}</div>`).join("");

  return `<div class="tip-set">
    <div class="tip-setname">${set.name} <span>(${count}/5)</span></div>
    ${pieces}${tiers}
  </div>`;
}

/* One square. Empty slots show the icon dimmed; filled ones colour it by rarity
   and put the item's name underneath. */
function doll(slotKey) {

/* The whole panel: two columns of armour with the character between them, and
   the weapons across the bottom. */
function paperdollHtml() {
  const st = computeStats();
  const v = currentVitals();

  const left = ["helm", "shoulders", "cape", "chest", "wrist", "gloves"];
  const right = ["waist", "legs", "boots", "ring1", "ring2", "trinket1", "trinket2"];

/* ======== js/ui/panels-combat.js ======== */
/* ===========================================================================
   COMBAT PANELS — Realms, Raids, and the live fight view.
   ---------------------------------------------------------------------------
   The arena is the only part of the interface that updates every frame. It
   redraws two health bars, the buff row and the chronicle; everything else
   waits for a full render.
   =========================================================================== */

/* What auto-grind should re-engage when a fight ends. */
UI.grind = null;    // { mode: "realm" | "boss", id }

/* --------------------------------------------------------------- controls */
function combatControls() {
  const s = S.settings;
  const healOpts = POTIONS.filter(p => p.kind === "heal")
    .map(p => {
      const n = S.potions[p.id] || 0;
      const sel = s.healPotion === p.id ? " selected" : "";
      return `<option value="${p.id}"${sel}>${p.name} (${n})</option>`;
    }).join("");

  const buffOpts = POTIONS.filter(p => p.kind === "buff")
    .map(p => {
      const n = S.potions[p.id] || 0;
      const on = (s.buffPotions || []).includes(p.id);
      return `<label class="switch" style="font-size:11.5px">
        <input type="checkbox" ${on ? "checked" : ""} onchange="toggleBuffPotion('${p.id}')">
        ${p.name} <span style="color:var(--dim);font-family:var(--mono)">(${n})</span>
      </label>`;
    }).join("");

  return `<div class="panel">
    <h3>Combat settings</h3>
    <div class="ctrlbar">
      <label class="switch">
        <input type="checkbox" ${s.autoGrind ? "checked" : ""} onchange="toggleAutoGrind(this.checked)">
        Auto-grind
      </label>
      <div class="speedgrp">
        ${[1, 2, 3].map(v => `<button class="${s.speed === v ? "on" : ""}" onclick="setSpeed(${v})">${v}x</button>`).join("")}
      </div>
      <label class="switch">
        <input type="checkbox" ${s.autoPotion ? "checked" : ""} onchange="toggleAutoPotion(this.checked)">
        Drink health potions below
      </label>
      <input type="number" min="5" max="95" step="5" value="${s.potionThreshold}"
             style="width:64px" onchange="setPotionThreshold(this.value)"> %
      <label class="switch">
        <input type="checkbox" ${s.autoRetreat > 0 ? "checked" : ""} onchange="toggleAutoRetreat(this.checked)">
        Retreat below
      </label>
      <input type="number" min="5" max="90" step="5" value="${s.autoRetreat || 25}"
             style="width:64px" onchange="setAutoRetreat(this.value)"
             ${s.autoRetreat > 0 ? "" : "disabled"}> %
      <select onchange="setHealPotion(this.value)">
        <option value="">Strongest in bag</option>${healOpts}
      </select>
    </div>
    ${buffOpts ? `<div style="margin-top:8px">
      <div class="barlabel" style="margin-bottom:6px">
        <span>Drink at the start of each fight</span><span></span></div>
      <div class="ctrlbar">${buffOpts}</div>
    </div>` : ""}
  </div>`;
}

function toggleAutoGrind(v) {
  S.settings.autoGrind = v;
  saveGame();
  if (!v) { UI.grind = null; }
  UI.render();
}
function setSpeed(v) { S.settings.speed = clamp(v, 1, 3); saveGame(); UI.render(); }
function toggleAutoPotion(v) { S.settings.autoPotion = v; saveGame(); }
function setPotionThreshold(v) { S.settings.potionThreshold = clamp(parseInt(v, 10) || 40, 5, 95); saveGame(); }
function setHealPotion(v) { S.settings.healPotion = v || null; saveGame(); }
function toggleAutoRetreat(on) { S.settings.autoRetreat = on ? 25 : 0; saveGame(); UI.render(); }
function setAutoRetreat(v) { S.settings.autoRetreat = clamp(parseInt(v, 10) || 25, 5, 90); saveGame(); }
function toggleBuffPotion(id) {
  const list = S.settings.buffPotions || (S.settings.buffPotions = []);
  const i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1); else list.push(id);
  saveGame();
}

/* ------------------------------------------------------------- the arena */
function arenaHtml() {
  return `<div class="panel" id="arenapanel">

    <div class="arena">
      <div class="fighter" id="f-player"></div>
      <div class="fighter enemy" id="f-enemy"></div>

    <div style="margin-top:12px" class="chronicle" id="chronicle"></div>
    <div class="ctrlbar" style="margin:12px 0 0">

      <span id="fightstatus" style="color:var(--dim);font-family:var(--mono);font-size:11px"></span>
    </div>
