   new source of power never means touching the combat code.

   ORDER OF OPERATIONS
     1. base stats from level
     2. + flat stats from gear, enchants, talents, buffs
     3. x percent multipliers (strPct, hpPct, armorPct ...)
     4. derive Health, Mana, crit, dodge, swing damage
   =========================================================================== */

const PRIMARIES = ["str", "agi", "int", "spi"];
const FIST = { min: 3, max: 6, speed: 2.0, scalesWith: "str" };

/* Reference swing speed. Attack power per swing and normalised spell damage are
   both expressed against this, so weapon speed changes the rhythm of a fight
   without changing its total output. */
const NORM_SPEED = 2.4;

/* Mana recovered per second, as a fraction of the maximum pool. */
const MANA_REGEN_BASE = 0.016;
const MANA_REGEN_SPIRIT_CAP = 0.014;
/* Flat regen floor, so a build with almost no mana pool still recovers enough to
   use its handful of spells. Scales with level, not with the pool. */
const MANA_REGEN_FLOOR = 4;

/* Base stats a character has with no gear at all. */
function baseStats(level) {
  return {
    str: 10 + Math.round(level * 1.6),
    agi: 10 + Math.round(level * 1.6),
    int: 10 + Math.round(level * 1.6),
    spi: 10 + Math.round(level * 1.6),
    sta: 12 + Math.round(level * 2.2),
  };
}

function emptyMods() { return {}; }

function addMods(into, from, scale) {
  if (!from) return into;
  const k = scale === undefined ? 1 : scale;
  for (const key in from) into[key] = (into[key] || 0) + from[key] * k;
  return into;
}

/* How many pieces of each set are worn, and which bonus tiers that unlocks. */
function collectSets() {
  const counts = {};
  for (const slot of SLOTS) {
    const item = S.equipment[slot.key];
    if (item && item.setId) counts[item.setId] = (counts[item.setId] || 0) + 1;
  }
  const active = [];
  for (const id in counts) {
    const set = setById(id);
    if (!set) continue;
    const tiers = Object.keys(set.bonuses).map(Number).sort((a, b) => a - b);
    active.push({
      id, set, worn: counts[id],
      tiers: tiers.map(n => ({ need: n, on: counts[id] >= n, ...set.bonuses[n] })),
    });
  }
  return active;
}

/* Every proc currently active, from gear and from talents. Cached onto the stat
   block so combat does not re-walk fifteen slots and forty talents on every hit. */
function collectEffects() {
  /* Two sources of the same proc are merged into one entry rather than rolled
     twice. Merging keeps the character sheet honest — one Windfury line instead
     of three — and makes the maths obvious: chances add, and the strongest
     potency wins. Chance is capped so a heavily stacked proc cannot exceed
     certainty. */
  const merged = {};

  const add = (id, chance, potency) => {
    if (!merged[id]) merged[id] = { id, chance: 0, potency: 0, sources: 0 };
    merged[id].chance += chance;
    merged[id].potency = Math.max(merged[id].potency, potency);
    merged[id].sources++;
  };

  for (const slot of SLOTS) {
    const item = S.equipment[slot.key];
    if (item && item.proc) add(item.proc.id, item.proc.chance, item.proc.potency || 1);
  }
  // set bonuses can grant procs too, and merge with everything else
  for (const s of collectSets()) {
    for (const t of s.tiers) {
      if (t.on && t.effect) add(t.effect.id, t.effect.chance, t.effect.potency || 1);
    }
  }
  // and so can Descent boons
  for (const e of descentBoonEffects()) add(e.id, e.chance, e.potency);
  for (const id in S.talents) {
    const rank = S.talents[id];
    if (!rank) continue;
    const t = talentById(id);
    if (!t || !t.effect) continue;
    add(t.effect.id, t.effect.chance * rank, t.effect.potency || 1);
  }

  const out = [];
  for (const id in merged) {
    merged[id].chance = Math.min(100, Math.round(merged[id].chance * 10) / 10);
    out.push(merged[id]);
  }

  /* Grouped by when they fire, then by how often. Without this the list came out
     in whatever order the equipment happened to sit in, which changes every time
     you swap a piece. */
  const order = { open: 0, hit: 1, crit: 2, hurt: 3, kill: 4 };
  out.sort((a, b) => {
    const da = EFFECTS[a.id], db = EFFECTS[b.id];
    const ta = order[da ? da.trigger : "hit"] ?? 9;
    const tb = order[db ? db.trigger : "hit"] ?? 9;
    if (ta !== tb) return ta - tb;
    if (b.chance !== a.chance) return b.chance - a.chance;
    return (da ? da.name : a.id).localeCompare(db ? db.name : b.id);
  });
  return out;
}

/* Every modifier source except transient combat buffs. */
function collectPersistentMods() {
  const mods = emptyMods();

  // gear
  for (const slot of SLOTS) {
    const item = S.equipment[slot.key];
    if (!item) continue;
    addMods(mods, item.stats);
    if (item.enchant) {
      const e = ENCHANTS.find(x => x.id === item.enchant);
      if (e) addMods(mods, e.mods);
    }
  }

  // set bonuses
  for (const s of collectSets()) {
    for (const t of s.tiers) if (t.on && t.mods) addMods(mods, t.mods);
  }

  // boons chosen during a Descent
  addMods(mods, descentBoonMods());

  // passives that change the character sheet rather than the fight
  addMods(mods, passiveStatMods());

  // talents
  for (const id in S.talents) {
    const rank = S.talents[id];
    if (!rank) continue;
    const t = talentById(id);
    if (t) addMods(mods, t.mods, rank);
  }

  return mods;
}

/* How many points are invested in a given tree. */
function pointsInTree(treeId) {
  const tree = TALENT_TREES.find(t => t.id === treeId);
  if (!tree) return 0;
  let n = 0;
  for (const t of tree.talents) n += S.talents[t.id] || 0;
  return n;
}

function pointsSpent() {
  let n = 0;
  for (const id in S.talents) n += S.talents[id];
  return n;
}

function pointsAvailable() {
  return totalTalentPoints(S.level) - pointsSpent();
}

/* Spells the character currently has access to. */
function unlockedSpells() {
  const out = [];
  for (const tree of TALENT_TREES) {
    const pts = pointsInTree(tree.id);
    for (const sp of SPELLS) {
      if (sp.tree === tree.id && pts >= sp.req) out.push(sp);
    }
  }
  // honour the player's chosen cast order, then append anything new
  const ordered = [];
  for (const id of S.spellOrder) {
    const sp = out.find(s => s.id === id);
    if (sp) ordered.push(sp);
  }
  for (const sp of out) if (!ordered.includes(sp)) ordered.push(sp);
  return ordered;
}

/* ---------------------------------------------------------------------------
   The big one. `extraMods` is where combat passes in active buffs.
   --------------------------------------------------------------------------- */
function computeStats(extraMods) {
  const mods = collectPersistentMods();
  if (extraMods) addMods(mods, extraMods);

  const base = baseStats(S.level);
  const st = {};

  for (const p of PRIMARIES) {
    const flat = base[p] + (mods[p] || 0);
    st[p] = Math.round(flat * (1 + (mods[p + "Pct"] || 0) / 100));
  }
  const staFlat = base.sta + (mods.sta || 0);
  st.sta = Math.round(staFlat * (1 + (mods.staPct || 0) / 100));

  // pools
  st.maxHp = Math.round((140 + st.sta * 11 + S.level * 26) * (1 + (mods.hpPct || 0) / 100));
  st.maxMana = Math.round((110 + st.int * 3.4 + st.spi * 2.6 + S.level * 9) * (1 + (mods.manaPct || 0) / 100));

  /* Regeneration is a share of the pool per second rather than a flat trickle,
     for the same reason spell costs are: a flat number is meaningless once the
     pool is large. MANA_REGEN_BASE is what a character with no Spirit recovers;
     Spirit roughly doubles it at the high end. Together with percentage-based
     spell costs this leaves a caster draining slowly through a long run and
     forced to rest, drink, or retreat. */
  const spiritShare = Math.min(MANA_REGEN_SPIRIT_CAP, st.spi / (st.spi + 900) * MANA_REGEN_SPIRIT_CAP * 2);
  /* Regen has two parts: a share of the pool (so a big caster pool refills at a
     sensible rate) and a flat floor scaled to level (so a martial build with a
     tiny pool is not left with a trickle). Without the floor, the builds that
     want mana least were the ones that ran dry, because their small pool made
     both their costs and their regen small. */
  const poolPart = st.maxMana * (MANA_REGEN_BASE + spiritShare);
  const floorPart = MANA_REGEN_FLOOR * (1 + S.level * 0.12);
  st.manaRegen = (poolPart + floorPart) * (1 + (mods.manaRegen || 0) / 100);

  // mitigation
  st.armor = Math.round(Math.max(0, (mods.armor || 0)) * (1 + (mods.armorPct || 0) / 100));
  st.dr = clamp(mods.dr || 0, 0, 60);
  st.dodge = clamp(3 + st.agi * 0.010 + (mods.dodge || 0), 0, 50);
  st.block = clamp(mods.block || 0, 0, 55);
  st.thorns = mods.thorns || 0;

  // offence
  st.crit = clamp(4 + st.agi * 0.012 + (mods.crit || 0), 0, 75);
  st.critMult = 1.75 + (mods.critDmg || 0) / 100;
  st.haste = mods.haste || 0;
  st.lifesteal = clamp(mods.lifesteal || 0, 0, 60);
  st.physDmg = mods.physDmg || 0;
  st.magicDmg = mods.magicDmg || 0;
  st.allDmg = mods.allDmg || 0;
  st.healPct = mods.healPct || 0;
  st.execDmg = mods.execDmg || 0;
  st.cdr = clamp(mods.cdr || 0, 0, 60);
  st.goldFind = mods.goldFind || 0;
  st.magicFind = mods.magicFind || 0;
  st.xpBonus = mods.xpBonus || 0;

  // weapon
  const mh = S.equipment.mainhand;
  const w = (mh && mh.weapon) ? mh.weapon : FIST;
  const scaleStat = (mh && mh.scalesWith) ? mh.scalesWith : FIST.scalesWith;
  st.weapon = { min: w.min, max: w.max, speed: w.speed, scalesWith: scaleStat };
  // speed-normalised so a slow weapon hits harder per swing, not per second
  st.apPerSwing = st[scaleStat] * 0.62 * (w.speed / NORM_SPEED);
  st.swingMin = w.min + st.apPerSwing;
  st.swingMax = w.max + st.apPerSwing;
  st.swingTime = w.speed / (1 + st.haste / 100);
  st.dps = ((st.swingMin + st.swingMax) / 2) / st.swingTime;

  /* Normalised swing damage: what this weapon would hit for if it swung at the
     reference speed. Spells that scale off "weapon damage" fire on a fixed
     cooldown, so if they used raw swing damage a slow weapon would make every
     spell hit proportionally harder for free — a 3.5s weapon was landing 2.2x
     the spell damage of a 1.6s weapon of identical dps, which quietly made fast
     weapons a trap and punished Rogues for using daggers. Spells therefore scale
     with weapon DPS, not weapon speed. */
  st.normMin = w.min * (NORM_SPEED / w.speed) + st[scaleStat] * 0.62;
  st.normMax = w.max * (NORM_SPEED / w.speed) + st[scaleStat] * 0.62;

  st.mods = mods;
  st.effects = collectEffects();
  st.passives = collectPassives();
  st.sets = collectSets();
  return st;
}

/* Damage after armour. Mirrors the classic diminishing-returns curve. */
function armorReduction(armor, attackerLevel) {
  const k = armor / (armor + 420 + 52 * attackerLevel);
  return clamp(k, 0, 0.75);
}

/* A single number for "is this item better than that item". Rough on purpose:
   it exists to sort the inventory, not to make decisions for you. */
function itemScore(item) {
  if (!item) return 0;
  let s = 0;
  const st = item.stats || {};
  s += (st.str || 0) + (st.agi || 0) + (st.int || 0) + (st.spi || 0);
  s += (st.sta || 0) * 0.9;
  s += (st.armor || 0) * 0.09;
  s += (st.crit || 0) * 9 + (st.haste || 0) * 9 + (st.dodge || 0) * 8 + (st.block || 0) * 7;
  s += (st.critDmg || 0) * 4 + (st.lifesteal || 0) * 14 + (st.thorns || 0) * 6;
  if (item.weapon) s += ((item.weapon.min + item.weapon.max) / 2) / item.weapon.speed * 6;
  return Math.round(s);
}

function levelUpIfReady() {
  let leveled = false;
  while (S.level < MAX_LEVEL && S.xp >= xpToNext(S.level)) {
    S.xp -= xpToNext(S.level);
    S.level++;
    leveled = true;
  }
  if (S.level >= MAX_LEVEL) S.xp = Math.min(S.xp, xpToNext(MAX_LEVEL));
  return leveled;
}


/* ======== js/core/loot.js ======== */
/* ===========================================================================
   LOOT — generating items, rolling drops, salvaging.
   ---------------------------------------------------------------------------
   Generated gear gets a stat budget from its item level and rarity, then
   spends it: roughly half on the primary stat, a quarter on Stamina, the rest
   on secondaries. Armour slots get flat armour on top, scaled by whether the
   piece is plate (Strength), leather (Agility) or cloth (Intellect).

   The name is assembled from the item's own properties, so it always makes
   sense: an Agility weapon is a Dagger "of the Viper", never a Warhammer.
   =========================================================================== */

/* Armour weight by slot, then by archetype. */
const ARMOR_SLOT_WEIGHT = {
  chest: 1.0, legs: 0.86, helm: 0.76, shoulders: 0.66,
  boots: 0.62, gloves: 0.56, waist: 0.56, wrist: 0.42, cape: 0.34,
};
const ARMOR_CLASS_MULT = { str: 1.45, agi: 1.0, int: 0.62 };

/* Which secondaries suit which archetype, so rolls feel intentional. */
const SECONDARY_AFFINITY = {
  str: { crit: 1.0, haste: 0.9, block: 1.3, critDmg: 1.1, thorns: 1.0, lifesteal: 0.8, dodge: 0.5 },
  agi: { crit: 1.5, haste: 1.4, dodge: 1.3, critDmg: 1.2, lifesteal: 0.9, block: 0.2, thorns: 0.3 },
  int: { crit: 1.4, haste: 1.4, critDmg: 1.1, lifesteal: 0.7, dodge: 0.7, block: 0.2, thorns: 0.4 },
};

/* ---------------------------------------------------------------------------
   POWER CURVES
   Gear is the main source of power, so its curve is what the whole game is
   balanced against. Both of these are super-linear: an item level 50 piece is
   far more than five times an item level 10 piece, which is what makes a new
   tier of gear feel like an event rather than a small percentage.
   Enemy Health in combat.js is fitted to these two curves — change one and you
   must re-check the other.
   --------------------------------------------------------------------------- */
/* A two-hander gives up the entire off-hand slot, so it has to be worth roughly
   a weapon plus a shield. These two constants are what buy that back. */
const TWO_HAND_DPS_BONUS = 1.55;
const TWO_HAND_STAT_BONUS = 1.45;

/* Special properties, and the aspects drawn from them, only start dropping on
   gear at this item level and above. */
const ASPECT_MIN_ILVL = 40;

function itemBudget(ilvl) { return 6 + 0.72 * Math.pow(ilvl, 1.38); }
function weaponDps(ilvl) { return 4 + 1.53 * Math.pow(ilvl, 1.38); }
function armorBase(ilvl) { return 8 + 1.60 * Math.pow(ilvl, 1.30); }

function tierForIlvl(ilvl) {
  if (ilvl <= 13) return 1;
  if (ilvl <= 24) return 2;
  if (ilvl <= 34) return 3;
  if (ilvl <= 43) return 4;
  return 5;
}

/* ---------------------------------------------------------------------------
   generateItem — the workhorse.
   opts: { ilvl, rarity, slot, primary }  (any may be omitted and rolled)
   --------------------------------------------------------------------------- */
function generateItem(opts) {
  const o = opts || {};
  const ilvl = Math.max(1, Math.round(o.ilvl || 1));
  const rarity = o.rarity || rollRarity(0);
  const slot = o.slot || pick(SLOT_TYPES);
  const primary = o.primary || pick(["str", "agi", "int"]);
  const R = RARITIES[rarity];
  const tier = tierForIlvl(ilvl);

  const budget = itemBudget(ilvl) * R.budget;
  const stats = {};

  // --- primary stat: about 46% of budget, with a little variance
  const primShare = rand(0.40, 0.52);
  stats[primary] = Math.max(1, Math.round(budget * primShare / 1.0));

  // --- Spirit riders on Intellect gear, so healing builds have something to wear
  if (primary === "int" && Math.random() < 0.45) {
    stats.spi = Math.max(1, Math.round(budget * rand(0.10, 0.18)));
  }

  // --- stamina: about 26%
  stats.sta = Math.max(1, Math.round(budget * rand(0.20, 0.30)));

  // --- secondaries fill what is left
  let remaining = budget * rand(0.20, 0.30);
  const affinity = SECONDARY_AFFINITY[primary];
  const picks = [];
  const pool = SECONDARY_POOL.slice();
  const nSecondary = Math.min(R.stats, 3);
  for (let i = 0; i < nSecondary && pool.length; i++) {
    const weights = {};
    pool.forEach((p, idx) => { weights[idx] = (affinity[p.key] || 0.5); });
    const idx = parseInt(weightedPick(weights), 10);
    picks.push(pool[idx]);
    pool.splice(idx, 1);
  }
  for (const sec of picks) {
    const chunk = remaining / picks.length;
    const val = chunk / sec.cost;
    if (val < 0.1) continue;
    const rounded = sec.key === "critDmg" || sec.key === "thorns"
      ? Math.round(val) : Math.round(val * 10) / 10;
    if (rounded > 0) stats[sec.key] = (stats[sec.key] || 0) + rounded;
  }

  // --- armour on armour slots
  if (ARMOR_SLOTS.includes(slot)) {
    const w = ARMOR_SLOT_WEIGHT[slot] || 0.5;
    stats.armor = Math.round(armorBase(ilvl) * w * (ARMOR_CLASS_MULT[primary] || 1) * (0.9 + R.budget * 0.25));
  }

  // --- base type and, for weapons, damage
  const baseList = (ITEM_BASES[slot] && ITEM_BASES[slot][primary]) || ["Relic"];
  const baseName = pick(baseList);
  const item = {
    uid: uid(),
    name: "",
    base: baseName,
    slot, rarity, ilvl, primary, tier,
    stats,
    enchant: null,
  };

  if (slot === "mainhand") {
    const prof = WEAPON_PROFILES[baseName] || DEFAULT_WEAPON_PROFILE;
    const twoHand = prof.hands === 2;
    const dps = weaponDps(ilvl) * R.budget * (twoHand ? TWO_HAND_DPS_BONUS : 1);
    const avg = dps * prof.speed;
    item.weapon = {
      min: Math.max(1, Math.round(avg * (1 - prof.spread))),
      max: Math.max(2, Math.round(avg * (1 + prof.spread))),
      speed: prof.speed,
    };
    item.scalesWith = primary;
    if (twoHand) {
      item.hands = 2;
      // a two-hander also carries the stat budget the lost off-hand would have held
      for (const k of ["str", "agi", "int", "spi", "sta"]) {
        if (item.stats[k]) item.stats[k] = Math.round(item.stats[k] * TWO_HAND_STAT_BONUS);
      }
    }
  }

  // Epics and Legendaries carry a special property. This is what makes a
  // Legendary feel different rather than simply larger. Procs (and therefore the
  // aspects extracted from them) only begin appearing on late-game gear, so the
  // aspect system is something the endgame opens up rather than a level-1 chore.
  const procTier = PROC_TIERS[rarity];
  if (procTier && ilvl >= ASPECT_MIN_ILVL) {
    const pool = PROC_POOL[primary] || PROC_POOL.str;
    item.proc = {
      id: pick(pool),
      chance: Math.round(rand(procTier.chance[0], procTier.chance[1])),
      potency: Math.round(rand(procTier.potency[0], procTier.potency[1]) * 100) / 100,
    };
  }
  if (slot === "offhand" && primary === "str") {
    stats.block = (stats.block || 0) + Math.round((2 + ilvl * 0.09) * 10) / 10;
    stats.armor = Math.round(armorBase(ilvl) * 1.15 * (0.9 + R.budget * 0.3));
  }

  item.name = nameItem(item);
  item.value = itemGoldValue(item);
  return item;
}

/* Assembles Prefix + Base + Suffix from the item's own properties. */
function nameItem(item) {
  const prefixes = PREFIXES[item.tier] || PREFIXES[1];
  const prefix = pick(prefixes);

  // suffix comes from the highest-magnitude stat that has a suffix list
  let bestKey = item.primary, bestVal = -1;
  for (const k of ["str", "agi", "int", "spi", "sta"]) {
    const v = item.stats[k] || 0;
    if (v > bestVal) { bestVal = v; bestKey = k; }
  }
  const suffix = pick(SUFFIXES[bestKey] || SUFFIXES.str);
  return `${prefix} ${item.base} ${suffix}`;
}

function itemGoldValue(item) {
  const R = RARITIES[item.rarity];
  return Math.max(1, Math.round((4 + Math.pow(item.ilvl, 1.45) * 1.1) * R.budget * R.budget));
}

/* Build a real item from a boss's handcrafted drop definition. */
function makeUnique(def) {
  const item = {
    uid: uid(),
    name: def.name,
    base: def.name,
    slot: def.slot,
    rarity: def.rarity,
    ilvl: def.ilvl,
    primary: def.stats.int ? "int" : (def.stats.agi ? "agi" : "str"),
    tier: tierForIlvl(def.ilvl),
    stats: Object.assign({}, def.stats),
    enchant: null,
    unique: def.id,
  };
  if (def.weapon) {
    item.weapon = Object.assign({}, def.weapon);
    item.scalesWith = def.scalesWith || item.primary;
    if (def.hands === 2) item.hands = 2;
  }
  if (def.proc) item.proc = Object.assign({}, def.proc);
  item.value = itemGoldValue(item) * 3;
  return item;
}

/* Turns a hand-written Unique definition into a real item. */
function makeUnique2(def) {
  const primary = def.stats.int ? "int" : (def.stats.agi ? "agi" : "str");
  const item = {
    uid: uid(),
    name: def.name,
    base: def.name,
    slot: def.slot,
    rarity: "unique",
    ilvl: def.ilvl,
    primary,
    tier: tierForIlvl(def.ilvl),
    stats: Object.assign({}, def.stats),
    enchant: null,
    uniqueId: def.id,
    flavour: def.flavour,
    passive: { id: def.passive.id, name: def.passive.name, text: def.passive.text },
  };
  if (def.weapon) {
    item.weapon = Object.assign({}, def.weapon);
    item.scalesWith = def.scalesWith || primary;
    if (def.hands === 2) item.hands = 2;
  }
  item.value = Math.round(itemGoldValue(item) * 5);
  return item;
}

/* Whichever primary stat the character is actually built around, judged by what
   they are wearing. Used so a set piece never arrives carrying the wrong stat. */
function dominantPrimary() {
  const totals = { str: 0, agi: 0, int: 0 };
  for (const slot of SLOTS) {
    const it = S.equipment[slot.key];
    if (!it || !it.stats) continue;
    for (const k in totals) totals[k] += it.stats[k] || 0;
  }
  const mh = S.equipment.mainhand;
  if (mh && mh.scalesWith && totals[mh.scalesWith] !== undefined) totals[mh.scalesWith] += 60;
  let best = "str";
  for (const k in totals) if (totals[k] > totals[best]) best = k;
  return best;
}

/* A set piece. Built through the ordinary generator so its stats sit on the same
   curve as everything else, then stamped with the set identity.

   The primary stat follows the CHARACTER, not the set. A set that hardcoded its
   own stat handed Intellect gear to a Strength build, which in a classless game
   makes half the endgame sets unwearable through no fault of the player. The set
   bonuses are already written to be school-agnostic; this makes the raw stats
   agree with them. */
function makeSetPiece(def) {
  const item = generateItem({
    ilvl: def.ilvl,
    rarity: SET_RARITY,
    slot: def.slot,
    primary: dominantPrimary(),
  });
  item.name = def.name;
  item.base = def.name;
  item.setId = def.setId;
  item.setIndex = def.index;
  /* Set pieces keep the proc their rarity earns them. Stripping it — which an
     earlier pass did, reasoning that the set bonus was the special property —
     meant a five-piece set traded away five Legendary procs for three set
     bonuses and came out behind. The set bonus is meant to be on top. */
  item.value = Math.round(item.value * 1.5);
  return item;
}

/* Rarity roll. `bonus` is magic find as a percentage; it shifts weight upward. */
function rollRarity(bonus) {
  const b = 1 + (bonus || 0) / 100;
  const weights = {};
  for (const key of RARITY_ORDER) {
    const r = RARITIES[key];
    const upshift = key === "common" ? 1 / b : (key === "uncommon" ? 1 : Math.pow(b, 1.6));
    weights[key] = r.weight * upshift;
  }
  return weightedPick(weights);
}

/* ---------------------------------------------------------------------------
   rollRealmLoot — everything a single realm kill can give you.
   `lootMod` is 1 for a normal mob, higher for elites.
   --------------------------------------------------------------------------- */
function rollRealmLoot(realm, enemyLevel, lootMod, magicFind) {
  const t = TIER_MATS[realm.tier];
  const out = { materials: {}, items: [], gold: 0 };
  const mod = lootMod || 1;

  // materials — most kills give something
  const matRolls = [
    { id: t.metal, chance: 0.42, qty: [1, 3] },
    { id: t.hide, chance: 0.38, qty: [1, 3] },
    { id: t.wood, chance: 0.30, qty: [1, 2] },
    { id: t.herb, chance: 0.34, qty: [1, 3] },
    { id: t.essence, chance: 0.055, qty: [1, 1] },
  ];
  for (const roll of matRolls) {
    if (Math.random() < roll.chance * mod) {
      const q = Math.max(1, Math.round(randInt(roll.qty[0], roll.qty[1]) * mod));
      out.materials[roll.id] = (out.materials[roll.id] || 0) + q;
    }
  }

  // Finished gear. There is no auction house and no trading, so this is the only
  // way slots get filled other than crafting — it has to be generous enough that
  // fifteen slots fill up in a reasonable number of kills.
  const gearChance = 0.17 * mod * (1 + (magicFind || 0) / 100);
  if (Math.random() < gearChance) {
    out.items.push(generateItem({
      ilvl: Math.max(1, enemyLevel + randInt(-2, 2)),
      rarity: rollRarity((magicFind || 0) + (mod - 1) * 40),
    }));
  }

  return out;
}

/* Boss drops: roll every entry in the table independently. */
function rollBossLoot(boss, magicFind) {
  const out = { items: [], gold: 0 };
  const mf = 1 + (magicFind || 0) / 100;
  for (const def of boss.drops) {
    if (Math.random() < def.chance * mf) out.items.push(makeUnique(def));
  }
  // and the Unique this boss guards, if it has one
  for (const uq of uniquesForBoss(boss.id)) {
    if (Math.random() < uq.chance * mf) out.items.push(makeUnique2(uq));
  }
  // each boss in a raid guards one piece of that raid's set, in order
  const setDef = setPieceForBoss(boss.id);
  if (setDef && Math.random() < SET_DROP_CHANCE * mf) out.items.push(makeSetPiece(setDef));
  // bosses also always cough up a piece of ordinary gear
  out.items.push(generateItem({
    ilvl: boss.lvl + randInt(0, 2),
    rarity: rollRarity(35 + (magicFind || 0)),
  }));
  return out;
}

/* ---------------------------------------------------------------------------
   Salvage — gear back into materials, potions back into herbs.
   --------------------------------------------------------------------------- */
function salvageReturns(item) {
  const R = RARITIES[item.rarity];
  const t = TIER_MATS[item.tier] || TIER_MATS[1];
  const out = {};
  const base = R.salvage;

  if (["mainhand", "offhand", "ring", "trinket"].includes(item.slot) || item.primary === "str") {
    out[t.metal] = Math.max(1, Math.round(base * rand(0.7, 1.3)));
  }
  if (item.primary === "agi" || item.primary === "int") {
    out[t.hide] = Math.max(1, Math.round(base * rand(0.7, 1.3)));
  }
  if (item.slot === "mainhand" || item.slot === "offhand") {
    out[t.wood] = Math.max(1, Math.round(base * 0.6));
  }
  if (item.rarity === "rare" || item.rarity === "epic" || item.rarity === "legendary") {
    out[t.essence] = Math.max(1, Math.round(base * 0.25));
  }
  // arcane dust is the enchanting currency and only comes from here
  const dustChance = { common: 0.15, uncommon: 0.4, rare: 1, epic: 1, legendary: 1 }[item.rarity];
  if (Math.random() < dustChance) {
    out.m_dust = Math.max(1, Math.round(base * 0.5 * rand(0.8, 1.4)));
  }
  return out;
}

function potionSalvageReturns(potion) {
  const t = TIER_MATS[potion.tier] || TIER_MATS[1];
  return { [t.herb]: 1 };
}


/* ======== js/core/combat.js ======== */
/* ===========================================================================
   COMBAT — the tick-based fight simulation.
   ---------------------------------------------------------------------------
   Fights resolve on a fixed 0.1s game-time step. The main loop feeds real
   elapsed time in, multiplied by the speed setting, so 4x speed is genuinely
   four times the fight, not a faster animation.

   There is no death penalty. Losing simply ends the fight, restores you, and
   (if auto-grind is on) starts the next one.
   =========================================================================== */

const TICK = 0.1;
const ELITE_CHANCE = 0.08;

/* Realm depth. Each kill in an unbroken run adds this much to the inhabitants'
   health and damage, and this much to what they carry. The user-facing promise
   is simple: the deeper you go the worse it gets and the better it pays. */
const DEPTH_POWER_PER_KILL = 0.05;
const DEPTH_XP_PER_KILL = 0.035;
const DEPTH_GOLD_PER_KILL = 0.05;
const DEPTH_FIND_PER_KILL = 4;     // percentage points of magic find per depth
/* Boss escalation. Every kill makes that boss permanently tougher, so farming a
   unique eventually forces you to go and get better gear elsewhere.

   Health and damage are separate on purpose. Applied at the same rate they
   compound badly — a tougher boss lives longer AND hits harder, so +40% on both
   is closer to double difficulty, and a boss you had comfortably beaten became
   impossible after ten kills. Weighting health means the pressure arrives as a
   longer, grindier fight rather than a sudden wall.

   With these numbers a boss you can comfortably kill stays winnable for roughly
   forty kills, which is about what the drop tables assume for a full set, then
   falls away steadily. */
const ESCALATION_HP_PER_KILL = 0.008;
const ESCALATION_DMG_PER_KILL = 0.003;
const LOSS_XP_SHARE = 0.08;
const LOG_LIMIT = 90;
/* Spells share a global cooldown, so a full spellbook cannot be dumped in one
   second. Haste shortens it, down to the floor. */
const GCD_BASE = 1.5;
const GCD_FLOOR = 0.75;
/* Ramping damage talents cap here so a long fight cannot spiral. */
const RAMP_MAX_STACKS = 12;
/* Mana returned per kill, as a fraction of the pool. Build-agnostic sustain. */
const MANA_ON_KILL = 0.12;

/* Role archetypes. Everything a realm enemy is comes from here plus its level.
   `dmg` is a DAMAGE PER SECOND multiplier, not per swing. The engine multiplies
   it by the role's swing interval, so a slow Brute and a fast Stalker with the
   same number are equally dangerous overall — the Brute just does it in fewer,
   bigger hits. Casters are tuned lower because magic ignores armour entirely. */
const ROLES = {
  swarm:   { hp: 0.55, dmg: 0.85, armor: 0.5, speed: 0.62, xp: 0.7,  label: "Swarm" },
  grunt:   { hp: 1.00, dmg: 1.00, armor: 1.0, speed: 1.00, xp: 1.0,  label: "Grunt" },
  brute:   { hp: 1.70, dmg: 1.20, armor: 0.9, speed: 1.35, xp: 1.45, label: "Brute" },
  stalker: { hp: 0.78, dmg: 1.15, armor: 0.7, speed: 0.70, xp: 1.05, label: "Stalker" },
  caster:  { hp: 0.82, dmg: 0.62, armor: 0.5, speed: 1.05, xp: 1.15, label: "Caster" },
  warden:  { hp: 1.45, dmg: 0.80, armor: 2.2, speed: 1.10, xp: 1.30, label: "Warden" },
};

/* Enemy scaling is fitted against the gear curves in loot.js. The exponents
   deliberately match itemBudget()/weaponDps() so a character in level-
   appropriate gear kills a level-appropriate mob in roughly ten seconds at
   every point in the game. Raise ENEMY_HP_K to make everything tankier. */
const ENEMY_HP_K = 26;
const ENEMY_DMG_K = 4.90;

/* ---------------------------------------------------------------------------
   LEVEL DIFFERENCE
   Gear supplies well over 90% of a character's raw power, so without this a
   level 30 character wearing level 50 gear would clear the entire game — twenty
   levels are otherwise worth about 1% damage. Each level of difference shifts
   damage in both directions, which is what stops you rushing deep on borrowed
   gear and gives levelling a reason to exist.

   At 5 levels above you that is -20% dealt and +20% taken: a real push, still
   survivable. At 17 above it is close to hopeless, which is the point.
   --------------------------------------------------------------------------- */
/* How much a magic-damage attacker is scaled down to account for armour doing
   nothing against it. Mirrors ROLES.caster.dmg. */
const MAGIC_SCHOOL_COMP = 0.62;

const LEVEL_GAP_PER = 0.04;
const LEVEL_GAP_CAP = 0.70;

function levelGapFactor(playerLvl, enemyLvl) {
  return clamp((enemyLvl - playerLvl) * LEVEL_GAP_PER, -LEVEL_GAP_CAP, LEVEL_GAP_CAP);
}

function enemyBaseHp(lvl) { return 70 + ENEMY_HP_K * Math.pow(lvl, 1.62); }
function enemyBaseDmg(lvl) { return 8 + ENEMY_DMG_K * Math.pow(lvl, 1.42); }
function enemyBaseArmor(lvl) { return 30 + 5.0 * Math.pow(lvl, 1.30); }
function enemyXp(lvl) { return 15 + lvl * 7.6; }
function enemyGold(lvl) { return 4 + lvl * 2.3; }

/* --------------------------------------------------------------------------
   Building an opponent
   -------------------------------------------------------------------------- */
function makeRealmEnemy(realm, depth) {
  const def = pick(realm.enemies);
  const role = ROLES[def.r] || ROLES.grunt;
  const lvl = realm.lvl;

  /* Depth. Every kill without leaving or dying makes the next one harder and
     richer. This is what turns a realm from a flat grind into a run you push
     until it becomes unwise. */
  const d = depth || 0;
  const depthPower = 1 + d * DEPTH_POWER_PER_KILL;

  const isElite = Math.random() < ELITE_CHANCE;
  const eliteBonus = isElite ? rand(0.03, 0.15) : 0;
  // loot modifier per spec: twice the power increase, plus or minus 20%
  const lootMod = isElite ? 1 + (eliteBonus * 2) * rand(0.8, 1.2) : 1;

  const hp = enemyBaseHp(lvl) * role.hp * (1 + eliteBonus) * depthPower;
  const speed = 2.4 * role.speed;
  const dmg = enemyBaseDmg(lvl) * role.dmg * role.speed * (1 + eliteBonus) * depthPower;

  return {
    name: isElite ? def.n : def.n,
    rawName: def.n,
    role: def.r, roleLabel: role.label,
    level: lvl,
    elite: isElite, eliteBonus, lootMod,
    maxHp: Math.round(hp), hp: Math.round(hp),
    dmgMin: dmg * 0.85, dmgMax: dmg * 1.15,
    armor: enemyBaseArmor(lvl) * role.armor,
    speed,
    swingTimer: speed * 0.6,
    school: def.r === "caster" ? "magic" : "phys",
    xp: Math.round(enemyXp(lvl) * role.xp * (1 + eliteBonus) * (1 + d * DEPTH_XP_PER_KILL)),
    gold: Math.round(enemyGold(lvl) * role.xp * (1 + eliteBonus * 1.5) * (1 + d * DEPTH_GOLD_PER_KILL)),
    dots: [],
    isBoss: false,
    depth: d,
  };
}

function makeBossEnemy(boss) {
  const kills = S.bossKills[boss.id] || 0;
  const escHp = 1 + kills * ESCALATION_HP_PER_KILL;
  const escDmg = 1 + kills * ESCALATION_DMG_PER_KILL;
  const role = ROLES[boss.r] || ROLES.grunt;
  const lvl = boss.lvl;

  const hp = enemyBaseHp(lvl) * boss.hpMult * escHp;
  const speed = 2.4 * role.speed;
  // Magic ignores armour completely, so a caster boss carrying the same multiplier
  // as a brute lands roughly twice the damage. Realm casters already get this
  // through ROLES.caster.dmg; bosses use their own multiplier, so apply it here
  // rather than hiding a mysteriously small number in every caster's data entry.
  const schoolComp = boss.r === "caster" ? MAGIC_SCHOOL_COMP : 1;
  const dmg = enemyBaseDmg(lvl) * boss.dmgMult * role.speed * schoolComp * escDmg;

  return {
    name: boss.title ? `${boss.name}, ${boss.title}` : boss.name,
    rawName: boss.name,
    role: boss.r, roleLabel: "Boss",
    level: lvl,
    elite: false, eliteBonus: 0, lootMod: 1,
    maxHp: Math.round(hp), hp: Math.round(hp),
    dmgMin: dmg * 0.88, dmgMax: dmg * 1.12,
    armor: enemyBaseArmor(lvl) * role.armor * 1.3,
    speed,
    swingTimer: speed * 0.6,
    school: boss.r === "caster" ? "magic" : "phys",
    xp: Math.round(enemyXp(lvl) * 9),
    gold: Math.round(enemyGold(lvl) * 12),
    dots: [],
    isBoss: true, bossId: boss.id, escalation: escHp, escalationDmg: escDmg, kills,
  };
}

/* --------------------------------------------------------------------------
   The Combat singleton
   -------------------------------------------------------------------------- */
const Combat = {
  active: false,
  mode: null,          // "realm" | "boss"
  realm: null,
  boss: null,
  enemy: null,
  player: null,
  stats: null,
  log: [],
  logSeq: 0,
  effectDepth: 0,
  rampStacks: 0,
  passiveState: {},
  accumulator: 0,
  fightTime: 0,
  lastResult: null,
  onUpdate: null,      // set by the UI

  /* ---- lifecycle ---- */
  start(mode, target) {
    this.mode = mode;

    if (mode === "descent") {
      this.realm = null; this.boss = null;
      this.enemy = makeDescentEnemy();
    } else if (mode === "realm") {
      // walking into a different realm abandons whatever run was in progress
      if (S.run.realmId !== target.id) beginRun(target.id);
      this.realm = target; this.boss = null;
      this.enemy = makeRealmEnemy(target, S.run.depth);
    } else {
      // a raid is a prepared encounter, so you arrive whole
      beginRun(null);
      this.boss = target; this.realm = null;
      this.enemy = makeBossEnemy(target);
    }

    this.player = {
      hp: 0, mana: 0,
      swingTimer: 0.4,
      cds: {},
      buffs: [],
      hots: [],
      shield: null,
      potionCd: 0,
      gcd: 0,
    };
    this.refreshStats();
    // health and mana carry across fights within a run; null means untouched
    this.player.hp = S.vitals.hp === null ? this.stats.maxHp : clamp(S.vitals.hp, 1, this.stats.maxHp);
    this.player.mana = S.vitals.mana === null ? this.stats.maxMana : clamp(S.vitals.mana, 0, this.stats.maxMana);

    this.applyOpeningPotions();
    this.fightTime = 0;
    this.accumulator = 0;
    this.active = true;
    this.effectDepth = 0;
    this.rampStacks = 0;
    this.passiveState = {};
    this.lastResult = null;
    this.enemy.baseSpeed = this.enemy.speed;

    const tag = this.enemy.elite
      ? ` <span class="elite-tag">Elite +${Math.round(this.enemy.eliteBonus * 100)}%</span>` : "";
    const depthTag = (this.enemy.depth)
      ? ` <span class="depth-tag">depth ${this.enemy.depth}</span>` : "";
    this.pushLog(`— ${this.enemy.name}${tag}${depthTag} —`, "header");
    this.passiveNotify("fightStart");
    this.fireEffects("open", {});
  },

  stop() {
    this.active = false;
    this.enemy = null;
  },

  refreshStats() {
    const extra = {};
    for (const b of this.player.buffs) addMods(extra, b.mods);
    for (const b of S.potionBuffs) addMods(extra, b.mods);
    this.stats = computeStats(extra);
    if (this.player.hp > this.stats.maxHp) this.player.hp = this.stats.maxHp;
    if (this.player.mana > this.stats.maxMana) this.player.mana = this.stats.maxMana;
  },

  /* logSeq only ever increases. The UI used to redraw when log.length changed,
     which stopped working the moment the log hit its cap and length froze at
     LOG_LIMIT forever — the chronicle appeared to update only when something
     died. Comparing a counter instead fixes that permanently. */
  pushLog(text, cls) {
    this.log.push({ t: text, c: cls || "" });
    this.logSeq++;
    if (this.log.length > LOG_LIMIT) this.log.shift();
  },

  /* ---- the step ---- */
  advance(realSeconds) {
    if (!this.active) return;
    const speed = S.settings.speed || 1;
    this.accumulator += realSeconds * speed;
    let guard = 0;
    while (this.accumulator >= TICK && this.active && guard < 4000) {
      this.accumulator -= TICK;
      this.step();
      guard++;
    }
  },

  step() {
    const p = this.player, e = this.enemy, st = this.stats;
    this.fightTime += TICK;

    // passives that run every step, such as the queued damage from Even Keel
    this.passiveNotify("tick");
    if (!this.active) return;

    // mana regen
    p.mana = Math.min(st.maxMana, p.mana + st.manaRegen * TICK);

    // buffs and shields tick down
    let buffsChanged = false;
    for (let i = p.buffs.length - 1; i >= 0; i--) {
      p.buffs[i].remaining -= TICK;
      if (p.buffs[i].remaining <= 0) { p.buffs.splice(i, 1); buffsChanged = true; }
    }
    // draughts burn only while fighting, so browsing your bags never wastes one
    for (let i = S.potionBuffs.length - 1; i >= 0; i--) {
      S.potionBuffs[i].remaining -= TICK;
      if (S.potionBuffs[i].remaining <= 0) { S.potionBuffs.splice(i, 1); buffsChanged = true; }
    }
    if (buffsChanged) this.refreshStats();
    if (p.shield) {
      p.shield.remaining -= TICK;
      if (p.shield.remaining <= 0 || p.shield.amount <= 0) p.shield = null;
    }

    // healing over time
    for (let i = p.hots.length - 1; i >= 0; i--) {
      const h = p.hots[i];
      h.timer -= TICK;
      if (h.timer <= 0) {
        h.timer += h.interval;
        this.healPlayer(h.perTick, h.name);
        h.ticksLeft--;
        if (h.ticksLeft <= 0) p.hots.splice(i, 1);
      }
    }

    // damage over time on the enemy
    for (let i = e.dots.length - 1; i >= 0; i--) {
      const d = e.dots[i];
      d.timer -= TICK;
      if (d.timer <= 0) {
        d.timer += d.interval;
        this.damageEnemy(d.perTick, d.name, false, d.school);
        d.ticksLeft--;
        if (d.ticksLeft <= 0) e.dots.splice(i, 1);
        if (!this.active) return;
      }
    }

    // global cooldown, then individual spell cooldowns
    if (p.gcd > 0) p.gcd -= TICK;
    for (const id in p.cds) {
      p.cds[id] -= TICK;
      if (p.cds[id] <= 0) delete p.cds[id];
    }

    // auto potion
    if (p.potionCd > 0) p.potionCd -= TICK;
    this.maybeDrinkPotion();

    // auto cast
    this.autoCast();
    if (!this.active) return;

    // player swing
    p.swingTimer -= TICK;
    if (p.swingTimer <= 0) {
      p.swingTimer += st.swingTime;
      this.playerAutoAttack();
      if (!this.active) return;
    }

    // a slow wears off
    if (e.slowUntil && this.fightTime >= e.slowUntil) {
      e.speed = e.baseSpeed; e.slowUntil = 0;
    }

    // enemy swing
    e.swingTimer -= TICK;
    if (e.swingTimer <= 0) {
      e.swingTimer += e.speed;
      this.enemyAttack();
    }
  },

  /* ---- unique passives ----
     Chained transforms: each passive receives what the previous one returned,
     so two of them stack predictably instead of fighting over the same number. */
  passiveTransform(hook, value, ctx) {
    const ps = this.stats.passives;
    if (!ps || !ps.length) return value;
    let v = value;
    for (const p of ps) {
      if (p.def[hook]) v = p.def[hook](this, v, ctx);
    }
    return v;
  },

  passiveNotify(hook) {
    const ps = this.stats.passives;
    if (!ps || !ps.length) return false;
    let any = false;
    for (const p of ps) {
      if (p.def[hook] && p.def[hook](this)) any = true;
    }
    return any;
  },

  /* ---- effects ----
     Fires every proc matching a trigger. `ctx` carries whatever the action needs:
     dmg for the ones that scale off the blow that caused them. Guarded against
     recursion so an extra swing that procs another extra swing cannot loop. */
  fireEffects(trigger, ctx) {
    const st = this.stats;
    if (!st.effects || !st.effects.length) return;
    if (this.effectDepth > 2) return;
    this.effectDepth++;
    for (const inst of st.effects) {
      const def = EFFECTS[inst.id];
      if (!def || def.trigger !== trigger) continue;
      if (def.hpBelow && this.player.hp / st.maxHp > def.hpBelow) continue;
      if (def.chance !== undefined || inst.chance !== undefined) {
        if (Math.random() * 100 >= (inst.chance || 0)) continue;
      }
      this.applyEffect(def, inst, ctx || {});
      if (!this.active) break;
    }
    this.effectDepth--;
  },

  applyEffect(def, inst, ctx) {
    const st = this.stats, p = this.player, e = this.enemy;
    const pot = inst.potency || 1;

    if (def.action === "dot") {
      const total = rand(st.normMin, st.normMax) * def.coef * pot;
      e.dots = e.dots.filter(d => d.id !== "proc_" + inst.id);
      e.dots.push({
        id: "proc_" + inst.id, name: def.name, school: def.school,
        perTick: total / def.ticks, interval: def.duration / def.ticks,
        timer: def.duration / def.ticks, ticksLeft: def.ticks,
      });
      this.pushLog(`${def.name} takes hold.`, "proc");
      Sound.play("proc", 150);

    } else if (def.action === "strike") {
      const dmg = rand(st.normMin, st.normMax) * def.coef * pot;
      this.damageEnemy(dmg, def.name, false, def.school || "phys");

    } else if (def.action === "heal") {
      const amount = def.coef * pot * (ctx.dmg || rand(st.normMin, st.normMax) * 0.5);
      this.healPlayer(amount, def.name);

    } else if (def.action === "buff") {
      const mods = {};
      for (const k in def.mods) mods[k] = def.mods[k] * pot;
      p.buffs = p.buffs.filter(b => b.id !== "proc_" + inst.id);
      p.buffs.push({ id: "proc_" + inst.id, name: def.name, mods, remaining: def.duration });
      this.refreshStats();
      this.pushLog(`${def.name} flares.`, "proc");

    } else if (def.action === "swing") {
      this.pushLog(`${def.name}!`, "proc");
      this.playerAutoAttack(true);

    } else if (def.action === "slow") {
      e.speed = e.baseSpeed * (1 + def.amount * pot);
      e.slowUntil = this.fightTime + def.duration;
      this.pushLog(`${def.name} slows ${e.rawName}.`, "proc");

    } else if (def.action === "mana") {
      const gain = st.maxMana * def.amount * pot;
      p.mana = Math.min(st.maxMana, p.mana + gain);
    }
  },

  /* ---- offence ---- */
  playerAutoAttack(isExtra) {
    const st = this.stats;
    let dmg = rand(st.swingMin, st.swingMax);
    dmg *= 1 + (st.physDmg + st.allDmg) / 100;
    const crit = Math.random() * 100 < st.crit;
    if (crit) dmg *= st.critMult;
    this.rampStacks++;
    this.damageEnemy(dmg, isExtra ? "Extra strike" : "Attack", crit, "phys");
    if (!this.active) return;
    // Second Wind / Adrenaline: mana back on a landed hit
    if (st.mods.manaOnHit) this.player.mana = Math.min(st.maxMana, this.player.mana + st.maxMana * st.mods.manaOnHit / 100);
    this.fireEffects("hit", { dmg });
    if (crit) this.fireEffects("crit", { dmg });
  },

  /* Bonuses that depend on the state of the fight rather than the character
     sheet, so they cannot live in computeStats. */
  situationalMultiplier() {
    const st = this.stats, p = this.player;
    let m = 1;
    const hpFrac = p.hp / st.maxHp;
    if (st.mods.lowHpDmg && hpFrac < 0.35) m *= 1 + st.mods.lowHpDmg / 100;
    if (st.mods.highHpDmg && hpFrac > 0.70) m *= 1 + st.mods.highHpDmg / 100;
    if (st.mods.rampDmg) {
      const stacks = Math.min(this.rampStacks, RAMP_MAX_STACKS);
      m *= 1 + (st.mods.rampDmg * stacks) / 100;
    }
    return m;
  },

  damageEnemy(raw, source, crit, school) {
    const e = this.enemy, st = this.stats;
    let dmg = raw;

    // execute bonus
    if (st.execDmg && e.hp / e.maxHp < 0.30) dmg *= 1 + st.execDmg / 100;

    // situational talents: cornered, steadfast, ramping momentum
    dmg *= this.situationalMultiplier();

    // unique passives may rewrite the blow entirely
    dmg = this.passiveTransform("damageDealt", dmg, { source: source === "Attack" ? "auto" : "spell", crit });
    if (dmg <= 0) {
      this.pushLog(`${source} fails to connect.`, "miss");
      return;
    }

    // fighting above your level hurts your output
    dmg *= 1 - levelGapFactor(S.level, e.level);

    // armour only mitigates physical
    if (school !== "magic") dmg *= 1 - armorReduction(e.armor, S.level);

    dmg = Math.max(1, Math.round(dmg));
    e.hp -= dmg;

    if (st.lifesteal > 0) this.healPlayer(dmg * st.lifesteal / 100, null, true);

    this.pushLog(
      `${source} hits ${e.rawName} for <b>${fmt(dmg)}</b>${crit ? " <span class='crit'>crit</span>" : ""}`,
      crit ? "dmg crit-line" : "dmg"
    );
    Sound.play(crit ? "crit" : "hit", 90);

    if (e.hp <= 0) {
      e.hp = 0;
      this.fireEffects("kill", {});
      this.win();
    }
  },

  enemyAttack() {
    const st = this.stats, p = this.player, e = this.enemy;

    if (Math.random() * 100 < st.dodge) {
      this.pushLog(`You dodge ${e.rawName}.`, "miss");
      return;
    }

    let dmg = rand(e.dmgMin, e.dmgMax);
    dmg *= 1 + levelGapFactor(S.level, e.level);
    let blocked = false;
    if (Math.random() * 100 < st.block) { dmg *= 0.55; blocked = true; }
    if (e.school !== "magic") dmg *= 1 - armorReduction(st.armor, e.level);
    dmg *= 1 - st.dr / 100;
    dmg = Math.max(1, Math.round(dmg));

    // shields soak first
    if (p.shield && p.shield.amount > 0) {
      const soak = Math.min(p.shield.amount, dmg);
      p.shield.amount -= soak;
      dmg -= soak;
      if (soak > 0) this.pushLog(`${p.shield.name} absorbs ${fmt(soak)}.`, "shield");
      if (p.shield.amount <= 0) p.shield = null;
    }

    if (dmg > 0) {
      const raw = dmg;
      // Unique passives get the blow before your health does. One of them may
      // return 0 and pay it out over the following second instead.
      const applied = this.passiveTransform("damageTaken", dmg, { blocked });

      if (applied > 0) {
        this.applyRawDamage(applied, `${e.rawName} hits you for <b>${fmt(Math.round(applied))}</b>${blocked ? " (blocked)" : ""}`);
      } else {
        this.pushLog(`${e.rawName} strikes for ${fmt(raw)}, spread thin.`, "taken");
      }
      if (!this.active) return;

      if (st.thorns > 0) {
        const reflect = Math.max(1, Math.round(raw * st.thorns / 100));
        e.hp -= reflect;
        if (e.hp <= 0) { e.hp = 0; this.fireEffects("kill", {}); this.win(); return; }
      }
      this.fireEffects("hurt", { dmg: raw });
    }
  },

  /* The single place health is actually removed, so every route — a normal hit,
     a queued slice from Even Keel, anything added later — gets the same death
     check and the same chance for a passive to refuse it. */
  applyRawDamage(amount, logLine) {
    const p = this.player;
    const dmg = Math.max(0, amount);
    if (dmg <= 0) return;
    p.hp -= dmg;
    if (logLine) { this.pushLog(logLine, "taken"); Sound.play("hurt", 140); }

    if (p.hp <= 0) {
      if (this.passiveNotify("wouldDie")) return;
      p.hp = 0;
      this.lose();
    }
  },

  healPlayer(amount, source, silent) {
    const st = this.stats, p = this.player;
    let heal = amount * (1 + st.healPct / 100);
    heal = this.passiveTransform("healTaken", heal);
    heal = Math.min(heal, st.maxHp - p.hp);
    if (heal <= 0) return;
    p.hp += heal;
    if (!silent) this.pushLog(`${source || "Heal"} restores <b>${fmt(heal)}</b>.`, "heal");
  },

  /* ---- spells ---- */
  autoCast() {
    const p = this.player, st = this.stats;
    if (p.gcd > 0) return;
    const spells = unlockedSpells();
    for (const sp of spells) {
      if (p.cds[sp.id]) continue;
      if (p.mana < this.spellCost(sp)) continue;
      if (!this.conditionMet(sp)) continue;
      // sensible default: do not waste heals or shields at full health
      if (!S.spellConditions[sp.id]
          && (sp.type === "heal" || sp.type === "hot" || sp.type === "shield")
          && p.hp > st.maxHp * 0.90) continue;
      if (sp.type === "buff" && p.buffs.some(b => b.id === sp.id)) continue;
      this.cast(sp);
      return;   // one cast per tick keeps the log readable
    }
  },

  /* A spell with no condition set fires whenever it can. Setting one replaces
     the built-in default entirely, including the "do not waste heals" rule, so
     what you configure is exactly what happens. */
  conditionMet(sp) {
    const c = S.spellConditions[sp.id];
    if (!c || c.type === "always") return true;
    const st = this.stats, p = this.player, e = this.enemy;
    const v = c.value;

    switch (c.type) {
      case "enemyBelow":  return (e.hp / e.maxHp) * 100 < v;
      case "enemyAbove":  return (e.hp / e.maxHp) * 100 > v;
      case "selfBelow":   return (p.hp / st.maxHp) * 100 < v;
      case "selfAbove":   return (p.hp / st.maxHp) * 100 > v;
      case "manaAbove":   return (p.mana / st.maxMana) * 100 > v;
      case "opener":      return this.fightTime <= v;
      case "afterSecs":   return this.fightTime >= v;
      case "bossOnly":    return !!e.isBoss;
      case "eliteOrBoss": return !!e.isBoss || !!e.elite;
      default:            return true;
    }
  },

  cast(sp) {
    const p = this.player, st = this.stats, e = this.enemy;
    p.mana -= this.spellCost(sp);
    p.cds[sp.id] = this.passiveTransform("cooldown", sp.cd * (1 - st.cdr / 100));
    p.gcd = Math.max(GCD_FLOOR, GCD_BASE / (1 + st.haste / 100));
    Sound.play("spell", 120);

    const power = this.spellPower(sp);

    if (sp.type === "damage") {
      let dmg = power;
      if (sp.execBonus && e.hp / e.maxHp < 0.30) dmg *= sp.execBonus;
      dmg *= 1 + ((sp.school === "magic" ? st.magicDmg : st.physDmg) + st.allDmg) / 100;
      const crit = Math.random() * 100 < st.crit;
      if (crit) dmg *= st.critMult;
      this.damageEnemy(dmg, sp.name, crit, sp.school);
      if (sp.buff) this.applyBuff(sp);

    } else if (sp.type === "dot") {
      const total = power * (1 + ((sp.school === "magic" ? st.magicDmg : st.physDmg) + st.allDmg) / 100);
      e.dots = e.dots.filter(d => d.id !== sp.id);
      e.dots.push({
        id: sp.id, name: sp.name, school: sp.school,
        perTick: total / sp.ticks, interval: sp.duration / sp.ticks,
        timer: sp.duration / sp.ticks, ticksLeft: sp.ticks,
      });
      this.pushLog(`${sp.name} takes hold.`, "cast");

    } else if (sp.type === "heal") {
      this.healPlayer(power, sp.name);
      if (sp.buff) this.applyBuff(sp);

    } else if (sp.type === "hot") {
      p.hots = p.hots.filter(h => h.id !== sp.id);
      p.hots.push({
        id: sp.id, name: sp.name,
        perTick: power / sp.ticks, interval: sp.duration / sp.ticks,
        timer: sp.duration / sp.ticks, ticksLeft: sp.ticks,
      });
      this.pushLog(`${sp.name} begins mending.`, "cast");

    } else if (sp.type === "shield") {
      p.shield = { name: sp.name, amount: power, remaining: sp.duration };
      this.pushLog(`${sp.name} absorbs up to ${fmt(power)}.`, "shield");

    } else if (sp.type === "buff") {
      this.applyBuff(sp);
    }
  },

  /* Percentage of the pool, after any passive that alters it. */
  spellCost(sp) {
    const base = this.stats.maxMana * (sp.manaPct || 0) / 100;
    return this.passiveTransform("manaCost", base);
  },

  spellPower(sp) {
    const st = this.stats;
    if (sp.scale === "weapon") {
      // normalised, so weapon speed does not silently scale every spell
      return rand(st.normMin, st.normMax) * sp.coef;
    }
    if (!sp.scale) return 0;
    return st[sp.scale] * sp.coef;
  },

  applyBuff(sp) {
    const b = sp.buff;
    this.player.buffs = this.player.buffs.filter(x => x.id !== sp.id);
    this.player.buffs.push({ id: sp.id, name: sp.name, mods: b.mods, remaining: b.duration });
    this.refreshStats();
    this.pushLog(`${sp.name} takes effect.`, "cast");
  },

  /* ---- potions ---- */
  /* Draughts last 30 seconds and a fight lasts about six, so re-drinking at every
     engagement threw away most of every potion. Now one is only opened when its
     effect is not already running. */
  applyOpeningPotions() {
    for (const id of S.settings.buffPotions || []) {
      const po = potionById(id);
      if (!po || po.kind !== "buff") continue;
      if (S.potionBuffs.some(b => b.id === po.id)) continue;   // already active
      if (!takePotion(id, 1)) continue;
      S.potionBuffs.push({ id: po.id, name: po.name, mods: po.mods, remaining: po.duration });
      this.pushLog(`${po.name} consumed.`, "potion");
    }
    this.refreshStats();
  },

  maybeDrinkPotion() {
    if (!S.settings.autoPotion) return;
    const p = this.player, st = this.stats;
    if (p.potionCd > 0) return;
    const pctHp = p.hp / st.maxHp * 100;
    if (pctHp >= (S.settings.potionThreshold || 40)) return;

    let po = null;
    if (S.settings.healPotion && (S.potions[S.settings.healPotion] || 0) > 0) {
      po = potionById(S.settings.healPotion);
    } else {
      // fall back to the strongest health potion in the bag
      const owned = POTIONS.filter(x => x.kind === "heal" && (S.potions[x.id] || 0) > 0);
      owned.sort((a, b) => b.pct - a.pct);
      po = owned[0] || null;
    }
    if (!po) return;
    if (!takePotion(po.id, 1)) return;
    p.potionCd = 8;
    Sound.play("potion", 200);
    this.healPlayer(st.maxHp * po.pct / 100, po.name);
  },

  /* ---- resolution ---- */
  win() {
    this.active = false;
    const e = this.enemy;
    const st = this.stats;

    const xpGain = Math.round(e.xp * (1 + st.xpBonus / 100));
    const goldGain = Math.round(e.gold * (1 + st.goldFind / 100) * (e.lootMod || 1));
    // deeper runs find better things
    const depthFind = (e.depth || 0) * DEPTH_FIND_PER_KILL;

    S.xp += xpGain;
    S.gold += goldGain;
    S.tally.goldEarned += goldGain;

    const result = {
      won: true, name: e.name, xp: xpGain, gold: goldGain,
      items: [], materials: {}, leveled: false, unlocked: [],
      elite: e.elite, eliteBonus: e.eliteBonus,
    };

    S.killStreak = (S.killStreak || 0) + 1;
    // every kill returns a little mana, no matter how you fight. Short fights in
    // sequence mean this is the sustain a martial build actually leans on.
    this.player.mana = Math.min(st.maxMana, this.player.mana + st.maxMana * MANA_ON_KILL);
    this.passiveNotify("onKill");

    if (this.mode === "descent") {
      S.tally.kills++;
      const dropLvl = e.descentILvl || 52;
      const loot = rollRealmLoot(pick(REALMS), dropLvl, e.isWarden ? 3 : 1, st.magicFind + descentMagicFind());
      for (const id in loot.materials) addMaterial(id, loot.materials[id]);
      result.materials = loot.materials;
      for (const it of loot.items) { S.inventory.push(it); S.tally.items++; }
      result.items = loot.items;
      // a Warden also yields a proper boss table
      if (e.isWarden) {
        const all = [];
        for (const raid of RAIDS) for (const b of raid.bosses) all.push(b);
        const boss = all[Math.floor((S.descent.floor / DESCENT_WARDEN_EVERY - 1) % all.length)];
        const bl = rollBossLoot(boss, st.magicFind + descentMagicFind());
        for (const it of bl.items) { S.inventory.push(it); S.tally.items++; }
        result.items = result.items.concat(bl.items);
      }
      result.floor = S.descent.floor;
      result.boonReady = advanceDescent();
      result.descentBest = S.descent.best;

    } else if (this.mode === "realm") {
      S.tally.kills++;
      S.run.depth++;               // the realm closes in a little
      result.depth = S.run.depth;
      S.kills[this.realm.id] = (S.kills[this.realm.id] || 0) + 1;
      const key = this.realm.id + "::" + e.rawName;
      S.enemyKills[key] = (S.enemyKills[key] || 0) + 1;

      const loot = rollRealmLoot(this.realm, e.level, e.lootMod, st.magicFind + depthFind);
      for (const id in loot.materials) { addMaterial(id, loot.materials[id]); }
      result.materials = loot.materials;
      for (const it of loot.items) { S.inventory.push(it); S.tally.items++; }
      result.items = loot.items;

    } else {
      S.tally.bossKills++;
      const first = !(S.bossKills[this.boss.id] > 0);
      S.bossKills[this.boss.id] = (S.bossKills[this.boss.id] || 0) + 1;

      const loot = rollBossLoot(this.boss, st.magicFind);
      for (const it of loot.items) { S.inventory.push(it); S.tally.items++; }
      result.items = loot.items;

      if (first) result.unlocked = applyBossUnlocks(this.boss);
      result.escalation = this.boss ? (S.bossKills[this.boss.id] * ESCALATION_HP_PER_KILL * 100) : 0;
    }

    result.leveled = levelUpIfReady();
    result.autoCleared = runAutoSalvage();
    storeVitals(this);

    this.pushLog(`${e.rawName} falls. +${fmt(xpGain)} xp, +${fmt(goldGain)} gold.`, "win");
    Sound.play("victory", 200);
    for (const it of result.items) {
      this.pushLog(`Found <span class="r-${it.rarity}">${it.name}</span>`, "loot");
      Sound.play(it.rarity === "epic" || it.rarity === "legendary" ? "rare" : "loot", 120);
    }
    if (result.leveled) this.pushLog(`You reach level ${S.level}.`, "level");
    if (result.leveled) Sound.play("levelup", 0);
    for (const u of result.unlocked) this.pushLog(`Unlocked: ${u}`, "level");

    this.lastResult = result;
    saveGame();
    if (this.onUpdate) this.onUpdate("win", result);
  },

  lose() {
    this.active = false;
    S.tally.deaths++;
    S.killStreak = 0;
    const lostDepth = S.run.depth;
    let descentEnd = null;
    if (this.mode === "descent" && S.descent.active) descentEnd = endDescent("defeat");
    beginRun(null);              // the run is over; you wake up whole

    // There is no death penalty, and losing still teaches you something. Without
    // this a badly geared character in a realm it cannot beat would earn nothing
    // at all and could never climb back out.
    const consolation = Math.round(this.enemy.xp * LOSS_XP_SHARE);
    S.xp += consolation;
    const leveled = levelUpIfReady();

    const result = { won: false, name: this.enemy.name, xp: consolation, gold: 0,
                     items: [], materials: {}, unlocked: [], leveled, lostDepth, descentEnd };
    this.pushLog(`${this.enemy.rawName} defeats you. No penalty \u2014 you salvage ${fmt(consolation)} xp` +
      (descentEnd ? `. The Descent ends at floor ${descentEnd.floor}.`
        : lostDepth ? `, but the run ends at depth ${lostDepth}.` : "."), "lose");
    Sound.play("defeat", 0);
    if (leveled) this.pushLog(`You reach level ${S.level}.`, "level");
    this.lastResult = result;
    saveGame();
    if (this.onUpdate) this.onUpdate("lose", result);
  },
};

/* Marks whatever a boss opens as available. Returns readable names for the log. */
function applyBossUnlocks(boss) {
  const names = [];
  const u = boss.unlocks || {};
  if (u.raids) {
    for (const rid of u.raids) {
      if (!S.unlockedRaids.includes(rid)) {
        S.unlockedRaids.push(rid);
        const raid = raidById(rid);
        if (raid) names.push(raid.name + " (raid)");
      }
    }
  }
  if (u.realms) {
    for (const rid of u.realms) {
      const realm = realmById(rid);
      if (realm) names.push(realm.name);
    }
  }
  return names;
}

/* --------------------------------------------------------------------------
   Access checks
   -------------------------------------------------------------------------- */

/* However a realm is unlocked, you also have to be within striking distance of
   the things living in it. Boss gates alone are not enough: because gear supplies
   most of a character's power, a level 30 character could kill its way into a
   level 47 realm on borrowed gear, finish the entire game, and leave the last
   dozen levels with nothing in them. Realm levels step by at most 3, so an
   allowance of 4 can never strand you — there is always somewhere to grind. */
const REALM_LEVEL_ALLOWANCE = 4;

function realmLevelMet(realm) {
  return S.level >= realm.lvl - REALM_LEVEL_ALLOWANCE;
}

function realmUnlocked(realm) {
  if (!realmLevelMet(realm)) return false;
  const u = realm.unlock;
  if (u.type === "level") return S.level >= u.value;
  if (u.type === "boss") return (S.bossKills[u.value] || 0) > 0;
  return true;
}

function realmLockReason(realm) {
  const u = realm.unlock;
  if (u.type === "boss" && !((S.bossKills[u.value] || 0) > 0)) {
    const b = bossById(u.value);
    return b ? `Defeat ${b.name}` : "Locked";
  }
  if (u.type === "level" && S.level < u.value) return `Requires level ${u.value}`;
  if (!realmLevelMet(realm)) return `Requires level ${realm.lvl - REALM_LEVEL_ALLOWANCE}`;
  return "Locked";
}

function raidUnlocked(raid) {
  const u = raid.unlock;
  if (u.type === "level") return S.level >= u.value;
  if (u.type === "boss") return (S.bossKills[u.value] || 0) > 0;
  return true;
}

function raidLockReason(raid) {
  const u = raid.unlock;
  if (u.type === "level") return `Requires level ${u.value}`;
  if (u.type === "boss") {
    const b = bossById(u.value);
    return b ? `Defeat ${b.name}` : "Locked";
  }
  return "Locked";
}

/* A boss is available once every boss before it in the raid has died once, and
   once you are within reach of its level. The sequence alone does not pace the
   endgame: gear carries hard enough that Opus, a level 50 fight, was falling to
   level 38 characters and leaving the last dozen levels empty. */
function bossLevelMet(boss) {
  return S.level >= boss.lvl - REALM_LEVEL_ALLOWANCE;
}

function bossUnlocked(raid, index) {
  if (!raidUnlocked(raid)) return false;
  if (!bossLevelMet(raid.bosses[index])) return false;
  for (let i = 0; i < index; i++) {
    if (!(S.bossKills[raid.bosses[i].id] > 0)) return false;
  }
  return true;
}

function bossLockReason(raid, index) {
  const boss = raid.bosses[index];
  for (let i = 0; i < index; i++) {
    if (!(S.bossKills[raid.bosses[i].id] > 0)) return "Defeat the boss before it";
  }
  if (!bossLevelMet(boss)) return `Requires level ${boss.lvl - REALM_LEVEL_ALLOWANCE}`;
  return "Locked";
}

/* ---------------------------------------------------------------------------
   Run lifecycle. A run is an unbroken sequence of fights in one realm: health
   and mana carry between them and the inhabitants harden with every kill.
   Passing null starts you fresh and whole, which is what happens when you die,
   when you walk out, and when you step into a raid.
   --------------------------------------------------------------------------- */
function beginRun(realmId) {
  S.run.realmId = realmId;
  S.run.depth = 0;
  S.vitals.hp = null;
  S.vitals.mana = null;
}

function storeVitals(C) {
  S.vitals.hp = Math.max(1, Math.round(C.player.hp));
  S.vitals.mana = Math.max(0, Math.round(C.player.mana));
}

/* What the player currently has, for the interface to show outside a fight. */
function currentVitals() {
  const st = computeStats();
  return {
    hp: S.vitals.hp === null ? st.maxHp : clamp(S.vitals.hp, 0, st.maxHp),
    mana: S.vitals.mana === null ? st.maxMana : clamp(S.vitals.mana, 0, st.maxMana),
    maxHp: st.maxHp,
    maxMana: st.maxMana,
  };
}

/* Walking away. Costs the run, restores the character. */
function retreatFromRun() {
  const depth = S.run.depth;
  beginRun(null);
  saveGame();
  return depth;
}


/* ======== js/core/actions.js ======== */
/* ===========================================================================
   ACTIONS — everything the player can do outside of a fight.
   Each function returns { ok, msg } so the UI can report success or refusal
   without knowing any rules itself.
   =========================================================================== */

const BS_RECIPES = buildBlacksmithRecipes();

/* Which equipment slots an item can go into. */
function slotsForItem(item) {
  if (item.slot === "ring") return ["ring1", "ring2"];
  if (item.slot === "trinket") return ["trinket1", "trinket2"];
  return [item.slot];
}

function isTwoHanded(item) { return !!(item && item.hands === 2); }

function equipItem(uidStr, preferredSlot) {
  const idx = S.inventory.findIndex(i => i.uid === uidStr);
  if (idx < 0) return { ok: false, msg: "That item is gone." };
  const item = S.inventory[idx];

  // two of the same Unique would stack a passive with itself, which none of them
  // are written to survive
  if (item.uniqueId) {
    for (const slot of SLOTS) {
      const worn = S.equipment[slot.key];
      if (worn && worn.uniqueId === item.uniqueId) {
        return { ok: false, msg: `You are already wearing ${item.name}.` };
      }
    }
  }

  // an off-hand cannot be worn alongside a two-hander
  if (item.slot === "offhand" && isTwoHanded(S.equipment.mainhand)) {
    return { ok: false, msg: `${S.equipment.mainhand.name} needs both hands.` };
  }

  const targets = slotsForItem(item);
  let slot = preferredSlot && targets.includes(preferredSlot) ? preferredSlot : null;
  if (!slot) slot = targets.find(s => !S.equipment[s]) || targets[0];

  const current = S.equipment[slot];
  S.inventory.splice(idx, 1);
  S.equipment[slot] = item;
  if (current) S.inventory.push(current);

  // putting on a two-hander frees whatever was in the off-hand
  let note = "";
  if (slot === "mainhand" && isTwoHanded(item) && S.equipment.offhand) {
    S.inventory.push(S.equipment.offhand);
    note = ` ${S.equipment.offhand.name} was unequipped.`;
    S.equipment.offhand = null;
  }

  saveGame();
  return { ok: true, msg: `Equipped ${item.name}.${note}` };
}

function unequipItem(slotKey) {
  const item = S.equipment[slotKey];
  if (!item) return { ok: false, msg: "Nothing there." };
  S.equipment[slotKey] = null;
  S.inventory.push(item);
  saveGame();
  return { ok: true, msg: `Removed ${item.name}.` };
}

function sellItem(uidStr) {
  const idx = S.inventory.findIndex(i => i.uid === uidStr);
  if (idx < 0) return { ok: false, msg: "That item is gone." };
  const item = S.inventory[idx];
  S.inventory.splice(idx, 1);
  S.gold += item.value;
  S.tally.goldEarned += item.value;
  saveGame();
  return { ok: true, msg: `Sold ${item.name} for ${fmt(item.value)} gold.` };
}

/* An item's special property, in a form that can live in the aspect collection
   and later be stamped onto another item. Returns null if it has nothing to give.
   A Unique's passive is deliberately NOT extractable — those are meant to be the
   item, not a portable part. */
function extractAspect(item) {
  if (item.proc) {
    const def = EFFECTS[item.proc.id];
    return { kind: "proc", id: item.proc.id, chance: item.proc.chance, potency: item.proc.potency || 1,
             name: def ? def.name : item.proc.id, slot: item.slot };
  }
  return null;
}

function aspectLabel(a) {
  if (a.kind === "proc") return describeEffect({ id: a.id, chance: a.chance, potency: a.potency });
  return a.name;
}
function aspectShort(a) { return a.name; }

/* Salvaging pulls the aspect out before the item is destroyed, filing it under
   the slot it belongs to. */
function storeAspectFrom(item) {
  const a = extractAspect(item);
  if (!a) return null;
  if (!S.aspects[a.slot]) S.aspects[a.slot] = [];
  S.aspects[a.slot].push(a);
  return a;
}

function salvageItem(uidStr) {
  const idx = S.inventory.findIndex(i => i.uid === uidStr);
  if (idx < 0) return { ok: false, msg: "That item is gone." };
  const item = S.inventory[idx];
  const ret = salvageReturns(item);
  const aspect = storeAspectFrom(item);   // draw out its special property first
  S.inventory.splice(idx, 1);
  const parts = [];
  for (const id in ret) { addMaterial(id, ret[id]); parts.push(`${ret[id]} ${MATERIALS[id].name}`); }
  saveGame();
  const matMsg = parts.join(", ") || "nothing usable";
  return { ok: true, aspect, returns: ret,
    msg: aspect ? `Salvaged ${item.name}: ${matMsg}, and drew out its ${aspect.name} aspect.`
                : `Salvaged ${item.name}: ${matMsg}.` };
}

/* Bulk actions on the inventory, filtered by rarity. */
function sellAllOfRarity(rarities) {
  let gold = 0, n = 0;
  S.inventory = S.inventory.filter(item => {
    if (item.uniqueId || item.setId) return true;
    if (rarities.includes(item.rarity)) { gold += item.value; n++; return false; }
    return true;
  });
  S.gold += gold;
  S.tally.goldEarned += gold;
  saveGame();
  return { ok: true, msg: n ? `Sold ${n} items for ${fmt(gold)} gold.` : "Nothing matched." };
}

function salvageAllOfRarity(rarities) {
  const totals = {};
  let n = 0;
  S.inventory = S.inventory.filter(item => {
    if (item.uniqueId || item.setId) return true;
    if (!rarities.includes(item.rarity)) return true;
    const ret = salvageReturns(item);
    for (const id in ret) { addMaterial(id, ret[id]); totals[id] = (totals[id] || 0) + ret[id]; }
    n++;
    return false;
  });
  saveGame();
  const parts = Object.keys(totals).map(id => `${totals[id]} ${MATERIALS[id].name}`);
  return { ok: true, msg: n ? `Salvaged ${n} items: ${parts.join(", ")}.` : "Nothing matched." };
}

function salvagePotion(potionId, qty) {
  const po = potionById(potionId);
  if (!po) return { ok: false, msg: "Unknown potion." };
  const have = S.potions[potionId] || 0;
  const take = Math.min(have, qty || 1);
  if (!take) return { ok: false, msg: "None in stock." };
  takePotion(potionId, take);
  const ret = potionSalvageReturns(po);
  const parts = [];
  for (const id in ret) { addMaterial(id, ret[id] * take); parts.push(`${ret[id] * take} ${MATERIALS[id].name}`); }
  saveGame();
  return { ok: true, msg: `Broke down ${take} x ${po.name}: ${parts.join(", ")}.` };
}

/* Runs after every won fight. Keeps the inventory from filling with vendor
   trash without ever touching anything the player might actually want. */
const AUTO_SALVAGE_SETS = {
  off: [],
  common: ["common"],
  uncommon: ["common", "uncommon"],
};

function runAutoSalvage() {
  const set = AUTO_SALVAGE_SETS[S.settings.autoSalvage] || [];
  if (!set.length) return null;

  const sell = S.settings.autoSalvageMode === "sell";
  let n = 0, gold = 0;
  const mats = {};

  S.inventory = S.inventory.filter(item => {
    if (item.uniqueId || item.setId) return true;   // never sweep a Unique or a set piece
    if (!set.includes(item.rarity)) return true;
    n++;
    if (sell) {
      gold += item.value;
    } else {
      const ret = salvageReturns(item);
      for (const id in ret) { addMaterial(id, ret[id]); mats[id] = (mats[id] || 0) + ret[id]; }
      storeAspectFrom(item);
    }
    return false;
  });

  if (!n) return null;
  if (sell) { S.gold += gold; S.tally.goldEarned += gold; }
  return { n, gold, mats, sell };
}

/* Stamp a stored aspect onto an item. The aspect must have come from the same
   slot, and it REPLACES whatever special property the item currently has rather
   than adding to it — this is a tool for shaping a build, not inflating one. The
   item's original property, if it had one, is remembered so it can be restored. */
function applyAspect(uidStr, aspectIndex) {
  const item = S.inventory.find(i => i.uid === uidStr) || wornByUid(uidStr);
  if (!item) return { ok: false, msg: "That item is gone." };
  if (item.uniqueId) return { ok: false, msg: "A Unique cannot be reshaped." };

  const pool = S.aspects[item.slot] || [];
  const a = pool[aspectIndex];
  if (!a) return { ok: false, msg: "That aspect is no longer available." };

  // remember what was here so removing the aspect can put it back
  if (!item.baseProc && item.proc) item.baseProc = item.proc;
  item.proc = { id: a.id, chance: a.chance, potency: a.potency };
  item.aspect = { id: a.id, chance: a.chance, potency: a.potency, name: a.name };

  pool.splice(aspectIndex, 1);          // an aspect is consumed when applied
  saveGame();
  return { ok: true, msg: `Etched ${a.name} onto ${item.name}.` };
}

/* Remove an applied aspect. The aspect is returned to your collection and the
   item's original property, if any, comes back. */
function removeAspect(uidStr) {
  const item = S.inventory.find(i => i.uid === uidStr) || wornByUid(uidStr);
  if (!item || !item.aspect) return { ok: false, msg: "Nothing to remove." };

  if (!S.aspects[item.slot]) S.aspects[item.slot] = [];
  S.aspects[item.slot].push({ ...item.aspect, slot: item.slot });

  item.proc = item.baseProc || null;
  delete item.baseProc;
  delete item.aspect;
  saveGame();
  return { ok: true, msg: `Drew the aspect back out of ${item.name}.` };
}

function wornByUid(uid) {
  for (const slot of SLOTS) {
    const it = S.equipment[slot.key];
    if (it && it.uid === uid) return it;
  }
  return null;
}

/* Every item the player could stamp an aspect onto, worn or carried. */
function itemsForSlot(slot) {
  const out = [];
  for (const s of SLOTS) {
    const it = S.equipment[s.key];
    if (it && it.slot === slot) out.push({ item: it, worn: true });
  }
  for (const it of S.inventory) if (it.slot === slot) out.push({ item: it, worn: false });
  return out;
}

/* --------------------------------------------------------------------------
   Crafting
   -------------------------------------------------------------------------- */
function canCraft(recipe) {
  if (S.level < recipe.req) return { ok: false, msg: `Requires level ${recipe.req}` };
  if (S.gold < recipe.gold) return { ok: false, msg: "Not enough gold" };
  if (!hasMaterials(recipe.mats)) return { ok: false, msg: "Missing materials" };
  return { ok: true };
}

function craftBlacksmith(recipeId) {
  const r = BS_RECIPES.find(x => x.id === recipeId);
  if (!r) return { ok: false, msg: "Unknown recipe." };
  const chk = canCraft(r);
  if (!chk.ok) return { ok: false, msg: chk.msg + "." };

  S.gold -= r.gold;
  for (const id in r.mats) takeMaterial(id, r.mats[id]);

  const rarity = r.rarity || weightedPick(CRAFT_RARITY);
  const item = generateItem({ ilvl: r.ilvl, rarity, slot: r.slot, primary: r.primary });
  S.inventory.push(item);
  S.tally.items++;
  saveGame();
  return { ok: true, msg: `Forged ${item.name}.`, item };
}

function brewPotion(potionId, qty) {
  const po = potionById(potionId);
  if (!po) return { ok: false, msg: "Unknown recipe." };
  const n = Math.max(1, qty || 1);
  if (S.level < po.req) return { ok: false, msg: `Requires level ${po.req}.` };
  if (S.gold < po.gold * n) return { ok: false, msg: "Not enough gold." };
  for (const id in po.mats) {
    if ((S.materials[id] || 0) < po.mats[id] * n) return { ok: false, msg: "Missing herbs." };
  }
  S.gold -= po.gold * n;
  for (const id in po.mats) takeMaterial(id, po.mats[id] * n);
  addPotion(po.id, n);
  saveGame();
  return { ok: true, msg: `Brewed ${n} x ${po.name}.` };
}

/* --------------------------------------------------------------------------
   Enchanting
   -------------------------------------------------------------------------- */
function applyEnchant(slotKey, enchantId) {
  const item = S.equipment[slotKey];
  if (!item) return { ok: false, msg: "Nothing equipped in that slot." };
  const e = ENCHANTS.find(x => x.id === enchantId);
  if (!e) return { ok: false, msg: "Unknown enchant." };

  const slotType = item.slot;
  if (!e.slots.includes(slotType)) return { ok: false, msg: `${e.name} cannot go on that slot.` };
  if (S.gold < e.gold) return { ok: false, msg: "Not enough gold." };
  if ((S.materials.m_dust || 0) < e.dust) return { ok: false, msg: "Not enough Arcane Dust." };

  S.gold -= e.gold;
  takeMaterial("m_dust", e.dust);
  const replaced = item.enchant;
  item.enchant = e.id;
  saveGame();
  return { ok: true, msg: replaced ? `Replaced the old enchant with ${e.name}.` : `Applied ${e.name}.` };
}

function removeEnchant(slotKey) {
  const item = S.equipment[slotKey];
  if (!item || !item.enchant) return { ok: false, msg: "No enchant to remove." };
  item.enchant = null;
  saveGame();
  return { ok: true, msg: "Enchant scoured off." };
}

/* --------------------------------------------------------------------------
   Talents
   -------------------------------------------------------------------------- */
function tierUnlocked(treeId, tier) {
  return pointsInTree(treeId) >= (tier - 1) * 5;
}

function canSpendTalent(talentId) {
  const t = talentById(talentId);
  if (!t) return { ok: false, msg: "Unknown talent." };
  if (S.level < TALENT_START_LEVEL) return { ok: false, msg: `Talents unlock at level ${TALENT_START_LEVEL}.` };
  if (pointsAvailable() <= 0) return { ok: false, msg: "No points available." };
  const tree = treeOfTalent(talentId);
  if ((S.talents[talentId] || 0) >= t.max) return { ok: false, msg: "Already at maximum rank." };
  if (!tierUnlocked(tree.id, t.tier)) {
    return { ok: false, msg: `Requires ${(t.tier - 1) * 5} points in ${tree.name}.` };
  }
  return { ok: true };
}

function spendTalent(talentId) {
  const chk = canSpendTalent(talentId);
  if (!chk.ok) return chk;
  S.talents[talentId] = (S.talents[talentId] || 0) + 1;
  saveGame();
  return { ok: true };
}

/* Removing a point is blocked if it would strand a deeper tier. */
function refundTalent(talentId) {
  const cur = S.talents[talentId] || 0;
  if (!cur) return { ok: false, msg: "No points there." };
  const tree = treeOfTalent(talentId);
  const t = talentById(talentId);

  const after = pointsInTree(tree.id) - 1;
  for (const other of tree.talents) {
    if (other.id === talentId) continue;
    if ((S.talents[other.id] || 0) > 0 && after < (other.tier - 1) * 5) {
      return { ok: false, msg: `Remove points from ${other.name} first.` };
    }
  }
  if (after < (t.tier - 1) * 5 && cur - 1 > 0) {
    return { ok: false, msg: "That would break its own tier requirement." };
  }

  S.talents[talentId] = cur - 1;
  if (!S.talents[talentId]) delete S.talents[talentId];
  saveGame();
  return { ok: true };
}

function resetTalents() {
  S.talents = {};
  saveGame();
  return { ok: true, msg: "All talent points refunded." };
}


/* ======== js/core/merchant.js ======== */
/* ===========================================================================
   MERCHANT — the gold sink.
   ---------------------------------------------------------------------------
