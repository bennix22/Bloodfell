<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloodfell</title>
<!-- Single-file build. Everything is inlined. -->
<style>
/* ===========================================================================
   OPUS REALMS — stylesheet
   ---------------------------------------------------------------------------
   The look: an inked ledger, blood dried black in the margins. Deep bruise-purple
   rather than flat black, tarnished brass for anything valuable, old blood for
   anything dangerous. Nothing glows unless it is a legendary.

   Fonts are system stacks on purpose. The game runs from a local file with no
   internet, so a webfont would simply fail to load.
   =========================================================================== */

:root {
  --void:    #0e0a12;
  --pitch:   #171120;
  --slate:   #201830;
  --raise:   #2a2038;
  --edge:    #3a2b4e;
  --edge-hi: #55406f;

  --bone:    #cec4b6;
  --ash:     #8c8195;
  --dim:     #675d73;

  --brass:   #bd8c45;
  --brass-hi:#e0ad63;
  --blood:   #ac3c3c;
  --witch:   #7d6cb8;
  --verdant: #6d9c60;

  --r-common:    #8e8778;
  --r-uncommon:  #5f9b5b;
  --r-rare:      #4a7fb5;
  --r-epic:      #8a5fb0;
  --r-legendary: #c8873a;
  --r-unique:    #d2536b;


  --rail: 232px;
  --radius: 3px;

  /* Text scale. 1 is the design size; the Settings page drives this. */
  --fs: 1;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--void);
  color: var(--bone);
  font-family: var(--sans);
  font-size: calc(14px * var(--fs));
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(ellipse at 20% -10%, rgba(125, 108, 184, 0.10), transparent 55%),
    radial-gradient(ellipse at 90% 110%, rgba(172, 60, 60, 0.07), transparent 50%);
  background-attachment: fixed;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: 0.01em; }
a { color: var(--brass); }
button { font-family: inherit; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--edge-hi); }

:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------------------------------------------------------------- layout -- */
.app {
  display: grid;
  grid-template-columns: var(--rail) 1fr;
  min-height: 100vh;
}

.rail {
  background: linear-gradient(180deg, var(--pitch), var(--void));
  border-right: 1px solid var(--edge);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}

.brand {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--edge);
}
.brand h1 {
  font-size: calc(21px * var(--fs)); line-height: 1.1;
  color: var(--brass);
  letter-spacing: 0.06em;
}
.brand .sub {
  font-family: var(--mono);
  font-size: calc(9.5px * var(--fs)); letter-spacing: 0.22em;
  color: var(--dim); text-transform: uppercase; margin-top: 5px;
}

/* character card */
.charcard { padding: 14px 18px; border-bottom: 1px solid var(--edge); }
.charcard .lvl {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px;
}
.charcard .lvl b { font-family: var(--serif); font-size: calc(17px * var(--fs)); color: var(--bone); }
.charcard .lvl span { font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--ash); letter-spacing: 0.1em; }

.bar {
  height: 7px; background: #0b0810;
  border: 1px solid var(--edge); border-radius: 2px;
  overflow: hidden; margin-bottom: 6px; position: relative;
}
.bar > i { display: block; height: 100%; transition: width 0.18s linear; }
.bar.hp > i   { background: linear-gradient(90deg, #6d2020, var(--blood)); }
.bar.mana > i { background: linear-gradient(90deg, #453a75, var(--witch)); }
.bar.xp > i   { background: linear-gradient(90deg, #6b5326, var(--brass)); }
.barlabel {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); color: var(--dim);
  letter-spacing: 0.05em; margin-bottom: 2px;
}

.purse {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: calc(12px * var(--fs)); color: var(--brass-hi);
  margin-top: 10px;
}
.purse::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--brass); box-shadow: 0 0 6px rgba(189, 140, 69, 0.55);
}

/* nav */
.nav { padding: 10px 0; overflow-y: auto; flex: 1; }
.navgroup {
  font-family: var(--mono); font-size: calc(9px * var(--fs)); letter-spacing: 0.2em;
  color: var(--dim); text-transform: uppercase;
  padding: 14px 18px 6px;
}
.navbtn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: 0; border-left: 2px solid transparent;
  color: var(--ash); text-align: left;
  padding: 8px 18px; font-size: calc(13.5px * var(--fs)); cursor: pointer;
  transition: color 0.12s, background 0.12s, border-color 0.12s;
}
.navbtn:hover { color: var(--bone); background: rgba(255,255,255,0.025); }
.navbtn.on {
  color: var(--brass-hi); border-left-color: var(--brass);
  background: linear-gradient(90deg, rgba(189,140,69,0.12), transparent);
}
.navbtn .glyph { font-size: calc(14px * var(--fs)); width: 18px; text-align: center; opacity: 0.85; }
.navbtn .pip {
  margin-left: auto; font-family: var(--mono); font-size: calc(10px * var(--fs));
  background: var(--blood); color: #fff;
  border-radius: 8px; padding: 0 6px; min-width: 17px; text-align: center;
}

.railfoot {
  border-top: 1px solid var(--edge); padding: 10px 14px;
  display: flex; gap: 6px; flex-wrap: wrap;
}

/* ------------------------------------------------------------------ main -- */
.main { padding: 24px 28px 60px; max-width: 1180px; }

.phead { margin-bottom: 20px; }
.phead h2 { font-size: calc(25px * var(--fs)); color: var(--bone); }
.phead p { color: var(--ash); margin: 5px 0 0; max-width: 62ch; font-size: calc(13px * var(--fs)); }

.panel {
  background: var(--pitch);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.panel > h3 {
  font-size: calc(12px * var(--fs)); letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--brass); font-family: var(--mono); font-weight: 500;
  margin-bottom: 12px;
}

.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

/* --------------------------------------------------------------- buttons -- */
.btn {
  background: var(--raise); color: var(--bone);
  border: 1px solid var(--edge-hi); border-radius: var(--radius);
  padding: 7px 13px; font-size: calc(12.5px * var(--fs)); cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.btn:hover:not(:disabled) { background: var(--edge); border-color: var(--brass); color: #fff; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(180deg, #7c5a26, #5d4320);
  border-color: var(--brass); color: #f3e3c8; font-weight: 600;
}
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #96702f, #6d5026); }
.btn.danger { border-color: #6d2b2b; color: #d09090; }
.btn.danger:hover:not(:disabled) { background: #3b1d1d; border-color: var(--blood); color: #fff; }
.btn.sm { padding: 4px 9px; font-size: calc(11.5px * var(--fs)); }
.btn.wide { width: 100%; justify-content: center; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px solid var(--edge); }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--ash); padding: 8px 14px; font-size: calc(13px * var(--fs)); cursor: pointer;
}
.tab:hover { color: var(--bone); }
.tab.on { color: var(--brass-hi); border-bottom-color: var(--brass); }

/* ----------------------------------------------------------------- cards -- */
.card {
  background: var(--slate); border: 1px solid var(--edge);
  border-radius: var(--radius); padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color 0.14s, transform 0.14s;
}
.card:hover { border-color: var(--edge-hi); }
.card.locked { opacity: 0.5; }
.card.active { border-color: var(--brass); box-shadow: inset 0 0 0 1px rgba(189,140,69,0.25); }
.card h4 { font-size: calc(16px * var(--fs)); color: var(--bone); }
.card .meta {
  font-family: var(--mono); font-size: calc(10px * var(--fs)); letter-spacing: 0.08em;
  color: var(--dim); text-transform: uppercase;
}
.card .desc { font-size: calc(12.5px * var(--fs)); color: var(--ash); line-height: 1.45; flex: 1; }
.card .foot { display: flex; align-items: center; gap: 8px; }

.tag {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); letter-spacing: 0.08em;
  padding: 2px 7px; border-radius: 2px; text-transform: uppercase;
  border: 1px solid var(--edge-hi); color: var(--ash);
}
.tag.gold { border-color: var(--brass); color: var(--brass-hi); }
.tag.red { border-color: #6d2b2b; color: #cf8686; }
.tag.done { border-color: #3d5c36; color: var(--verdant); }

/* ---------------------------------------------------------------- combat -- */
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }

.fighter { background: var(--slate); border: 1px solid var(--edge); border-radius: var(--radius); padding: 14px; }
.fighter .who { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.fighter .who b { font-family: var(--serif); font-size: calc(16px * var(--fs)); }
.fighter .who .lv { font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim); }
.fighter .roleline { font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 9px; }
.fighter.enemy { border-color: #4a2b2b; }
.fighter .bar { height: 12px; }
.fighter .hpnum { font-family: var(--mono); font-size: calc(11px * var(--fs)); color: var(--ash); text-align: right; }

.elite-tag { color: var(--brass-hi); font-family: var(--mono); font-size: calc(10px * var(--fs)); letter-spacing: 0.1em; }

.buffrow { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; min-height: 20px; }
.buff {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); letter-spacing: 0.05em;
  border: 1px solid var(--edge-hi); border-radius: 2px; padding: 1px 6px; color: var(--witch);
}
.buff.dot { color: var(--blood); border-color: #5c2d2d; }
.buff.shield { color: var(--brass-hi); border-color: var(--brass); }

/* the chronicle — the one showy element */
.chronicle {
  background: linear-gradient(180deg, #120d19, var(--void));
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  height: 340px; overflow-y: auto;
  padding: 12px 14px 12px 20px;
  font-family: var(--mono); font-size: calc(11.5px * var(--fs)); line-height: 1.75;
  position: relative;
}
.chronicle::before {
  content: ""; position: absolute; left: 10px; top: 10px; bottom: 10px;
  width: 1px; background: linear-gradient(180deg, transparent, var(--edge) 12%, var(--edge) 88%, transparent);
}
.chronicle .line { color: var(--dim); }
.chronicle .line b { color: var(--bone); font-weight: 600; }
.chronicle .dmg b { color: var(--brass-hi); }
.chronicle .crit-line b { color: var(--brass-hi); }
.chronicle .crit { color: var(--blood); font-size: calc(10px * var(--fs)); letter-spacing: 0.1em; }
.chronicle .taken { color: #96707a; }
.chronicle .taken b { color: var(--blood); }
.chronicle .heal { color: var(--verdant); }
.chronicle .heal b { color: #92c283; }
.chronicle .shield { color: var(--brass); }
.chronicle .cast { color: var(--witch); }
.chronicle .miss { color: var(--dim); font-style: italic; }
.chronicle .potion { color: var(--verdant); }
.chronicle .win { color: var(--brass-hi); }
.chronicle .lose { color: var(--blood); }
.chronicle .loot { color: var(--bone); }
.chronicle .level { color: var(--brass-hi); font-weight: 600; }
.chronicle .header {
  color: var(--ash); border-top: 1px solid var(--edge);
  margin-top: 8px; padding-top: 8px; letter-spacing: 0.08em;
}
.chronicle .header:first-child { border: 0; margin-top: 0; padding-top: 0; }

.ctrlbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.switch { display: flex; align-items: center; gap: 7px; font-size: calc(12.5px * var(--fs)); color: var(--ash); cursor: pointer; }
.switch input { accent-color: var(--brass); width: 15px; height: 15px; cursor: pointer; }
.speedgrp { display: flex; border: 1px solid var(--edge-hi); border-radius: var(--radius); overflow: hidden; }
.speedgrp button {
  background: var(--raise); border: 0; color: var(--ash);
  padding: 5px 11px; font-family: var(--mono); font-size: calc(11px * var(--fs)); cursor: pointer;
}
.speedgrp button.on { background: var(--brass); color: #1a1208; font-weight: 700; }

/* ------------------------------------------------------------------ gear -- */
/* The paperdoll: armour down each side, character between, weapons beneath. */
.paperdoll-wrap {
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas: "left centre right" "bottom bottom bottom";
  gap: 14px;
  align-items: start;
}
.dollcol { display: flex; flex-direction: column; gap: 7px; }
.dollcol:first-child { grid-area: left; }
.dollcol:last-of-type { grid-area: right; }
.dollcentre { grid-area: centre; min-width: 0; }
.dollbottom {
  grid-area: bottom; display: flex; gap: 7px;
  justify-content: center; flex-wrap: wrap;
  padding-top: 12px; border-top: 1px solid var(--edge);
}

.dollslot {
  position: relative;
  display: flex; align-items: center; gap: 9px;
  background: var(--slate);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  padding: 6px 9px 6px 6px;
  width: 190px; min-height: 50px;
  transition: border-color 0.12s, background 0.12s;
}
.dollslot.filled { cursor: pointer; }
.dollslot.filled:hover { background: var(--raise); border-color: var(--edge-hi); }
.dollslot.picked { border-color: var(--brass); }

.dollicon {
  flex-shrink: 0;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--void);
  border: 1px solid var(--edge);
  border-radius: 2px;
  color: var(--dim);
}
.dollslot.filled .dollicon { border-color: currentColor; }
.slotsvg { width: 26px; height: 26px; }

.dolllabel {
  font-size: calc(11.5px * var(--fs)); line-height: 1.25;
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.dollslot.empty .dolllabel {
  color: var(--dim); font-family: var(--mono);
  font-size: calc(9.5px * var(--fs)); letter-spacing: 0.1em; text-transform: uppercase;
}
.dollilvl {
  position: absolute; right: 5px; bottom: 3px;
  font-family: var(--mono); font-size: calc(9px * var(--fs)); color: var(--dim);
}
.dollmark {
  position: absolute; right: 5px; top: 4px; font-size: calc(9px * var(--fs));
}
.dollmark.uq { color: var(--r-unique); }
.dollmark.pr { color: var(--witch); }

/* ---------------------------------------------------------------- rarity -- */
/* Three families, all driven by the same theme variables:
     .r-*         colours the item's NAME
     .b-*         tints the left edge of a list row
     .r-border-*  outlines an equipment square on the paperdoll
   Every one of these is emitted somewhere in js/ui/. There is a test that walks
   the markup and fails if any of them lacks a rule, because deleting one is
   silent — the class simply stops doing anything and every item goes white. */
.r-common    { color: var(--r-common); }
.r-uncommon  { color: var(--r-uncommon); }
.r-rare      { color: var(--r-rare); }
.r-epic      { color: var(--r-epic); }
.r-legendary { color: var(--r-legendary); text-shadow: 0 0 10px rgba(200,135,58,0.35); }
.r-unique    {
  color: var(--r-unique);
  text-shadow: 0 0 12px rgba(210,83,107,0.50);
  font-weight: 600;
}

.b-common    { border-left-color: var(--r-common) !important; }
.b-uncommon  { border-left-color: var(--r-uncommon) !important; }
.b-rare      { border-left-color: var(--r-rare) !important; }
.b-epic      { border-left-color: var(--r-epic) !important; }
.b-legendary { border-left-color: var(--r-legendary) !important; }
.b-unique    {
  border-left-color: var(--r-unique) !important;
  box-shadow: inset 0 0 24px rgba(210,83,107,0.09);
}

.r-border-common    { border-color: var(--r-common) !important; }
.r-border-uncommon  { border-color: var(--r-uncommon) !important; }
.r-border-rare      { border-color: var(--r-rare) !important; }
.r-border-epic      { border-color: var(--r-epic) !important; }
.r-border-legendary { border-color: var(--r-legendary) !important; }
.r-border-unique    {
  border-color: var(--r-unique) !important;
  box-shadow: inset 0 0 18px rgba(210,83,107,0.10);
}

.dollcentre {
  background: linear-gradient(180deg, var(--slate), var(--pitch));
  border: 1px solid var(--edge); border-radius: var(--radius);
  padding: 16px 18px; text-align: center;
}
.dollname { font-family: var(--serif); font-size: calc(20px * var(--fs)); color: var(--bone); }
.dolllvl {
  font-family: var(--mono); font-size: calc(10px * var(--fs)); letter-spacing: 0.16em;
  color: var(--brass); text-transform: uppercase; margin-top: 3px;
}
.dollbars { margin: 16px 0; text-align: left; }
.dollsummary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 3px 14px; text-align: left;
}
.dollsummary div {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: calc(11.5px * var(--fs)); padding: 3px 0;
  border-bottom: 1px dotted rgba(255,255,255,0.05);
}
.dollsummary span { color: var(--ash); }
.dollsummary b { font-family: var(--mono); color: var(--bone); }
.dollfoot {
  margin-top: 12px; font-family: var(--mono); font-size: calc(9.5px * var(--fs));
  color: var(--dim); letter-spacing: 0.05em;
}

/* enchanting reuses the squares in a plain grid */
.dollgrid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px;
}
.dollgrid .dollslot { width: auto; }

@media (max-width: 860px) {
  .paperdoll-wrap {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "centre centre" "left right" "bottom bottom";
  }
  .dollslot { width: auto; }
}

/* stat sheet */
.statsheet { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 3px 20px; }
.statrow {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 4px 0; border-bottom: 1px dotted rgba(255,255,255,0.05);
  font-size: calc(12.5px * var(--fs));
}
.statrow span { color: var(--ash); }
.statrow b { font-family: var(--mono); font-weight: 600; color: var(--bone); }
.statrow.hi b { color: var(--brass-hi); }

/* ------------------------------------------------------------- inventory -- */
.invhead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.invhead select, .invhead input {
  background: var(--slate); color: var(--bone);
  border: 1px solid var(--edge-hi); border-radius: var(--radius);
  padding: 6px 9px; font-size: calc(12.5px * var(--fs)); font-family: inherit;
}

.itemlist { display: flex; flex-direction: column; gap: 5px; }
.itemrow {
  display: flex; align-items: center; gap: 12px;
  background: var(--slate); border: 1px solid var(--edge);
  border-left-width: 3px; border-radius: var(--radius); padding: 8px 11px;
}
.itemrow:hover { background: var(--raise); }
.itemrow .main { flex: 1; min-width: 0; }
.itemrow .nm { font-size: calc(13px * var(--fs)); }
.itemrow .sub { font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim); margin-top: 2px; }
.itemrow .acts { display: flex; gap: 5px; flex-shrink: 0; }
.itemrow .potdesc { font-size: calc(12px * var(--fs)); color: var(--ash); margin-top: 3px; }
.upgrade { color: var(--verdant); font-family: var(--mono); font-size: calc(10px * var(--fs)); letter-spacing: 0.06em; }

.empty {
  text-align: center; color: var(--dim); padding: 34px 20px;
  font-style: italic; border: 1px dashed var(--edge); border-radius: var(--radius);
}

/* --------------------------------------------------------------- talents -- */
.treebar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.treebtn {
  background: var(--slate); border: 1px solid var(--edge); border-radius: var(--radius);
  color: var(--ash); padding: 8px 14px; cursor: pointer; font-size: calc(13px * var(--fs));
  display: flex; align-items: center; gap: 8px;
}
.treebtn.on { border-color: var(--brass); color: var(--brass-hi); background: var(--raise); }
.treebtn b { font-family: var(--mono); font-size: calc(11px * var(--fs)); }

.tiers { display: flex; flex-direction: column; gap: 10px; }
.tier { border-left: 2px solid var(--edge); padding-left: 14px; }
.tier.open { border-left-color: var(--brass); }
.tierhead {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--dim); margin-bottom: 7px;
}
.tier.open .tierhead { color: var(--brass); }
.talentgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 7px; }

.talent {
  background: var(--slate); border: 1px solid var(--edge);
  border-radius: var(--radius); padding: 9px 11px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.talent:hover { border-color: var(--edge-hi); background: var(--raise); }
.talent.maxed { border-color: var(--brass); }
.talent.invested { border-color: var(--brass); }
.talent.blocked { opacity: 0.42; cursor: not-allowed; }
.talent .th { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.talent .tn { font-size: calc(12.5px * var(--fs)); color: var(--bone); font-weight: 600; }
.talent.invested .tn { color: var(--brass-hi); }
.talent .rank { font-family: var(--mono); font-size: calc(10.5px * var(--fs)); color: var(--dim); flex-shrink: 0; }
.talent.invested .rank { color: var(--brass); }
.talent .td { font-size: calc(11.5px * var(--fs)); color: var(--ash); margin-top: 4px; line-height: 1.4; }

/* ---------------------------------------------------------------- spells -- */
.spellrow {
  display: flex; align-items: center; gap: 12px;
  background: var(--slate); border: 1px solid var(--edge);
  border-left: 3px solid var(--witch);
  border-radius: var(--radius); padding: 9px 12px; margin-bottom: 5px;
}
.spellrow.locked { border-left-color: var(--edge); opacity: 0.45; }
.spellrow .order { display: flex; flex-direction: column; gap: 2px; }
.spellrow .order button {
  background: var(--raise); border: 1px solid var(--edge); color: var(--ash);
  width: 20px; height: 15px; line-height: 1; font-size: calc(9px * var(--fs)); cursor: pointer; border-radius: 2px;
}
.spellrow .order button:hover { color: var(--brass); border-color: var(--brass); }
.spellrow .sn { font-size: calc(13px * var(--fs)); color: var(--bone); }
.spellrow .sd { font-size: calc(11.5px * var(--fs)); color: var(--ash); margin-top: 2px; }
.spellcond {
  display: flex; align-items: center; gap: 7px; margin-top: 7px;
  flex-wrap: wrap;
}
.spellcond .cw {
  font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim);
  letter-spacing: 0.05em;
}
.spellcond select, .spellcond input {
  background: var(--raise); color: var(--bone);
  border: 1px solid var(--edge); border-radius: var(--radius);
  padding: 3px 7px; font-size: calc(11.5px * var(--fs)); font-family: inherit;
}
.spellcond input { width: 58px; }
.spellcond select:focus, .spellcond input:focus { border-color: var(--brass); }

.effectgroup {
  font-family: var(--mono); font-size: calc(9px * var(--fs)); letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--brass);
  margin: 12px 0 5px; padding-top: 9px;
  border-top: 1px solid var(--edge);
}
.effectgroup:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

.spellrow .sm { font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim); flex-shrink: 0; text-align: right; }

/* -------------------------------------------------------------- crafting -- */
.matgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 5px; }
.mat {
  display: flex; justify-content: space-between; align-items: baseline;
  background: var(--slate); border: 1px solid var(--edge);
  border-radius: var(--radius); padding: 6px 10px; font-size: calc(12.5px * var(--fs));
}
.mat b { font-family: var(--mono); color: var(--brass-hi); }
.mat.zero { opacity: 0.35; }

.reciperow {
  display: flex; align-items: center; gap: 12px;
  background: var(--slate); border: 1px solid var(--edge);
  border-radius: var(--radius); padding: 9px 12px; margin-bottom: 5px;
}
.reciperow .rn { flex: 1; font-size: calc(13px * var(--fs)); }
.reciperow .cost { font-family: var(--mono); font-size: calc(11px * var(--fs)); color: var(--ash); }
.reciperow .cost .lack { color: var(--blood); }

/* --------------------------------------------------------------- tooltips -- */
.tip {
  position: fixed; z-index: 90; pointer-events: none;
  max-width: 320px; display: flex; flex-direction: column; gap: 0;
  filter: drop-shadow(0 10px 26px rgba(0,0,0,0.7));
}
.tip-card {
  background: var(--pitch); border: 1px solid var(--edge-hi);
  border-radius: var(--radius); padding: 11px 13px;
}
.tip-card.muted { opacity: 0.82; border-style: dashed; }
.tip-name { font-family: var(--serif); font-size: calc(15px * var(--fs)); line-height: 1.25; }
.tip-meta {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); letter-spacing: 0.06em;
  color: var(--dim); margin-top: 3px; text-transform: uppercase;
}
.tip-weapon {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: calc(12px * var(--fs)); margin-top: 7px; color: var(--bone);
}
.tip-dim { color: var(--ash); }

.tip-block {
  margin-top: 9px; padding-top: 8px;
  border-top: 1px solid var(--edge);
  display: flex; flex-direction: column; gap: 2px;
}
.tip-stat { display: flex; align-items: baseline; gap: 7px; font-size: calc(12.5px * var(--fs)); }
.tip-val {
  font-family: var(--mono); font-weight: 600; color: var(--brass-hi);
  min-width: 52px; text-align: right;
}
.tip-val.tip-none { color: var(--dim); }
.tip-key { color: var(--ash); flex: 1; }
.tip-delta { font-family: var(--mono); font-size: calc(11px * var(--fs)); font-weight: 600; }
.tip-delta.up { color: var(--verdant); }
.tip-delta.down { color: var(--blood); }
.tip-delta.same { color: var(--dim); }

.tip-ench {
  margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--edge);
  font-size: calc(12px * var(--fs)); color: var(--witch);
}
.tip-foot {
  margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--edge);
  font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim);
}
.tip-hint {
  background: var(--void); border: 1px solid var(--edge); border-top: 0;
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 5px 12px; font-size: calc(10.5px * var(--fs)); color: var(--dim);
}
.tip-hint b { color: var(--brass); }
.tip-vs {
  background: var(--void); border-left: 1px solid var(--edge);
  border-right: 1px solid var(--edge);
  font-family: var(--mono); font-size: calc(9px * var(--fs)); letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--dim);
  padding: 5px 12px; text-align: center;
}

/* items advertise that they have a tooltip */
[data-tip] { cursor: help; }
.itemrow[data-tip], .slot[data-tip] { cursor: pointer; }

/* -------------------------------------------------- inventory stat layout -- */
/* One stat per line, laid out in columns so a five-stat item stays compact. */
.statgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
  gap: 1px 16px; margin-top: 5px;
}
.statgrid .s {
  display: flex; align-items: baseline; gap: 6px;
  font-size: calc(12px * var(--fs)); line-height: 1.55;
}
.statgrid .s .v {
  font-family: var(--mono); font-weight: 600; color: var(--brass-hi);
  min-width: 46px; text-align: right;
}
.statgrid .s .k { color: var(--ash); }
.statgrid .s.wpn .v { color: var(--bone); }
.statgrid .s.ench { grid-column: 1 / -1; }
.statgrid .s.ench .k { color: var(--witch); }
/* ------------------------------------------------------------- spell bar -- */
.spellbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.spellbar-empty {
  font-family: var(--mono); font-size: calc(11px * var(--fs)); color: var(--dim);
  padding: 6px 0; letter-spacing: 0.04em;
}
.spellchip {
  position: relative; overflow: hidden;
  background: var(--slate); border: 1px solid var(--edge);
  border-radius: var(--radius); padding: 5px 10px;
  display: flex; align-items: baseline; gap: 8px; min-width: 132px;
  cursor: help;
}
.spellchip > i {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: rgba(125, 108, 184, 0.16); transition: width 0.1s linear;
}
.spellchip .sc-name { position: relative; font-size: calc(12px * var(--fs)); color: var(--bone); }
.spellchip .sc-cd {
  position: relative; margin-left: auto;
  font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim);
}
.spellchip.ready { border-color: var(--witch); }
.spellchip.ready .sc-cd { color: var(--witch); }
.spellchip.cooling { opacity: 0.62; }
.spellchip.poor { border-color: #5c2d2d; opacity: 0.7; }
.spellchip.poor .sc-cd { color: var(--blood); }

/* ------------------------------------------------------- effects & procs -- */
.effectrow {
  display: flex; gap: 12px; align-items: baseline;
  padding: 6px 0; border-bottom: 1px dotted rgba(255,255,255,0.05);
  font-size: calc(12.5px * var(--fs));
}
.effectrow b { color: var(--brass-hi); min-width: 118px; }
.effectrow span { color: var(--ash); }

.tip-proc {
  margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--edge);
  font-size: calc(11.5px * var(--fs)); color: var(--ash); line-height: 1.45;
}
.tip-proc b { color: var(--brass-hi); }
.tip-hands {
  margin-top: 6px; font-family: var(--mono); font-size: calc(10px * var(--fs));
  color: var(--brass); letter-spacing: 0.05em;
}
.tip-help {
  margin-top: 8px; font-size: calc(12px * var(--fs)); color: var(--ash); line-height: 1.5;
  max-width: 40ch;
}

.talent.proc { border-style: solid; }
.talent .procmark {
  font-family: var(--mono); font-size: calc(8.5px * var(--fs)); letter-spacing: 0.12em;
  color: var(--witch); border: 1px solid var(--edge-hi);
  border-radius: 2px; padding: 0 4px; vertical-align: middle;
}
.talent .tcur {
  margin-top: 5px; padding-top: 5px; border-top: 1px dotted rgba(255,255,255,0.07);
  font-family: var(--mono); font-size: calc(10.5px * var(--fs)); color: var(--brass);
}

/* stat rows are hoverable on the character sheet */
.statrow[data-tip] { cursor: help; }
.statrow[data-tip]:hover { background: rgba(255,255,255,0.03); }

/* range slider */
input[type="range"] { accent-color: var(--brass); }

.srccount {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); color: var(--dim);
  letter-spacing: 0.05em;
}

/* ------------------------------------------------------------- theme picker -- */
.themegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.themecard {
  background: var(--slate); border: 1px solid var(--edge);
  border-radius: var(--radius); padding: 11px 13px; cursor: pointer;
  transition: border-color 0.12s;
}
.themecard:hover { border-color: var(--edge-hi); }
.themecard.on { border-color: var(--brass); }
.themecard h4 { font-size: calc(14px * var(--fs)); margin-bottom: 3px; }
.themecard .tb { font-size: calc(11.5px * var(--fs)); color: var(--ash); line-height: 1.4; }
.swatches { display: flex; gap: 4px; margin-top: 9px; }
.swatches i {
  width: 20px; height: 20px; border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.10); display: block;
}

.colorrow {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; font-size: calc(12.5px * var(--fs));
}
.colorrow label { flex: 1; color: var(--ash); }
.colorrow input[type="color"] {
  width: 46px; height: 28px; padding: 0; cursor: pointer;
  background: none; border: 1px solid var(--edge-hi); border-radius: var(--radius);
}

/* ------------------------------------------------------------------ sets -- */
.tip-set {
  margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--edge);
}
.tip-setname {
  color: var(--r-uncommon); font-family: var(--serif);
  font-size: calc(12.5px * var(--fs)); margin-bottom: 4px;
}
.tip-setname span { color: var(--dim); font-family: var(--mono); font-size: calc(10px * var(--fs)); }
.tip-setpiece {
  font-size: calc(11px * var(--fs)); color: var(--dim); padding-left: 9px; line-height: 1.5;
}
.tip-setpiece.held { color: var(--ash); }
.tip-setpiece.on { color: var(--r-uncommon); }
.tip-setbonus {
  font-size: calc(11px * var(--fs)); color: var(--dim);
  margin-top: 3px; line-height: 1.45;
}
.tip-setbonus.on { color: var(--r-uncommon); }

.setblock { margin-bottom: 14px; }
.setblock:last-child { margin-bottom: 0; }
.setname {
  font-family: var(--serif); font-size: calc(15px * var(--fs));
  color: var(--r-uncommon); margin-bottom: 5px;
}
.setname span { font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim); }
.setbonus {
  display: flex; gap: 10px; align-items: baseline;
  font-size: calc(12.5px * var(--fs)); color: var(--dim);
  padding: 3px 0; opacity: 0.55;
}
.setbonus.on { opacity: 1; color: var(--ash); }
.setbonus b { color: var(--dim); font-family: var(--mono); min-width: 22px; }
.setbonus.on b { color: var(--r-uncommon); }

/* --------------------------------------------------------------- descent -- */
.boongrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.booncard {
  background: linear-gradient(180deg, var(--slate), var(--pitch));
  border: 1px solid var(--edge-hi); border-radius: var(--radius);
  padding: 18px; cursor: pointer;
  transition: border-color 0.14s, transform 0.14s;
}
.booncard:hover {
  border-color: var(--brass); transform: translateY(-2px);
}
.booncard h4 {
  font-size: calc(18px * var(--fs)); color: var(--brass-hi); margin-bottom: 7px;
}
.boonstack {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs));
  color: var(--dim); letter-spacing: 0.08em;
}
.boontext { font-size: calc(13px * var(--fs)); color: var(--ash); line-height: 1.5; min-height: 3em; }
.boonpick {
  margin-top: 12px; font-family: var(--mono); font-size: calc(10px * var(--fs));
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass);
}

/* --------------------------------------------------------------- rail foot -- */
.version {
  text-align: center; font-family: var(--mono);
  font-size: calc(9px * var(--fs)); color: var(--dim);
  letter-spacing: 0.12em; padding: 6px 0 2px;
}
#changelogbtn { position: relative; }
#changelogbtn.unread::after {
  content: ""; position: absolute; top: 5px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--brass); box-shadow: 0 0 6px var(--brass);
}

/* --------------------------------------------------------------- changelog -- */
.changelog { max-height: 60vh; overflow-y: auto; padding-right: 6px; }
.clentry { padding: 12px 0; border-bottom: 1px solid var(--edge); }
.clentry:last-child { border-bottom: 0; }
.clhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
.clver {
  font-family: var(--mono); font-size: calc(11px * var(--fs));
  color: var(--brass-hi); font-weight: 600;
}
.cltitle { font-family: var(--serif); font-size: calc(15px * var(--fs)); color: var(--bone); }
.clcurrent {
  margin-left: auto; font-family: var(--mono); font-size: calc(8.5px * var(--fs));
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--verdant); border: 1px solid var(--verdant);
  border-radius: 2px; padding: 1px 6px;
}
.cllines { margin: 0; padding-left: 18px; }
.cllines li {
  font-size: calc(12.5px * var(--fs)); color: var(--ash);
  line-height: 1.5; margin-bottom: 4px;
}

/* ------------------------------------------------------------------ guides -- */
.guidekicker {
  font-family: var(--mono); font-size: calc(9px * var(--fs));
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass);
}
.guidebody p {
  font-size: calc(13.5px * var(--fs)); color: var(--ash);
  line-height: 1.6; margin: 0 0 12px;
}
.guidebody b { color: var(--bone); }

/* ----------------------------------------------------------------- aspects -- */
.aspcount, .worntag {
  font-family: var(--mono); font-size: calc(9px * var(--fs));
  background: var(--raise); border-radius: 8px; padding: 0 5px;
  color: var(--brass-hi);
}
.worntag { color: var(--verdant); border: 1px solid var(--edge); }
.aspectcard {
  background: var(--slate); border: 1px solid var(--edge-hi);
  border-left: 3px solid var(--witch);
  border-radius: var(--radius); padding: 11px 13px; margin-bottom: 8px;
}
.aspname {
  font-family: var(--serif); font-size: calc(13.5px * var(--fs));
  color: var(--witch); margin-bottom: 3px;
}
.asptext { font-size: calc(12px * var(--fs)); color: var(--ash); line-height: 1.45; }
.aspslot {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs));
  color: var(--dim); letter-spacing: 0.05em; margin-top: 5px;
}
.tip-aspect {
  margin-top: 9px; padding: 8px 10px;
  background: rgba(125,108,184,0.10);
  border: 1px solid rgba(125,108,184,0.32);
  border-radius: var(--radius);
}
.tip-aspecttag {
  display: inline-block; font-family: var(--mono);
  font-size: calc(8.5px * var(--fs)); letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--witch);
  border: 1px solid var(--witch); border-radius: 2px;
  padding: 0 5px; margin-right: 6px; vertical-align: middle;
}
.tip-aspect b { color: var(--witch); }
.tip-aspectnote {
  font-size: calc(10px * var(--fs)); color: var(--dim);
  margin-top: 4px; font-style: italic;
}

/* ---------------------------------------------------------- descent recap -- */
.recap { border-left: 3px solid var(--r-unique); }
.recaphead {
  font-family: var(--serif); font-size: calc(15px * var(--fs));
  color: var(--bone); margin-bottom: 10px;
}
.recapstats { display: flex; gap: 24px; margin-bottom: 12px; }
.recapstats div { display: flex; flex-direction: column; gap: 2px; }
.recapstats span {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs));
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
}
.recapstats b {
  font-family: var(--serif); font-size: calc(22px * var(--fs)); color: var(--brass-hi);
}
.recapboons { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.recaplabel {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs));
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim);
}
.recapboon {
  font-size: calc(11px * var(--fs)); color: var(--ash);
  background: var(--slate); border: 1px solid var(--edge);
  border-radius: 3px; padding: 2px 8px;
}

/* modal head/foot shared by changelog and guides */
.modalhead { margin-bottom: 14px; }
.modalsub {
  font-family: var(--mono); font-size: calc(10px * var(--fs));
  color: var(--dim); letter-spacing: 0.05em; margin-top: 3px;
}
.modalfoot {
  display: flex; align-items: center; gap: 10px;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--edge);
}

/* ------------------------------------------------------------ realm runs -- */
.runline {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--edge);
  font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--dim);
  letter-spacing: 0.05em;
}
.runline b { color: var(--brass-hi); }
.depth-tag {
  font-family: var(--mono); font-size: calc(10px * var(--fs)); letter-spacing: 0.08em;
  color: var(--verdant);
}

/* ------------------------------------------------------- unique passives -- */
.tip-passive {
  margin-top: 9px; padding: 8px 10px;
  background: rgba(210,83,107,0.09);
  border: 1px solid rgba(210,83,107,0.30);
  border-radius: var(--radius);
}
.tip-passive b {
  display: block; color: var(--r-unique);
  font-family: var(--serif); font-size: calc(13px * var(--fs)); margin-bottom: 3px;
}
.tip-passive span { font-size: calc(11.5px * var(--fs)); color: var(--bone); line-height: 1.5; }
.tip-flavour {
  margin-top: 8px; font-family: var(--serif); font-style: italic;
  font-size: calc(11.5px * var(--fs)); color: var(--dim); line-height: 1.45;
}

.uniquecard {
  background: var(--slate);
  border: 1px solid var(--edge);
  border-left: 3px solid var(--r-unique);
  border-radius: var(--radius); padding: 13px 15px;
}
.uniquecard.owned { border-color: var(--r-unique); background: rgba(210,83,107,0.05); }
.uniquecard h4 { font-size: calc(15px * var(--fs)); margin-bottom: 2px; }
.uniquecard .src {
  font-family: var(--mono); font-size: calc(9.5px * var(--fs)); letter-spacing: 0.08em;
  color: var(--dim); text-transform: uppercase; margin-bottom: 8px;
}
.uniquecard .pname {
  color: var(--r-unique); font-family: var(--serif);
  font-size: calc(13px * var(--fs)); margin-bottom: 3px;
}

/* ---------------------------------------------------------------- toasts -- */
.toasts {
  position: fixed; right: 18px; bottom: 18px; z-index: 60;
  display: flex; flex-direction: column-reverse; gap: 7px; pointer-events: none;
}
.toast {
  background: var(--pitch); border: 1px solid var(--edge-hi);
  border-left: 3px solid var(--brass);
  border-radius: var(--radius); padding: 9px 14px; font-size: calc(12.5px * var(--fs));
  max-width: 330px; animation: rise 0.22s ease-out;
  box-shadow: 0 8px 24px rgba(0,0,0,0.55);
}
.toast.bad { border-left-color: var(--blood); }
.toast.good { border-left-color: var(--verdant); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ----------------------------------------------------------------- modal -- */
.scrim {
  position: fixed; inset: 0; background: rgba(6,4,10,0.82);
  display: flex; align-items: center; justify-content: center; z-index: 70; padding: 20px;
}
.modal {
  background: var(--pitch); border: 1px solid var(--edge-hi);
  border-radius: var(--radius); padding: 22px;
  max-width: 560px; width: 100%; max-height: 84vh; overflow-y: auto;
}
.modal h3 { font-size: calc(19px * var(--fs)); margin-bottom: 12px; }
.modal textarea {
  width: 100%; height: 130px; background: var(--void); color: var(--bone);
  border: 1px solid var(--edge); border-radius: var(--radius);

.modalfoot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px;
  font-size: calc(12.5px * var(--fs)); color: #d3a2a2;
}

/* ------------------------------------------------------------ responsive -- */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; }

<!-- Failure trap. The interface is built by script, so if anything throws before
     boot() finishes you would otherwise be staring at a blank page with no clue
     why. This turns that into a readable message. -->
<script>
(function () {
  var shown = false;
  function show(what, detail) {
    if (shown) return; shown = true;
    document.body.innerHTML =
      '<div style="font:14px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#cec4b6;' +
      'background:#0e0a12;padding:28px;min-height:100vh">' +
      '<h1 style="color:#bd8c45;font:600 22px Georgia,serif;margin:0 0 14px">Bloodfell could not start</h1>' +
      '<p style="color:#8c8195;max-width:60ch">' + what + '</p>' +
      '<pre style="background:#171120;border:1px solid #3a2b4e;border-radius:3px;padding:12px;' +
      'overflow:auto;font-size:11px;color:#ac3c3c;white-space:pre-wrap">' + detail + '</pre>' +
      '<p style="color:#675d73;font-size:12.5px;max-width:60ch">This build carries everything inside one file, so it is unlikely to be a loading problem. Please send this message along and it can be fixed.</p></div>';
  }
  window.addEventListener('error', function (e) {
    show('Something threw while starting up.',
         (e.message || 'unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || '?'));
  });
  // if boot never runs, the scripts themselves never arrived
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!document.querySelector('.rail')) {
        show('The game\u2019s script files did not load.',
             'index.html loaded, but js/ and css/ alongside it did not.');
      }
    }, 400);
  });
})();
</script>

/* ===========================================================================
   ITEMS — slots, rarities, base types, affixes, enchants.
   ---------------------------------------------------------------------------
   Gear is generated procedurally (js/core/loot.js) from three pieces:
       PREFIX  +  BASE  +  SUFFIX
       "Blackened"  "Warhammer"  "of Brutality"
   The base type is chosen to match the item's primary stat, so a Strength
   item is never called a dagger and an Intellect item is never plate. The
   suffix is chosen from the item's highest stat, so the name tells you what
   it does before you read the numbers.
   =========================================================================== */

/* ===========================================================================
   TALENTS — 5 trees, 25 talents each, 5 tiers of 5.
   ---------------------------------------------------------------------------
   Tier N unlocks once you have spent 5 * (N-1) points IN THAT TREE.
   Talents unlock at character level 10. You get 1 point per level after that,
   so a level 50 character has exactly 40 points. Resetting is free, always.

   40 points buys you the full depth of one tree (tier 5 needs 20 in-tree) plus
   a solid dip into a second. Filling a whole tree costs ~57 points, so you can
   never have everything.

   Every talent is just a bag of modifiers. To add your own, copy a line and
   change the numbers — no engine code needs to change.

   MODIFIER KEYS
     str agi int spi sta ............ flat primary stats
     strPct agiPct intPct spiPct .... percent primary stats
     staPct hpPct manaPct ........... percent pools
     crit haste dodge block ......... flat percentage points
     critDmg ........................ percent added to crit multiplier
     armor armorPct ................. armor
     physDmg magicDmg allDmg ........ percent damage by school
     healPct ........................ percent healing done
     dr ............................. flat percent damage reduction
     lifesteal thorns ............... percent
     manaRegen ...................... percent
     cdr ............................ percent spell cooldown reduction
     execDmg ........................ percent bonus vs targets under 30% HP
     goldFind xpBonus magicFind ..... percent to gold / xp / drop rates
     lowHpDmg ....................... percent bonus damage below 35% own health
     highHpDmg ...................... percent bonus damage above 70% own health
     rampDmg ........................ percent added per swing, resets each fight

   A talent may also carry `effect: { id, chance, potency }`, which grants one of
   the procs defined in js/data/effects.js. Ranks multiply `chance`, so three
   ranks of a 5% proc is 15%. Those talents carry `mods: {}`.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   BLACKSMITHING
   Recipes are generated rather than typed out one by one: every tier can make
   every slot, in Strength / Agility / Intellect flavours. Crafted gear always
   rolls Rare, and the stat rolls vary, so crafting the same piece twice can
   give you a better one. To change costs, edit bsCost() below.
   --------------------------------------------------------------------------- */

/* Base material cost per slot — heavier armour costs more metal. */
const BS_SLOT_COST = {
  helm:      { metal: 6, hide: 2, wood: 0 },
  shoulders: { metal: 5, hide: 3, wood: 0 },
  cape:      { metal: 0, hide: 6, wood: 0 },
  chest:     { metal: 9, hide: 4, wood: 0 },
  wrist:     { metal: 3, hide: 2, wood: 0 },
  gloves:    { metal: 4, hide: 3, wood: 0 },
  waist:     { metal: 4, hide: 3, wood: 0 },
  legs:      { metal: 8, hide: 4, wood: 0 },
  boots:     { metal: 5, hide: 4, wood: 0 },
  ring:      { metal: 5, hide: 0, wood: 0 },
  trinket:   { metal: 4, hide: 2, wood: 2 },
  mainhand:  { metal: 10, hide: 2, wood: 5 },
  offhand:   { metal: 7, hide: 3, wood: 4 },
};

/* Which primary flavours make sense in each slot. */
const BS_PRIMARIES = ["str", "agi", "int"];
const PRIMARY_LABEL = { str: "Strength", agi: "Agility", int: "Intellect", spi: "Spirit", sta: "Stamina" };

function buildBlacksmithRecipes() {
  const out = [];
  for (let tier = 1; tier <= 5; tier++) {
    const t = TIER_MATS[tier];
    const ct = CRAFT_TIERS[tier];
    const mult = 1 + (tier - 1) * 0.35;
    for (const slot of SLOT_TYPES) {
      const base = BS_SLOT_COST[slot];
      for (const primary of BS_PRIMARIES) {
        const mats = {};
        if (base.metal) mats[t.metal] = Math.round(base.metal * mult);
        if (base.hide) mats[t.hide] = Math.round(base.hide * mult);
        if (base.wood) mats[t.wood] = Math.round(base.wood * mult);
        mats[t.essence] = tier === 1 ? 1 : Math.round(tier * 0.8);
        out.push({
          id: `bs_t${tier}_${slot}_${primary}`,
          prof: "bs", tier, slot, primary,
          ilvl: ct.ilvl, req: ct.req,
          rarity: null,           // rolled at craft time, see CRAFT_RARITY
          gold: Math.round(85 * Math.pow(2.8, tier - 1)),
          mats,
        });
      }
    }
  }
  return out;
}

/* ======== js/data/effects.js ======== */
/* ===========================================================================
   EFFECTS — procs and conditional bonuses.
   ---------------------------------------------------------------------------
   One system serves two purposes: the special property on an Epic or Legendary
   item, and the talents that do something more interesting than adding a
   percentage. Both produce the same kind of entry:

       { id: "rend", chance: 15, potency: 1 }

   TRIGGERS
     hit    a landed attack, auto or spell
     crit   a critical strike specifically
     kill   the enemy dies
     hurt   you take damage
     open   the first swing of a fight

   ACTIONS
     dot     bleeding or burning on the target
     strike  immediate extra damage
     heal    heal yourself
     buff    a temporary bag of modifiers, same keys talents use
     swing   an immediate extra auto-attack
     slow    the enemy attacks more slowly for a while
     mana    restore mana

   `potency` scales the numbers, so the same effect can appear as a modest roll
   on an Epic and a serious one on a Legendary without a second definition.
   =========================================================================== */

const EFFECTS = {
  /* ---- offensive procs ---------------------------------------------------- */
  rend: {
    name: "Rend", trigger: "hit", action: "dot", school: "phys",

  leech: {

  },
  soulsiphon: {
    name: "Soul Siphon", trigger: "kill", action: "mana", amount: 0.20,

    name: "Vengeance", trigger: "hurt", action: "buff",

/* Which procs suit which archetype, so a plate chest does not roll a rogue proc. */
const PROC_POOL = {
  str: ["rend", "shatter", "vengeance", "bulwark", "retort", "windfury", "execute_proc", "leech", "momentum"],
  agi: ["rend", "shatter", "windfury", "ambush", "leech", "momentum", "execute_proc", "frostbite"],
  int: ["ignite", "frostbite", "leech", "soulsiphon", "execute_proc", "vengeance", "ambush", "momentum"],
};

/* Epics get a modest roll, legendaries a stronger one. */
const PROC_TIERS = {
  epic:      { chance: [8, 14], potency: [0.8, 1.0] },
  legendary: { chance: [12, 20], potency: [1.0, 1.35] },
};

function describeEffect(inst) {
  const def = EFFECTS[inst.id];
  if (!def) return "";
  return def.text({ chance: inst.chance, potency: inst.potency });
}

function effectName(inst) {
  const def = EFFECTS[inst.id];
  return def ? def.name : inst.id;
}

function setById(id) { return SETS.find(s => s.id === id) || null; }

/* Boss one of a raid guards the helm, boss two the shoulders, and so on, so a
   complete set means clearing the whole raid rather than farming one encounter. */
function setPieceForBoss(bossId) {
  for (const raid of RAIDS) {
    const idx = raid.bosses.findIndex(b => b.id === bossId);
    if (idx < 0) continue;
    const set = SETS.find(s => s.raid === raid.id);
    if (!set || idx >= SET_SLOTS.length) return null;
    return setPieceDef(set, idx);
  }
  return null;
}

/* The definition for one piece, built from the set and its index. */
function setPieceDef(set, index) {
  const primary = set.id === "regalia" ? "int" : (set.id === "warplate" ? "str" : "str");
  return {
    setId: set.id,
    index,
    slot: SET_SLOTS[index],
    name: SET_PIECE_NAMES[set.id][index],
    ilvl: set.ilvl,
    primary,
  };
}

/* Every piece in the game, flattened — used by the collection page and by the
   boss drop tables. */
function allSetPieces() {
  const out = [];
  for (const set of SETS) {
    for (let i = 0; i < SET_SLOTS.length; i++) out.push(setPieceDef(set, i));
  }
  return out;
}

/* ======== js/core/state.js ======== */
/* ===========================================================================
   STATE — the save file, and everything that reads or writes it.
   ---------------------------------------------------------------------------
   One global object, `S`. Anything not in `S` does not survive a refresh.

   Saving uses localStorage. If the browser blocks it (some sandboxed previews
   do), the game still runs perfectly for the session and tells you once, at
   the top of the screen, that you should use Export Save instead.
   =========================================================================== */

const SAVE_KEY = "opus_realms_save_v1";
const MAX_LEVEL = 50;
const TALENT_START_LEVEL = 10;

/* ---------------------------------------------------------------------------
   LEVELLING PACE — the single dial for how long the game is.

   XP_PACE multiplies the whole curve. Roughly how long reaching level 50 takes
   with auto-grind running, measured including the gap between fights:

       XP_PACE      1x speed     2x        4x        8x
         1.0           10h        6h        3h        2h
         1.5           15h        9h        5h        3h
         2.5           25h       14h        9h        6h     <- default
         4.0           40h       23h       14h        9h

   The exponent controls the shape rather than the length: raise it and the last
   ten levels become the bulk of the game, lower it and the climb is more even.
   --------------------------------------------------------------------------- */
const XP_PACE = 2.5;
const XP_EXPONENT = 1.85;

function xpToNext(lvl) {
  return Math.round(XP_PACE * (55 * Math.pow(lvl, XP_EXPONENT) + 55 * lvl));
}

function totalTalentPoints(lvl) {
  return Math.max(0, lvl - TALENT_START_LEVEL);
}

function freshSave() {
  const eq = {};
  for (const s of SLOTS) eq[s.key] = null;
  return {
    version: 1,
    created: Date.now(),
    name: "Nameless",
    level: 1,
    xp: 0,
    gold: 0,

    equipment: eq,
    inventory: [],
    materials: {},
    potions: {},

    talents: {},
    spellOrder: [],

    /* Per-spell firing conditions, keyed by spell id:
         { type: "enemyBelow", value: 30 }
       Anything without an entry casts whenever it is off cooldown. */
    spellConditions: {},

    /* Combat draughts last far longer than a single fight, so they persist here
       rather than inside a fight. Each entry is { id, name, mods, remaining },
       and `remaining` only ticks down while you are actually fighting. */
    potionBuffs: [],

    /* The merchant. Stock rotates on a real-world timer; you may pay to force it
       early, at a price that doubles each time until the free rotation lands. */
    merchant: { stock: [], nextRefresh: 0, forcedCount: 0 },

    killStreak: 0,        // consecutive wins; some Uniques feed on it

    /* A realm run. Depth rises with every kill and makes the realm's inhabitants
       stronger and their loot better. Health and mana carry over between fights
       within a run, so a run ends when you die or when you walk out. */
    run: { realmId: null, depth: 0 },

    /* The Descent: the endgame dive. `boons` maps boon id to how many times it
       has been taken; `best` survives between runs as a personal record. */
    descent: { active: false, floor: 0, boons: {}, pendingChoices: null, best: 0 },
    lastDescent: null,    // stats of the most recent finished run, for the recap

    /* Aspects: special properties extracted from salvaged items. Each is stored
       under the SLOT it came from, because an aspect can only be re-applied to
       the same slot — a helm aspect goes on helms and nowhere else. This is what
       stops one strong effect being stamped onto all fifteen pieces at once.
       Shape: { helm: [ {kind, ...} ], chest: [ ... ], ... } */
    aspects: {},
    vitals: { hp: null, mana: null },   // null means "full"

    kills: {},            // realmId -> total kills
    enemyKills: {},       // "realmId::Enemy Name" -> kills
    bossKills: {},        // bossId -> kills (drives escalation)
    unlockedRaids: [],

    settings: {
      autoGrind: false,
      speed: 2,           // 1 = real time, 2 = double, 4 = quadruple
      autoPotion: true,
      potionThreshold: 40,   // use a health potion below this % HP
      healPotion: null,      // potion id, or null for "highest tier owned"
      buffPotions: [],       // potion ids fired at the start of a fight
      compactLog: false,
      autoRetreat: 0,         // retreat below this % health; 0 disables it
      autoSalvage: "off",     // off | common | uncommon — handled after each fight
      autoSalvageMode: "salvage",   // salvage | sell
      sound: true,
      volume: 0.5,
      theme: "grimoire",
      customTheme: null,
      textScale: 1,
      seenVersion: null,     // for the changelog unread mark
      seenGuides: {},        // which first-visit guides have been shown
    },

    tally: { kills: 0, bossKills: 0, items: 0, goldEarned: 0, deaths: 0 },

    storageWarned: false,
  };
}

let S = freshSave();
let STORAGE_OK = true;

/* A new character gets a weapon and a few scraps. Starting with bare fists and
   fifteen empty slots makes the first hour miserable and teaches nothing. */
function giveStarterKit() {
  const kit = [
    { slot: "mainhand", primary: "str" },
    { slot: "chest", primary: "str" },
    { slot: "legs", primary: "str" },
    { slot: "boots", primary: "str" },
  ];
  for (const k of kit) {
    const item = generateItem({ ilvl: 1, rarity: "common", slot: k.slot, primary: k.primary });
    S.equipment[k.slot] = item;
  }
  S.potions.po_h1 = 5;
}

function saveGame() {
  if (!STORAGE_OK) return false;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    return true;
  } catch (e) {
    STORAGE_OK = false;
    return false;
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    S = migrate(parsed);
    return true;
  } catch (e) {
    STORAGE_OK = false;
    return false;
  }
}

/* Fills in anything a newer version added, so old saves keep working. */
function migrate(save) {
  const base = freshSave();
  const out = Object.assign(base, save);
  out.settings = Object.assign(base.settings, save.settings || {});
  out.tally = Object.assign(base.tally, save.tally || {});
  for (const s of SLOTS) if (!(s.key in out.equipment)) out.equipment[s.key] = null;
  // the top auto-battle speed used to be 8x; clamp any old save into the new range
  if (out.settings.speed > 3) out.settings.speed = 3;
  // fields added in later versions that an older save will not have
  if (!out.aspects) out.aspects = {};
  if (!out.descent) out.descent = { active: false, floor: 0, boons: {}, pendingChoices: null, best: 0 };
  if (!out.run) out.run = { realmId: null, depth: 0 };
  if (!out.vitals) out.vitals = { hp: null, mana: null };
  return out;
}

function wipeSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nothing to do */ }
  S = freshSave();
}

function exportSave() {
  return btoa(unescape(encodeURIComponent(JSON.stringify(S))));
}

function importSave(text) {
  const parsed = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
  S = migrate(parsed);
  saveGame();
}

/* --------------------------------------------------------------------------
   Small shared helpers used all over the codebase.
   -------------------------------------------------------------------------- */
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

function fmt(n) {
  n = Math.round(n);
  if (n >= 1000000) return (n / 1000000).toFixed(2) + "M";
  if (n >= 10000) return (n / 1000).toFixed(1) + "k";
  return n.toLocaleString("en-US");
}

/* Weighted pick from an object of { key: weight }. */
function weightedPick(weights) {
  let total = 0;
  for (const k in weights) total += weights[k];
  let roll = Math.random() * total;
  for (const k in weights) {
    roll -= weights[k];
    if (roll <= 0) return k;
  }
  return Object.keys(weights)[0];
}

function addMaterial(id, qty) {
  S.materials[id] = (S.materials[id] || 0) + qty;
}
function takeMaterial(id, qty) {
  if ((S.materials[id] || 0) < qty) return false;
  S.materials[id] -= qty;
  if (S.materials[id] <= 0) delete S.materials[id];
  return true;
}
function hasMaterials(mats) {
  for (const id in mats) if ((S.materials[id] || 0) < mats[id]) return false;
  return true;
}
function addPotion(id, qty) {
  S.potions[id] = (S.potions[id] || 0) + qty;
}
function takePotion(id, qty) {
  if ((S.potions[id] || 0) < qty) return false;
  S.potions[id] -= qty;
  if (S.potions[id] <= 0) delete S.potions[id];
  return true;
}
function potionById(id) { return POTIONS.find(p => p.id === id) || null; }
function realmById(id) { return REALMS.find(r => r.id === id) || null; }
function raidById(id) { return RAIDS.find(r => r.id === id) || null; }
function bossById(id) {
  for (const raid of RAIDS) {
    const b = raid.bosses.find(x => x.id === id);
    if (b) return b;
  }
  return null;
}
function talentById(id) {
  for (const tree of TALENT_TREES) {
    const t = tree.talents.find(x => x.id === id);
    if (t) return t;
  }
  return null;
}
function treeOfTalent(id) {
  for (const tree of TALENT_TREES) if (tree.talents.some(t => t.id === id)) return tree;
  return null;
}


/* ======== js/core/sound.js ======== */
/* ===========================================================================
   SOUND — synthesised, not sampled.
   ---------------------------------------------------------------------------
   Every sound here is generated with the Web Audio API at runtime. That keeps
   the game a single folder with no media files, which matters because the whole
   thing has to run from a local file with no server and no network.

   Browsers refuse to start audio until the user interacts with the page, so the
   context is created lazily on the first click and stays muted until then.
   =========================================================================== */

const Sound = {
  ctx: null,
  master: null,
  ready: false,
  lastPlay: {},          // per-name throttle, so a fast fight is not a buzzsaw

  init() {
    // created on first gesture; calling this early is harmless
    const start = () => {
      if (this.ready) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = S.settings.sound ? S.settings.volume : 0;
        this.master.connect(this.ctx.destination);
        this.ready = true;
      } catch (e) { /* audio simply will not work here; the game does not care */ }
    };
    document.addEventListener("pointerdown", start, { once: true });
    document.addEventListener("keydown", start, { once: true });
  },

  setVolume(v) {
    S.settings.volume = clamp(v, 0, 1);
    if (this.master) this.master.gain.value = S.settings.sound ? S.settings.volume : 0;
    saveGame();
  },

  setEnabled(on) {
    S.settings.sound = !!on;
    if (this.master) this.master.gain.value = on ? S.settings.volume : 0;
    saveGame();
  },

  /* One shaped oscillator. Everything below is built from this. */
  tone(opts) {
    if (!this.ready || !S.settings.sound) return;
    const o = opts || {};
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const dur = o.dur || 0.12;

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.from || 440, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + dur);

    const peak = (o.gain === undefined ? 0.25 : o.gain);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.02, dur * 0.25));
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(gain); gain.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },

  /* Filtered white noise — impacts, hits, salvage. */
  noise(opts) {
    if (!this.ready || !S.settings.sound) return;
    const o = opts || {};
    const dur = o.dur || 0.10;
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const frames = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, frames, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);

    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filt = this.ctx.createBiquadFilter();
    filt.type = o.filter || "bandpass";
    filt.frequency.value = o.freq || 900;
    filt.Q.value = o.q || 1.1;
    const gain = this.ctx.createGain();
    gain.gain.value = (o.gain === undefined ? 0.20 : o.gain);

    src.connect(filt); filt.connect(gain); gain.connect(this.master);
    src.start(t0);
  },

  /* Throttled so a 8x-speed fight does not produce a solid wall of noise. */
  play(name, minGap) {
    if (!this.ready || !S.settings.sound) return;
    const now = performance.now();
    const gap = minGap === undefined ? 60 : minGap;
    if (this.lastPlay[name] && now - this.lastPlay[name] < gap) return;
    this.lastPlay[name] = now;
    const fn = this.bank[name];
    if (fn) fn.call(this);
  },

  bank: {
    click()    { this.tone({ type: "triangle", from: 520, to: 380, dur: 0.05, gain: 0.10 }); },
    hover()    { this.tone({ type: "sine", from: 700, dur: 0.03, gain: 0.04 }); },
    hit()      { this.noise({ freq: 700, dur: 0.07, gain: 0.10, filter: "bandpass" }); },
    crit()     { this.noise({ freq: 1400, dur: 0.10, gain: 0.16 });
                 this.tone({ type: "square", from: 720, to: 300, dur: 0.11, gain: 0.10 }); },
    hurt()     { this.tone({ type: "sawtooth", from: 190, to: 90, dur: 0.13, gain: 0.10 }); },
    spell()    { this.tone({ type: "sine", from: 480, to: 900, dur: 0.16, gain: 0.10 }); },
    proc()     { this.tone({ type: "triangle", from: 900, to: 1500, dur: 0.10, gain: 0.09 }); },
    potion()   { this.tone({ type: "sine", from: 300, to: 760, dur: 0.20, gain: 0.11 }); },
    loot()     { this.tone({ type: "sine", from: 880, dur: 0.09, gain: 0.10 });
                 this.tone({ type: "sine", from: 1320, dur: 0.11, gain: 0.09, delay: 0.07 }); },
    rare()     { [660, 880, 1100].forEach((f, i) =>
                   this.tone({ type: "sine", from: f, dur: 0.16, gain: 0.10, delay: i * 0.07 })); },
    levelup()  { [523, 659, 784, 1047].forEach((f, i) =>
                   this.tone({ type: "triangle", from: f, dur: 0.26, gain: 0.13, delay: i * 0.09 })); },
    victory()  { [587, 784].forEach((f, i) =>
                   this.tone({ type: "sine", from: f, dur: 0.16, gain: 0.09, delay: i * 0.08 })); },
    defeat()   { this.tone({ type: "sawtooth", from: 260, to: 70, dur: 0.55, gain: 0.13 }); },
    craft()    { this.noise({ freq: 420, dur: 0.13, gain: 0.16, filter: "lowpass" });
                 this.tone({ type: "square", from: 240, to: 170, dur: 0.13, gain: 0.07, delay: 0.05 }); },
    salvage()  { this.noise({ freq: 2200, dur: 0.16, gain: 0.11, filter: "highpass" }); },
    coin()     { [1200, 1600].forEach((f, i) =>
                   this.tone({ type: "sine", from: f, dur: 0.07, gain: 0.08, delay: i * 0.04 })); },
    error()    { this.tone({ type: "square", from: 200, to: 150, dur: 0.14, gain: 0.09 }); },
  },
};


/* ======== js/core/passives.js ======== */
/* ===========================================================================
   PASSIVES — the machinery behind Unique items.
   ---------------------------------------------------------------------------
   A proc (js/data/effects.js) rolls a chance and then does something. A passive
   is different: it sits inside the combat loop and changes how a rule works.
   That needs real hooks rather than a trigger list, so each passive is an object
   with whichever of these it needs:

     fightStart(C)              once, as the fight opens
     tick(C)                    every 0.1s step
     damageTaken(C, dmg)        return the damage to actually apply, or 0 to
                                swallow it entirely (see smooth_damage)
     damageDealt(C, dmg, ctx)   return the damage to actually deal
     wouldDie(C)                return true to prevent death this instant
     onKill(C)                  after the enemy falls
     healTaken(C, amount)       return the healing to actually apply
     manaCost(C, cost)          return the mana a spell actually costs
     cooldown(C, cd)            return the cooldown a spell actually gets

   `C` is the Combat object, so a passive can read the whole fight state.
   Anything needing per-fight memory keeps it on C.passiveState, which is wiped
   at the start of every engagement.
   =========================================================================== */

const SMOOTH_WINDOW = 1.0;      // seconds that Even Keel spreads a blow across
const DAMAGE_CAP_FRACTION = 0.12;

const PASSIVES = {

  /* ------------------------------------------------------------------------
     Even Keel — the incoming blow is queued and paid out in slices. Burst
     becomes a bleed, which a heal or a potion actually has time to answer.
     ------------------------------------------------------------------------ */
  smooth_damage: {
    fightStart(C) { C.passiveState.smoothQueue = []; },

    damageTaken(C, dmg) {
      const slices = Math.max(1, Math.round(SMOOTH_WINDOW / TICK));
      C.passiveState.smoothQueue.push({ perTick: dmg / slices, left: slices });
      return 0;   // nothing lands right now; the queue pays it out
    },

    tick(C) {
      const q = C.passiveState.smoothQueue;
      if (!q || !q.length) return;
      let total = 0;
      for (let i = q.length - 1; i >= 0; i--) {
        total += q[i].perTick;
        if (--q[i].left <= 0) q.splice(i, 1);
      }
      if (total > 0) C.applyRawDamage(total);
    },
  },

  /* One free death per fight. */
  second_heart: {
    fightStart(C) { C.passiveState.heartUsed = false; },
    wouldDie(C) {
      if (C.passiveState.heartUsed) return false;
      C.passiveState.heartUsed = true;
      C.player.hp = 1;
      C.healPlayer(C.stats.maxHp * 0.25, "Second Heart");
      C.pushLog("Second Heart takes the blow for you.", "proc");
      return true;
    },
  },

  /* Four times the damage, or none at all. */
  gamble: {
    damageDealt(C, dmg, ctx) {
      if (!ctx || ctx.source !== "auto") return dmg;
      const roll = Math.random();
      if (roll < 0.14) { C.pushLog("The coin comes up well.", "proc"); return dmg * 4; }
      if (roll < 0.28) { C.pushLog("The coin comes up badly.", "miss"); return 0; }
      return dmg;
    },
  },

  /* Excellent while ahead, punishing once behind. */
  cowards_bargain: {
    damageTaken(C, dmg) {
      const frac = C.player.hp / C.stats.maxHp;
      return frac > 0.60 ? dmg * 0.65 : dmg * 1.25;
    },
  },

  /* Grows without limit for as long as the fight runs. */
  long_grudge: {
    damageDealt(C, dmg) { return dmg * (1 + 0.05 * C.fightTime); },
  },

  /* Healing halved, but the weapon feeds you. */
  ashglass: {
    healTaken(C, amount) { return amount * 0.5; },
    damageDealt(C, dmg) {
      C.healPlayer(dmg * 0.14, null, true);
      return dmg;
    },
  },

  /* Half the cooldown, nearly double the cost. */
  widows_clock: {
    cooldown(C, cd) { return cd * 0.5; },
    manaCost(C, cost) { return cost * 1.8; },
  },

  /* Every fourth swing lands enormously. */
  fourth_strike: {
    fightStart(C) { C.passiveState.swingCount = 0; },
    damageDealt(C, dmg, ctx) {
      if (!ctx || ctx.source !== "auto") return dmg;
      C.passiveState.swingCount = (C.passiveState.swingCount || 0) + 1;
      if (C.passiveState.swingCount % 4 === 0) {
        C.pushLog("The ember catches.", "proc");
        return dmg * 3;
      }
      return dmg;
    },
  },

  /* A streak that survives between fights but not a defeat. */
  thief_of_hours: {
    statMods(C) {
      const stacks = Math.min(S.killStreak || 0, 10);
      return { haste: stacks * 3 };
    },
  },

  /* Rewards opening hard rather than grinding down. */
  unspoken: {
    damageDealt(C, dmg) {
      return C.enemy && C.enemy.hp >= C.enemy.maxHp ? dmg * 1.30 : dmg;
    },
  },

  /* Caps any single blow, which is what makes big bosses survivable. */
  damage_cap: {
    damageTaken(C, dmg) {
      return Math.min(dmg, C.stats.maxHp * DAMAGE_CAP_FRACTION);
    },
  },

  /* Free spells while badly hurt. */
  hollow_lantern: {
    manaCost(C, cost) {
      return C.player.hp / C.stats.maxHp < 0.25 ? 0 : cost;
    },
  },

  /* Health as the casting resource. Cheaper, but it comes out of you. */
  pact_iron: {
    manaCost(C, cost) {
      const hp = cost * 0.5 * (C.stats.maxHp / Math.max(1, C.stats.maxMana));
      C.passiveState.pendingHealthCost = (C.passiveState.pendingHealthCost || 0) + hp;
      return 0;
    },
    tick(C) {
      const owed = C.passiveState.pendingHealthCost || 0;
      if (owed <= 0) return;
      C.passiveState.pendingHealthCost = 0;
      C.applyRawDamage(owed);
    },
  },

  /* Slower and heavier. Net damage is a clear gain; the rhythm changes entirely. */
  slow_hours: {
    statMods() { return { haste: -25 }; },
    damageDealt(C, dmg, ctx) {
      return (ctx && ctx.source === "auto") ? dmg * 1.55 : dmg;
    },
  },

  /* Banks a tenth of your output and pays it back as one blow. */
  tithe: {
    fightStart(C) { C.passiveState.tithe = 0; C.passiveState.tithePaid = false; },
    damageDealt(C, dmg) {
      C.passiveState.tithe = (C.passiveState.tithe || 0) + dmg * 0.10;
      return dmg * 0.90;
    },
    tick(C) {
      if (C.passiveState.tithePaid || C.fightTime < 12) return;
      const stored = C.passiveState.tithe || 0;
      if (stored <= 0) return;
      C.passiveState.tithePaid = true;
      C.pushLog("The Tithe comes due.", "proc");
      C.damageEnemy(stored, "The Tithe", true, "phys");
    },
  },

  /* Enormous damage, and a third less health to survive the answer. */
  glass_crown: {
    statMods() { return { hpPct: -33, allDmg: 55 }; },
  },

  /* Overhealing is banked as a shield instead of being thrown away. */
  kept_promise: {
    fightStart(C) { C.passiveState.promise = 0; },
    healTaken(C, amount) {
      const room = C.stats.maxHp - C.player.hp;
      const waste = Math.max(0, amount - room);
      if (waste > 0) {
        const cap = C.stats.maxHp / 3;
        C.passiveState.promise = Math.min(cap, (C.passiveState.promise || 0) + waste);
      }
      return amount;
    },
    damageTaken(C, dmg) {
      const banked = C.passiveState.promise || 0;
      if (banked <= 0) return dmg;
      C.passiveState.promise = 0;
      C.player.shield = { name: "The Kept Promise", amount: banked, remaining: 12 };
      C.pushLog(`The Kept Promise repays ${fmt(banked)}.`, "shield");
      return dmg;
    },
  },

  /* The opener is guaranteed and enormous; nothing else changes. */
  quiet_knife: {
    fightStart(C) { C.passiveState.knifeUsed = false; },
    damageDealt(C, dmg, ctx) {
      if (!ctx || ctx.source !== "auto" || C.passiveState.knifeUsed) return dmg;
      C.passiveState.knifeUsed = true;
      C.pushLog("One clean cut.", "proc");
      return dmg * 3;
    },
  },

  /* Grows with realm depth, so it is worthless on a fresh run and formidable deep. */
  weight_of_years: {
    statMods() {
      const d = (S.run && S.run.depth) || 0;
      return { dr: Math.min(40, d * 2), allDmg: d * 3 };
    },
  },

  /* One of five large blessings, rolled fresh every fight. */
  opus_fragment: {
    fightStart(C) {
      const rolls = [
        { name: "Unwritten Fury", mods: { allDmg: 35 } },
        { name: "Unwritten Precision", mods: { crit: 25, critDmg: 30 } },
        { name: "Unwritten Speed", mods: { haste: 35 } },
        { name: "Unwritten Hunger", mods: { lifesteal: 12 } },
        { name: "Unwritten Ward", mods: { dr: 18, armorPct: 30 } },
      ];
      const r = pick(rolls);
      C.player.buffs.push({ id: "opus_roll", name: r.name, mods: r.mods, remaining: 9999 });
      C.refreshStats();
      C.pushLog(`The page reads: ${r.name}.`, "proc");
    },
  },
};

/* ---------------------------------------------------------------------------
   Collecting what is currently equipped. Cached onto the stat block so the
   combat loop never walks the equipment list mid-fight.
   --------------------------------------------------------------------------- */
function collectPassives() {
  const out = [];
  for (const slot of SLOTS) {
    const item = S.equipment[slot.key];
    if (item && item.passive && PASSIVES[item.passive.id]) {
      out.push({ id: item.passive.id, def: PASSIVES[item.passive.id], name: item.passive.name });
    }
  }
  return out;
}

/* Passives that alter the character sheet rather than the fight. Kept separate
   because computeStats runs constantly and must stay cheap. */
function passiveStatMods() {
  const mods = {};
  for (const slot of SLOTS) {
    const item = S.equipment[slot.key];
    if (!item || !item.passive) continue;
    const def = PASSIVES[item.passive.id];
    if (def && def.statMods) addMods(mods, def.statMods(Combat));
  }
  return mods;
}


/* ======== js/core/character.js ======== */
/* ===========================================================================
   CHARACTER — turning gear + talents + buffs into numbers combat can use.
   ---------------------------------------------------------------------------
   Everything funnels through one modifier bag. Item stats, talent ranks,
   enchants, potion buffs and spell buffs all speak the same keys, so adding a
